  letter-spacing: 0.12em;
  color: var(--text3);
  margin-bottom: 2px;
}

/* ── Recent words strip ── */
.rep-recent-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 0 10px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.rep-recent-strip::-webkit-scrollbar { display: none; }

.rep-recent-card {
  flex: 0 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  min-width: 110px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.rep-recent-card::after {
  content: '';
  position: absolute;
  bottom: -20px; right: -20px;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle, #14B8A6 0%, transparent 70%);
  opacity: 0.12;
}
.rep-recent-card:hover { border-color: #14B8A6; transform: translateY(-2px); }
.rep-recent-word {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
}
.rep-recent-ipa {
  font-family: var(--font-display);
  font-size: 10px;
  color: #14B8A6;
}
.rep-recent-date {
  font-size: 10px;
  color: var(--text3);
  margin-top: 4px;
}
.rep-empty-recent {
  color: var(--text3);
  font-size: 13px;
  padding: 16px 0;
  font-style: italic;
}

.rep-recent-action-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(20,184,166,0.1);
  border: 1px solid rgba(20,184,166,0.35);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  margin-bottom: 8px;
}

.rep-recent-card.rep-recent-selected {
  border-color: #14B8A6;
  box-shadow: 0 0 0 2px rgba(20,184,166,0.25);
  background: rgba(20,184,166,0.1);
}
.rep-recent-card.lp-active-recent {
  transform: scale(0.96);
  border-color: rgba(20,184,166,0.5);
}

/* ── Folder system ── */
.rep-folders-area {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.rep-folder {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s;
}
.rep-folder:hover { border-color: var(--border-bright); }

.rep-folder-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}
.rep-folder-icon {
  font-size: 18px;
  line-height: 1;
}
.rep-folder-name {
  flex: 1;
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}
.rep-folder-count {
  font-size: 11px;
  color: var(--text3);
  background: var(--bg3);
  border-radius: 100px;
  padding: 2px 8px;
}
.rep-folder-chev {
  color: var(--text3);
  transition: transform 0.25s;
  width: 16px; height: 16px;
}
.rep-folder-chev.open { transform: rotate(90deg); }

.rep-folder-body {
  display: none;
  border-top: 1px solid var(--border);
}
.rep-folder-body.open { display: block; }

.rep-word-list {
  padding: 8px 0;
}
.rep-word-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  transition: background 0.15s, border-color 0.2s, box-shadow 0.2s;
  border-radius: 8px;
  margin: 2px 8px;
  border: 1px solid transparent;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}
.rep-word-row.lp-active-row {
  border-color: rgba(20,184,166,0.5);
  box-shadow: 0 0 0 2px rgba(20,184,166,0.15);
  background: rgba(20,184,166,0.06);
}
.rep-word-row.rep-selected {
  border-color: #14B8A6;
  box-shadow: 0 0 0 2px rgba(20,184,166,0.25);
  background: rgba(20,184,166,0.08);
}
.rep-word-text {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
}
.rep-word-ipa {
  font-family: var(--font-display);
  font-size: 11px;
  color: var(--text2);
}
.rep-word-quick-btns {
  display: flex;
  gap: 4px;
  align-items: center;
}
.rep-play-btn {
  background: none;
  border: none;
  padding: 5px;
  cursor: pointer;
  color: #14B8A6;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.rep-play-btn:hover { background: rgba(20,184,166,0.15); }
.rep-play-btn svg { width: 14px; height: 14px; }

.rep-word-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.rep-word-delete {
  background: none;
  border: none;
  padding: 4px;
  cursor: pointer;
  color: var(--text3);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.rep-word-delete:hover { color: #F87171; background: rgba(248,113,113,0.1); }
.rep-word-delete svg { width: 14px; height: 14px; }

.rep-move-btn {
  background: none;
  border: none;
  padding: 4px;
  cursor: pointer;
  color: var(--text3);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.rep-move-btn:hover { color: #14B8A6; background: rgba(20,184,166,0.1); }
.rep-move-btn svg { width: 14px; height: 14px; }

/* Context actions bar — shown after long press */
.rep-word-ctx {
  display: none;
  gap: 6px;
}
.rep-word-row.rep-selected .rep-word-ctx { display: flex; }
.rep-word-row.rep-selected .rep-word-quick-btns { display: none; }

/* Compare bar — shown when 2 words selected */
.rep-compare-bar {
  display: none;
  align-items: center;
  gap: 10px;
  background: rgba(20,184,166,0.12);
  border: 1px solid rgba(20,184,166,0.4);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 0 0 4px;
}
.rep-compare-bar.visible { display: flex; }
.rep-compare-bar-label {
  flex: 1;
  font-size: 13px;
  color: #14B8A6;
  font-weight: 600;
}
.rep-compare-go {
  background: #14B8A6;
  border: none;
  border-radius: 8px;
  padding: 7px 12px;
  color: #05060F;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-body);
  transition: opacity 0.2s;
  white-space: nowrap;
}
.rep-compare-go:hover:not(:disabled) { opacity: 0.85; }
.rep-delete-sel {
  background: rgba(248,113,113,0.15);
  border: 1px solid rgba(248,113,113,0.35);
  border-radius: 8px;
  padding: 7px 12px;
  color: #F87171;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-body);
  transition: all 0.15s;
  white-space: nowrap;
}
.rep-delete-sel:hover { background: rgba(248,113,113,0.25); }
.rep-compare-cancel {
  background: none;
  border: none;
  padding: 6px;
  cursor: pointer;
  color: var(--text3);
  font-size: 18px;
  line-height: 1;
  transition: color 0.15s;
}
.rep-compare-cancel:hover { color: var(--text); }

/* Pick-mode: one word selected, waiting for 2nd tap */
.rep-word-list.rep-pick-mode .rep-word-row:not(.rep-selected) {
  cursor: pointer;
  border-color: rgba(20,184,166,0.15);
}
.rep-word-list.rep-pick-mode .rep-word-row:not(.rep-selected):hover {
  border-color: rgba(20,184,166,0.45);
  background: rgba(20,184,166,0.04);
}
.rep-word-list.rep-pick-mode .rep-word-row:not(.rep-selected) .rep-play-btn,
.rep-word-list.rep-pick-mode .rep-word-row:not(.rep-selected) .rep-word-quick-btns,
.rep-word-list.rep-pick-mode .rep-word-row:not(.rep-selected) .rep-word-ctx {
  opacity: 0.25;
  pointer-events: none;
}
.rep-word-list.rep-pick-mode .rep-word-row:not(.rep-selected) .rep-word-text {
  pointer-events: none;
}

.rep-folder-empty {
  padding: 14px 16px;
  color: var(--text3);
  font-size: 13px;
  font-style: italic;
}

/* ── New folder button ── */
.rep-new-folder-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 1px dashed var(--border-bright);
  border-radius: var(--radius);
  padding: 12px 16px;
  cursor: pointer;
  color: var(--text3);
  font-size: 13px;
  font-family: var(--font-body);
  transition: all 0.2s;
  width: 100%;
}
.rep-new-folder-btn:hover { border-color: #14B8A6; color: #14B8A6; background: rgba(20,184,166,0.04); }
.rep-new-folder-btn svg { width: 16px; height: 16px; }

/* Glowing state when no folders exist */
.rep-new-folder-btn--glow {
  border-color: rgba(139,92,246,0.7);
  color: #A78BFA;
  background: rgba(139,92,246,0.06);
  box-shadow: 0 0 0 0 rgba(139,92,246,0.4);
  animation: repFolderGlow 2.2s ease-in-out infinite;
}
.rep-new-folder-btn--glow svg { color: #A78BFA; }
.rep-new-folder-btn--glow:hover {
  border-color: #8B5CF6;
  color: #C4B5FD;
  background: rgba(139,92,246,0.14);
  box-shadow: 0 0 20px rgba(139,92,246,0.35);
  animation: none;
}
@keyframes repFolderGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.0); border-color: rgba(139,92,246,0.4); }
  50%       { box-shadow: 0 0 18px 4px rgba(139,92,246,0.28); border-color: rgba(139,92,246,0.85); }
}

/* Empty state for repertoire */
.rep-empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 20px 16px;
  text-align: center;
}
.rep-empty-icon { font-size: 38px; margin-bottom: 10px; }
.rep-empty-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.rep-empty-sub {
  font-size: 13px;
  color: var(--text3);
  line-height: 1.5;
  max-width: 260px;
  margin-bottom: 12px;
}
.rep-empty-arrow {
  font-size: 22px;
  color: rgba(139,92,246,0.6);
  animation: repArrowBounce 1.4s ease-in-out infinite;
}
@keyframes repArrowBounce {
  0%,100% { transform: translateY(0); opacity: 0.6; }
  50%     { transform: translateY(5px); opacity: 1; }
}

/* ── Export / Import bar ── */
.rep-data-bar {
  display: flex;
  gap: 8px;
  padding: 0;
}
.rep-data-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-body);
  font-weight: 600;
  color: var(--text2);
  transition: all 0.2s;
}
.rep-data-btn:hover { border-color: #14B8A6; color: #14B8A6; }
.rep-data-btn svg { width: 14px; height: 14px; }

/* ── Rep-nav button — jumps to Répertoire folder for current word ── */
.wf-rep-nav-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(20,184,166,0.08);
  border: 1.5px solid rgba(20,184,166,0.2);
  border-radius: 10px;
  width: 38px; height: 38px;
  display: flex;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  color: rgba(20,184,166,0.55);
  opacity: 0.75;
}
.wf-rep-nav-btn:hover { background: rgba(20,184,166,0.18); border-color: #14B8A6; color: #14B8A6; opacity: 1; }
.wf-rep-nav-btn.visible { color: #14B8A6; border-color: rgba(20,184,166,0.5); opacity: 1; }
.wf-rep-nav-btn svg { width: 15px; height: 15px; }

/* ── Save-to-workbook button on Mot en Focus — hidden, kept for JS ── */
.wf-save-btn {
  display: none !important;
}

/* ── Compare pill button — absolute bottom-centre of word card ── */
.wf-compare-btn {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,184,166,0.08);
  border: 1.5px solid rgba(20,184,166,0.25);
  border-radius: 20px;
  padding: 5px 10px 5px 7px;
  display: flex; align-items: center; gap: 5px;
  cursor: pointer;
  transition: all 0.2s;
  color: rgba(20,184,166,0.7);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.wf-compare-btn:hover { background: rgba(20,184,166,0.18); border-color: #14B8A6; color: #14B8A6; }
.wf-compare-btn svg { width: 13px; height: 13px; }
.wf-compare-btn.active { background: rgba(20,184,166,0.15); border-color: #14B8A6; color: #14B8A6; }

/* ── Action row: zero-height wrapper for JS visibility toggle ── */
.wf-action-row {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 0;
  overflow: visible;
  pointer-events: none;
}
.wf-action-row > * { pointer-events: all; }
.wf-action-row .wf-rhymes-btn { flex: unset; margin: 0; }
.wf-action-row .wf-compare-btn { flex: unset; margin: 0; }

.wf-flip-btn {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  background: rgba(20,184,166,0.08);
  border: 1px solid rgba(20,184,166,0.3);
  border-radius: 10px;
  color: #14B8A6;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.wf-flip-btn:hover { background: rgba(20,184,166,0.18); border-color: #14B8A6; }
.wf-flip-btn.active { background: rgba(20,184,166,0.2); border-color: #14B8A6; }
.wf-flip-btn svg { width: 16px; height: 16px; }

/* ── MOF Definition panel ── */
.wf-def-panel {
  background: rgba(20,184,166,0.06);
  border: 1px solid rgba(20,184,166,0.2);
  border-radius: var(--radius-sm);
  padding: 14px 14px 12px;
  animation: fadeInCtx 0.22s ease both;
}
.wf-def-content {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}
.wf-def-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(20,184,166,0.1);
  border: 1px solid rgba(20,184,166,0.3);
  border-radius: 7px;
  padding: 5px 10px;
  color: #14B8A6;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.wf-def-action-btn:hover { background: rgba(20,184,166,0.2); border-color: #14B8A6; }
.wf-def-ai-btn { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.35); color: #A78BFA; }
.wf-def-ai-btn:hover { background: rgba(167,139,250,0.2); border-color: #A78BFA; }

/* ── Font-size stepper (shared between settings + card back) ── */
.fs-stepper {
  display: inline-flex;
  align-items: center;
  gap: 0;
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  overflow: hidden;
  height: 34px;
}
.fs-stepper-btn {
  width: 32px;
  height: 34px;
  background: var(--surface);
  border: none;
  color: var(--text2);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-family: var(--font-body);
}
.fs-stepper-btn:hover { background: var(--surface2); color: var(--text); }
.fs-stepper-btn:active { background: var(--border-bright); }
.fs-stepper-val {
  min-width: 36px;
  height: 34px;
  background: var(--surface2);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  outline: none;
  font-family: var(--font-display);
  padding: 0 4px;
}
/* Card-back Aa stepper — compact version */
/* ── Aa font-size toggle (card back) ── */
.gr-fs-wrap {
  position: absolute;
  top: -4px;
  right: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}
/* The circle button — shows "Aa" collapsed, font-size number when expanded */
.gr-fs-toggle {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 50%, transparent);
  background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 12%, transparent);
  color: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 90%, var(--text));
  font-size: 11px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
  font-family: var(--font-display);
  flex-shrink: 0;
  letter-spacing: -0.03em;
  order: 2; /* always in the middle */
}
.gr-fs-toggle:hover { background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 22%, transparent); }
/* − and + side buttons */
.gr-fs-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 35%, transparent);
  background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 8%, transparent);
  color: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 85%, var(--text));
  font-size: 16px; font-weight: 700; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  font-family: var(--font-body);
}
.gr-fs-btn:hover { background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 22%, transparent); }
.gr-fs-btn.gr-fs-minus { order: 1; }
.gr-fs-btn.gr-fs-plus  { order: 3; }
/* Hidden state */
.gr-fs-btn.gr-fs-hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.5);
  width: 0; height: 0; border: none; padding: 0; margin: 0;
  overflow: hidden;
}
.gr-fs-btn { transition: opacity 0.15s, transform 0.15s, width 0.15s, height 0.15s; }
.wf-def-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.5;
  min-height: 80px;
  outline: none;
  transition: border-color 0.2s;
  white-space: pre-wrap;
  word-break: break-word;
  cursor: text;
  box-sizing: border-box;
}
.wf-def-textarea:focus { border-color: rgba(20,184,166,0.5); }

/* ── MOF card back (flip) ── */
.wf-card-back {
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 52px; /* space for flip btn */
  min-height: 160px;
}
.wf-card-back-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #14B8A6;
  opacity: 0.7;
  margin-bottom: 6px;
}

/* ── Rhymes pill button — bottom-left of word card ── */
.wf-rhymes-btn {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(251,191,36,0.08);
  border: 1.5px solid rgba(251,191,36,0.3);
  border-radius: 20px;
  padding: 5px 10px 5px 7px;
  display: flex; align-items: center; gap: 5px;
  cursor: pointer;
  transition: all 0.2s;
  color: rgba(251,191,36,0.8);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
}
.wf-rhymes-btn:hover { background: rgba(251,191,36,0.15); border-color: #FBBF24; color: #FBBF24; }
.wf-rhymes-btn svg { width: 13px; height: 13px; }
.wf-rhymes-btn.loading { opacity: 0.6; cursor: wait; }

/* Grenier smart-add button — same height as Analyser, sits right below it */
.wf-grenier-add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 18px;
  background: linear-gradient(135deg, rgba(139,92,246,0.22) 0%, rgba(109,40,217,0.15) 100%);
  border: 1.5px solid rgba(139,92,246,0.55);
  border-radius: 10px;
  color: #A78BFA;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
/* Déjà au Grenier : le bouton s'éteint pour qu'on le voie au premier regard. */
.wf-grenier-add-btn.in-grenier {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text3);
}
.wf-grenier-add-btn.in-grenier:hover {
  background: var(--surface2);
  border-color: var(--border-bright);
  color: var(--text2);
}
.wf-grenier-add-btn:hover {
  background: linear-gradient(135deg, rgba(139,92,246,0.35) 0%, rgba(109,40,217,0.28) 100%);
  border-color: #8B5CF6;
  color: #C4B5FD;
  box-shadow: 0 0 14px rgba(139,92,246,0.3);
}
.wf-grenier-add-btn svg { flex-shrink: 0; }

/* ── Context (AI) button ── */
.wf-context-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, rgba(251,191,36,0.15) 0%, rgba(245,158,11,0.1) 100%);
  border: 1.5px solid rgba(251,191,36,0.45);
  border-radius: 10px;
  color: #FBBF24;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.wf-context-btn:hover:not(:disabled) { background: linear-gradient(135deg,rgba(251,191,36,0.28) 0%,rgba(245,158,11,0.2) 100%); border-color: #FBBF24; box-shadow: 0 0 12px rgba(251,191,36,0.25); }
.wf-context-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.wf-context-btn svg { width: 16px; height: 16px; }

/* ── Context input row ── */
.wf-context-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 0 2px;
  animation: fadeInCtx 0.22s ease both;
}
@keyframes fadeInCtx {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* Les deux champs doivent avoir la MÊME largeur. La colonne de droite
   (bouton + espace) fait 46px : la rangée du haut réserve donc autant
   lorsque le contexte est ouvert. */
.wf-input-row.wf-with-ctx { padding-right: 46px; }
.wf-ctx-field {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
}
.wf-context-input {
  width: 100%;
  background: rgba(251,191,36,0.06);
  border: 1.5px solid rgba(251,191,36,0.3);
  border-radius: 10px;
  padding: 9px 34px 9px 14px;   /* place pour le ✕ à l'intérieur */
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.wf-context-input:focus { border-color: rgba(251,191,36,0.65); }
.wf-context-input::placeholder { color: var(--text3); }
.wf-context-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: 4px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  transition: color 0.15s;
  flex-shrink: 0;
}
.wf-context-clear:hover { color: var(--text); }
/* Reprendre le mot du champ du haut dans la phrase de contexte. */
.wf-ctx-insert {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(251,191,36,0.10);
  border: 1.5px solid rgba(251,191,36,0.35);
  border-radius: 10px;
  color: #FBBF24;
  cursor: pointer;
  transition: all 0.15s;
}
.wf-ctx-insert svg { width: 17px; height: 17px; }
.wf-ctx-insert:hover { background: rgba(251,191,36,0.22); border-color: #FBBF24; }
.wf-ctx-insert:active { transform: scale(0.94); }

/* ── Rhymes result strip ── */
.wf-rhymes-strip {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 16px 4px;
  animation: fadeInRhymes 0.3s ease both;
}
@keyframes fadeInRhymes {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.wf-rhymes-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.wf-rhymes-title {
  font-size: 9px;
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #FBBF24;
}
.wf-rhymes-dismiss {
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.15s;
}
.wf-rhymes-dismiss:hover { color: var(--text); }
.wf-rhymes-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.wf-rhyme-chip {
  background: rgba(251,191,36,0.08);
  border: 1px solid rgba(251,191,36,0.25);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.wf-rhyme-chip:hover { background: rgba(251,191,36,0.15); border-color: #FBBF24; color: #FBBF24; transform: translateY(-1px); }
.wf-rhyme-chip-ipa {
  font-family: var(--font-display);
  font-size: 10px;
  color: rgba(251,191,36,0.6);
}

/* ── WF Compare second word ── */
.wf-compare-add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: transparent;
  border: 1.5px dashed rgba(20,184,166,0.4);
  border-radius: var(--radius);
  padding: 11px 16px;
  color: rgba(20,184,166,0.7);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
  margin-top: 2px;
}
.wf-compare-add-btn:hover { border-color: #14B8A6; color: #14B8A6; background: rgba(20,184,166,0.05); }
.wf-compare-add-btn svg { width: 15px; height: 15px; }

.wf-compare-card {
  background: linear-gradient(135deg, rgba(20,184,166,0.06) 0%, var(--surface) 100%);
  border: 1px solid rgba(20,184,166,0.3);
  border-radius: var(--radius);
  padding: 16px 18px 18px;
  margin-top: 8px;
  position: relative;
  animation: slideInCompare 0.25s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
@keyframes slideInCompare {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.wf-compare-label {
  font-size: 9px;
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #14B8A6;
  margin-bottom: 10px;
}
.wf-compare-dismiss {
  position: absolute;
  top: 10px; right: 10px;
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  font-size: 14px;
  line-height: 1;
  transition: color 0.15s;
}
.wf-compare-dismiss:hover { color: var(--text); }

.wf-swap-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  background: rgba(20,184,166,0.08);
  border: 1px solid rgba(20,184,166,0.35);
  border-radius: var(--radius-sm);
  padding: 9px 16px;
  color: #14B8A6;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 10px;
}
.wf-swap-btn:hover { background: rgba(20,184,166,0.15); border-color: #14B8A6; transform: scale(1.01); }

/* ── Move-to-folder overlay ── */
.rep-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,6,15,0.7);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  padding: 20px;
}
.rep-overlay-panel {
  background: var(--bg2);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-lg);
  padding: 20px;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.rep-overlay-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: #14B8A6;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}
.rep-overlay-subtitle {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 4px;
}
.rep-overlay-folder-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
  text-align: left;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.rep-overlay-folder-btn:hover { border-color: #14B8A6; color: #14B8A6; }
.rep-overlay-folder-btn span { font-size: 18px; }
.rep-overlay-cancel {
  background: none;
  border: none;
  padding: 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text3);
  font-family: var(--font-body);
  text-align: center;
  width: 100%;
  transition: color 0.15s;
}
.rep-overlay-cancel:hover { color: var(--text); }
.rep-overlay-input {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  width: 100%;
  outline: none;
  transition: border-color 0.2s;
}
.rep-overlay-input:focus { border-color: #14B8A6; }
.rep-overlay-confirm {
  background: #14B8A6;
  border: none;
  border-radius: var(--radius-sm);
  padding: 11px 20px;
  color: #05060F;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  transition: opacity 0.2s;
}
.rep-overlay-confirm:hover { opacity: 0.85; }

/* ── BILAN ───────────────────────────────────────────────────── */
.bilan-num-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 4px 0 2px;
  min-height: 40px;
}


.bilan-intro { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.bilan-icon { font-size: 36px; }
.bilan-intro p { font-size: 13px; color: var(--text2); line-height: 1.6; max-width: 320px; }
.generate-passage-btn { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, #C084FC 15%, var(--surface)); border: 1px solid color-mix(in srgb, #C084FC 40%, transparent); border-radius: 100px; padding: 11px 24px; color: #C084FC; font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.generate-passage-btn:hover { background: color-mix(in srgb, #C084FC 25%, var(--surface)); transform: scale(1.02); }
.generate-passage-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.generate-passage-btn svg { width: 16px; height: 16px; }
.bilan-passage-card { background: var(--surface); border: 1px solid color-mix(in srgb, #C084FC 25%, var(--border)); border-radius: var(--radius-lg); padding: 20px; }
.bilan-action-btn {
  background: var(--surface2);
  border: 1px solid color-mix(in srgb, #2DD4BF 30%, var(--border));
  border-radius: 10px;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: #2DD4BF;
  transition: all 0.2s;
  flex-shrink: 0;
}
.bilan-action-btn:hover:not(:disabled) { border-color: #2DD4BF; background: color-mix(in srgb, #2DD4BF 15%, var(--surface2)); }
.bilan-action-btn:disabled { opacity: 0.3; cursor: default; }
.bilan-action-btn svg { width: 17px; height: 17px; }
.bilan-tip {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 12px;
  color: var(--text3);
  line-height: 1.5;
  padding: 0 4px;
}

.bilan-empty { text-align: center; padding: 32px 20px; color: var(--text3); font-size: 14px; line-height: 1.6; }
/* ── PASSAGE NUMBER STRIP CAROUSEL ──────────────────────────── */
.read-num-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 4px 0 2px;
  min-height: 40px;
}
.pnum-btn {
  border-radius: 50%;
  border: 2px solid;
  font-family: var(--font-display);
  font-weight: 800;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.pnum-btn:active { transform: scale(0.88); }
.pnum-active { box-shadow: 0 0 12px 2px color-mix(in srgb, currentColor 40%, transparent); }
.pnum-add {
  width: 26px !important;
  height: 26px !important;
  font-size: 18px !important;
  font-weight: 400 !important;
  border-color: #F59E0B !important;
  color: #F59E0B !important;
  background: transparent !important;
}

/* ── RECORD RING (side by side with score ring) ─────────────── */
.score-display {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.record-ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.score-ring-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text3);
}
/* When record ring is present, lay rings side by side */
.score-display:has(.record-ring-wrap) {
  flex-direction: row;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}
.score-display:has(.record-ring-wrap) .score-feedback {
  width: 100%;
  text-align: center;
  order: 10;
}
.score-display:has(.record-ring-wrap) .score-sub-row {
  width: 100%;
  order: 11;
}
.score-display:has(.record-ring-wrap) .score-ring {
  width: 90px;
  height: 90px;
}
.score-display:has(.record-ring-wrap) .score-ring .score-number {
  font-size: 22px !important;
}
.score-display:has(.record-ring-wrap) .record-ring-wrap .score-ring {
  width: 80px;
  height: 80px;
}

/* ── READ PASSAGE WRAP (card + chevrons inline) ──────────────── */
.read-passage-wrap {
  display: flex;
  align-items: center;
  gap: 0;
  width: 100%;
  position: relative;
}
.read-chev {
  background: transparent;
  border: none;
  padding: 8px 4px;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.2s, transform 0.15s;
  display: flex;
  align-items: center;
}
.read-chev:active { transform: scale(0.85); }
.read-chev svg { width: 24px; height: 24px; filter: drop-shadow(0 0 4px currentColor); }
.read-chev.invisible { visibility: hidden; pointer-events: none; }
.read-chev-l { padding-right: 6px; }
.read-chev-r { padding-left: 6px; }
.read-passage-wrap .passage-card { flex: 1; min-width: 0; }

/* ── NUMBERED PASSAGE/WORD BUTTONS ──────────────────────────── */
.passage-num-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.passage-num-btn:active { transform: scale(0.9); }
.passage-add-btn {
  font-size: 18px !important;
  font-weight: 400 !important;
}
.carousel-num-btn {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.carousel-num-btn:active { transform: scale(0.88); }

/* ── READ CAROUSEL LAYOUT ────────────────────────────────────── */
/* .read-carousel/.read-center/.read-passage-nums replaced by read-num-strip */
.passage-best-score {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
}

/* Bonus passage card */
.bonus-passage {
  border-color: rgba(245,158,11,0.35) !important;
  background: linear-gradient(135deg, rgba(245,158,11,0.06) 0%, var(--surface) 100%) !important;
}
.bonus-badge {
  font-size: 11px;
  font-weight: 700;
  color: #F59E0B;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

/* invisible arrow placeholder keeps layout stable */
.invisible { visibility: hidden; pointer-events: none; }

/* ── WORD ANNOTATION OVERLAY ─────────────────────────────────── */
.annotate-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px auto 0;
  background: color-mix(in srgb, #C084FC 12%, var(--surface));
  border: 1px solid color-mix(in srgb, #C084FC 35%, transparent);
  border-radius: 100px;
  padding: 9px 20px;
  color: #C084FC;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.annotate-btn:hover { background: color-mix(in srgb, #C084FC 22%, var(--surface)); }
.annotate-btn svg { width: 16px; height: 16px; }

.annotation-overlay {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ann-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.ann-legend-item { display: flex; align-items: center; gap: 4px; }
.ann-text {
  font-size: 15px;
  line-height: 2.2;
  color: var(--text);
}
.ann-word {
  position: relative;
  display: inline;
  border-radius: 4px;
  padding: 1px 3px;
  cursor: default;
  transition: all 0.15s;
}
.ann-score {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg);
  border: 1px solid var(--border-bright);
  border-radius: 6px;
  padding: 3px 7px;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}
.ann-word:hover .ann-score,
.ann-word:active .ann-score { display: block; }
.ann-good    { background: rgba(52,211,153,0.18); color: #34D399; border-bottom: 2px solid #34D399; }
.ann-ok      { background: rgba(251,191,36,0.15); color: #FBBF24; border-bottom: 2px solid #FBBF24; }
.ann-bad     { background: rgba(248,113,113,0.18); color: #F87171; border-bottom: 2px solid #F87171; }
.ann-omission{ background: rgba(156,163,175,0.15); color: #9CA3AF; border-bottom: 2px dashed #9CA3AF; text-decoration: line-through; }
.ann-neutral { color: var(--text); }
.ann-tappable { cursor: pointer; transition: filter 0.15s; }
.ann-tappable:hover { filter: brightness(1.35); }
.ann-tappable:active { filter: brightness(0.8) scale(0.96); transform: scale(0.96); }

/* ── WORD FOCUS ─────────────────────────────────────────────── */
.wf-container { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; overflow: hidden; }

.wf-input-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.wf-input-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
}
.wf-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 22px;
  font-weight: 500;
  outline: none;
  transition: border-color 0.2s;
  min-width: 0;
}
.wf-input:focus { border-color: #14B8A6; }
.wf-input::placeholder { color: var(--text3); font-size: 18px; font-weight: 400; }
.wf-go-btn {
  background: linear-gradient(135deg, #14B8A6, #0D9488);
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  color: #fff;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
  align-self: stretch;
}
.wf-go-btn:hover { opacity: 0.88; }
.wf-go-btn:active { transform: scale(0.96); }
/* Deep search mode — Chercher button */
.wf-go-btn.wf-chercher-mode {
  background: linear-gradient(135deg, #8B5CF6, #7C3AED);
  box-shadow: 0 0 16px rgba(139,92,246,0.35);
}
.wf-go-btn.wf-chercher-mode:hover { opacity: 0.9; box-shadow: 0 0 22px rgba(139,92,246,0.5); }
/* Deep search exit button */
.wf-deep-exit-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  background: rgba(139,92,246,0.12);
  border: 1.5px solid rgba(139,92,246,0.45);
  border-radius: 10px;
  color: #A78BFA;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.wf-deep-exit-btn:hover { background: rgba(139,92,246,0.25); border-color: #8B5CF6; color: #C4B5FD; }
/* Deep search results */
.wf-deep-results {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  max-height: calc(100vh - 260px); /* leaves room for header + input bar */
  flex-shrink: 0;
  padding-right: 2px; /* prevents scrollbar overlap */
}
.wf-deep-result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.18s;
  flex-shrink: 0; /* never squish — scroll instead */
  min-height: 80px;
}
.wf-deep-result-card:hover, .wf-deep-result-card:active {
  border-color: rgba(139,92,246,0.5);
  background: var(--surface2);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.wf-deep-result-word {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
}
.wf-deep-result-deck {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.wf-deep-result-snippets {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.wf-deep-result-snippet {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.wf-deep-hit { color: #C4B5FD; font-weight: 800; font-size: 1.08em; background: rgba(139,92,246,0.18); border-radius: 3px; padding: 0 2px; }
.wf-deep-no-results {
  text-align: center;
  color: var(--text3);
  font-size: 13px;
  padding: 32px 0;
}
/* Second-row buttons area */
.wf-btn-row {
  display: flex;
  gap: 10px;
}

.wf-word-card {
  background: var(--surface);
  border: 1px solid rgba(20, 184, 166, 0.25);
  border-radius: var(--radius);
  padding: 24px 20px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  box-sizing: border-box;
}
/* When showing the definition back-panel, the card becomes a scroll container */
.wf-word-card.wf-card-scrollable {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  min-height: 0;
  align-items: stretch;
}
.wf-word-display {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
  text-align: center;
}
.wf-ipa {
  font-size: 18px;
  color: #14B8A6;
  letter-spacing: 0.04em;
  min-height: 26px;
  text-align: center;
}
.wf-ipa-loading { color: var(--text3); font-size: 13px; font-style: italic; }

.wf-listen-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  justify-content: center;
  width: 100%;
}
.wf-listen-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  background: var(--surface2);
  border: 1px solid rgba(20,184,166,0.3);
  border-radius: 12px;
  padding: 11px 14px;
  color: #14B8A6;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.wf-listen-btn:hover { background: rgba(20,184,166,0.12); border-color: #14B8A6; }
.wf-listen-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.wf-listen-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

.wf-record-section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wf-record-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}
.wf-record-inner {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #14B8A6 0%, #0D9488 100%);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 0 0 0 rgba(20,184,166,0.4);
}
.wf-record-inner svg { width: 28px; height: 28px; color: #fff; }
.wf-record-btn:hover .wf-record-inner { transform: scale(1.05); }
.wf-record-btn.recording .wf-record-inner {
  background: linear-gradient(135deg, #F87171, #EF4444);
  animation: wf-pulse 1.2s ease-in-out infinite;
}
@keyframes wf-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); }
  50% { box-shadow: 0 0 0 12px rgba(248,113,113,0); }
}
.wf-record-label { font-size: 12px; color: var(--text2); font-family: var(--font-body); }

.wf-history {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.wf-history-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text3);
  margin-bottom: 12px;
}
.wf-history-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.wf-history-chip {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.wf-history-chip:hover { border-color: #14B8A6; color: #14B8A6; }
.wf-history-chip .wf-chip-score {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 6px;
  background: var(--surface2);
}
.wf-empty-hint {
  font-size: 13px;
  color: var(--text3);
  font-style: italic;
  text-align: center;
  padding: 8px 0;
}

/* long-press ring on ann-words */
.ann-word.lp-active {
  outline: 2px solid #14B8A6;
  outline-offset: 2px;
  border-radius: 4px;
}

.labo-scores-empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--text2);
  font-size: 14px;
  line-height: 1.6;
}

.bilan-saved-msg { font-size: 12px; color: var(--text2); text-align: center; padding: 6px 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }

/* ── BILAN SCORES SECTION ────────────────────────────────────── */
.bilan-summary-section { background: color-mix(in srgb, #3D0066 15%, var(--surface)); border: 1px solid color-mix(in srgb, #C084FC 30%, var(--border)); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.bilan-summary-header { display: flex; align-items: center; justify-content: space-between; }
.bilan-summary-title { font-size: 14px; font-weight: 700; color: #C084FC; }
.bilan-redo-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid color-mix(in srgb, #C084FC 40%, transparent); border-radius: 100px; padding: 6px 14px; color: #C084FC; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.bilan-redo-btn:hover { background: color-mix(in srgb, #C084FC 15%, transparent); }
.bilan-redo-btn svg { width: 13px; height: 13px; }
.bilan-summary-note { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.bilan-cat-list { display: flex; flex-direction: column; gap: 8px; }
.bilan-cat-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); }
.bilan-cat-name { font-size: 13px; font-weight: 600; }
.bilan-cat-scores { display: flex; align-items: center; gap: 6px; }
.bilan-score-latest { font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.bilan-score-sep { color: var(--text3); font-size: 12px; }
.bilan-score-best { font-family: var(--font-display); font-size: 12px; font-weight: 700; opacity: 0.85; }
.bilan-cat-pill { font-family: var(--font-display); font-size: 11px; font-weight: 700; margin-left: 8px; background: var(--surface); border-radius: 6px; padding: 2px 6px; border: 1px solid var(--border); }

/* ── LABO THEME ──────────────────────────────────────────────── */

/* Beaker button on home — glows teal */
.labo-btn {
  color: #00F5D4 !important;
  position: relative;
}
.labo-btn svg {
  filter: drop-shadow(0 0 6px rgba(0,245,212,0.5));
}

/* Labo header background wash */
.labo-header {
  position: relative;
}
.labo-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,245,212,0.07) 0%, transparent 70%);
  pointer-events: none;
  border-radius: inherit;
}

/* Labo logo */
.labo-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.labo-logo-icon {
  width: 28px;
  height: 28px;
  color: #00F5D4;
  filter: drop-shadow(0 0 8px rgba(0,245,212,0.6));
  flex-shrink: 0;
}
.labo-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(135deg, #00F5D4 0%, #2DD4BF 50%, #67E8F9 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}
.labo-tagline {
  font-size: 12px;
  color: #2DD4BF !important;
  opacity: 0.8;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 600;
}

/* Home button inside labo header */
.labo-home-btn {
  color: #C084FC !important;
}
.labo-home-btn svg {
  filter: drop-shadow(0 0 6px rgba(192,132,252,0.55));
}
.labo-scores-btn {
  color: #00F5D4 !important;
}
.labo-scores-btn svg {
  filter: drop-shadow(0 0 5px rgba(0,245,212,0.4));
}

/* Labo grid — same layout as home */
.labo-grid {
  /* inherits .category-grid styles */
}

/* Labo tiles — teal family glow overrides */
.labo-tile {
  position: relative;
  overflow: hidden;
}
.labo-tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 30%, color-mix(in srgb, var(--cat-accent) 12%, transparent), transparent 70%);
  pointer-events: none;
}
.labo-tile:hover {
  box-shadow: 0 0 0 1px var(--cat-accent), 0 4px 24px color-mix(in srgb, var(--cat-accent) 20%, transparent);
}
.labo-tile .cat-icon {
  font-size: 28px;
}
.labo-tile .cat-label {
  color: var(--cat-accent);
}

/* Coming soon tiles */
.labo-coming-soon {
  opacity: 0.55;
  cursor: default;
}
.labo-coming-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: color-mix(in srgb, var(--cat-accent) 20%, transparent);
  border: 1px solid color-mix(in srgb, var(--cat-accent) 40%, transparent);
  border-radius: 100px;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 700;
  color: var(--cat-accent);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Labo screen headers (for Phrase libre / Bilan sub-screens) */
.labo-screen-accent { color: #00F5D4; }

/* ── TILE LOCKED ─────────────────────────────────────────────── */
.tile-locked { opacity: 0.5; filter: grayscale(0.6); cursor: not-allowed; }

/* ── TOAST ───────────────────────────────────────────────────── */
.toast-msg { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border-bright); border-radius: 100px; padding: 12px 24px; font-size: 13px; color: var(--text); text-align: center; opacity: 0; transition: opacity 0.3s, transform 0.3s; z-index: 999; max-width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); pointer-events: none; }
.toast-msg.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── UTILITIES ───────────────────────────────────────────────── */
button { font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ═══════════════════════════════════════════════════════════════
   LE GRENIER — Spaced Repetition Feature (Neon Orange Palette)
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* Thème 2 « Braise » — le réglage par défaut. Les quatre valeurs dérivées
     ci-dessous découlent de --gr-rgb : un thème n'a donc que six lignes à
     redéfinir, et rien ne peut rester orange par oubli. */
  --gr-rgb: 255,107,26;
  --gr-orange: #FF6B1A;
  --gr-orange2: #FF8C42;
  --gr-amber: #FFB347;
  --gr-bg: #100800;
  --gr-bg2: #1A0E00;
  --gr-bg3: #221500;
  --gr-surface: #2A1A00;
  --gr-surface2: #331F00;

  --gr-orange-dim:    rgba(var(--gr-rgb), 0.18);
  --gr-orange-glow:   rgba(var(--gr-rgb), 0.35);
  --gr-border:        rgba(var(--gr-rgb), 0.20);
  --gr-border-bright: rgba(var(--gr-rgb), 0.45);
}

/* ── Entraînement ciblé ──────────────────────────────────────── */
.ph-container { padding: 0 20px 90px; display: flex; flex-direction: column; gap: 12px; }
.ph-intro { font-size: 12px; color: var(--text3); line-height: 1.5; }
.ph-list { display: flex; flex-direction: column; gap: 6px; }
.ph-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}
.ph-row:hover { border-color: var(--border-bright); background: var(--surface2); }
.ph-sym {
  font-family: var(--font-display); font-size: 17px; color: #14B8A6;
  min-width: 42px; flex-shrink: 0;
}
.ph-sym.gros { font-size: 26px; min-width: 52px; }
.ph-label { flex: 1; font-size: 14px; color: var(--text); min-width: 0; }
.ph-chip {
  font-size: 11px; padding: 2px 7px; border-radius: 20px;
  font-family: var(--font-display); flex-shrink: 0;
}
.ph-chip-faible { background: rgba(239,68,68,0.15); color: #F87171; }
.ph-chip-moyen  { background: rgba(245,158,11,0.15); color: #FBBF24; }
.ph-chip-bon    { background: rgba(34,197,94,0.15); color: #4ADE80; }
.ph-chip-neutre { background: rgba(255,255,255,0.05); color: var(--text3); }
.ph-count { font-size: 11px; color: var(--text2); flex-shrink: 0; min-width: 54px; text-align: right; }
.ph-count.vide { color: var(--text3); opacity: 0.5; }
.ph-detail {
  background: rgba(20,184,166,0.06);
  border: 1px solid rgba(20,184,166,0.3);
  border-radius: var(--radius);
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.ph-detail-head { display: flex; align-items: center; gap: 12px; }
.ph-close { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; flex-shrink: 0; }
.ph-close:hover { color: var(--text); }
.ph-words { display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow-y: auto; }
.ph-word {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 6px 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.ph-word:hover { border-color: #14B8A6; }
.ph-word-ipa { font-family: var(--font-display); font-size: 10px; color: #14B8A6; opacity: 0.75; }
.ph-start {
  width: 100%; padding: 13px;
  background: rgba(20,184,166,0.14);
  border: 1.5px solid #14B8A6;
  border-radius: var(--radius-sm);
  color: #14B8A6;
  font-family: var(--font-display); font-size: 14px;
  cursor: pointer;
}
.ph-start:hover { background: rgba(20,184,166,0.24); }

/* ── Mains libres ────────────────────────────────────────────── */
.hf-container {
  padding: 30px 24px 90px;
  display: flex; flex-direction: column;
  align-items: center; gap: 16px;
}
.hf-mot {
  font-family: var(--font-display);
  font-size: 34px; font-weight: 700;
  color: var(--text); text-align: center;
  min-height: 46px; line-height: 1.2;
  word-break: break-word;
}
.hf-etat { font-size: 13px; color: var(--text3); font-family: var(--font-display); }
.hf-play {
  width: 108px; height: 108px; border-radius: 50%;
  background: rgba(20,184,166,0.14);
  border: 2px solid #14B8A6;
  color: #14B8A6;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; margin-top: 8px;
  transition: all 0.15s;
}
.hf-play svg { width: 46px; height: 46px; }
.hf-play:hover:not(:disabled) { background: rgba(20,184,166,0.26); }
.hf-play:active:not(:disabled) { transform: scale(0.95); }
.hf-play:disabled { opacity: 0.3; cursor: default; }
.hf-hint { font-size: 13px; color: var(--text2); text-align: center; }
.hf-stop {
  margin-top: 6px; padding: 11px 26px;
  background: transparent;
  border: 1.5px solid var(--border-bright);
  border-radius: var(--radius-sm);
  color: var(--text2);
  font-family: var(--font-body); font-size: 14px;
  cursor: pointer;
}
.hf-stop:hover { color: var(--text); border-color: var(--text3); }
.hf-reglages {
  width: 100%; max-width: 340px; margin-top: 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.hf-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px; color: var(--text);
  cursor: pointer;
}
.hf-opt input[type=checkbox] { width: 18px; height: 18px; accent-color: #14B8A6; }

/* ── Thèmes du Grenier (le titre les fait défiler) ───────────── */

/* 1 — « Lagune » : la palette de Mot en Focus */
:root[data-gr-theme="1"] {
  --gr-rgb: 20,184,166;
  --gr-orange: #14B8A6;
  --gr-orange2: #2DD4BF;
  --gr-amber: #5EEAD4;
  --gr-bg: #05060F;
  --gr-bg2: #0D0F1E;
  --gr-bg3: #131629;
  --gr-surface: #1A1D35;
  --gr-surface2: #222640;
}

/* 3 — « Néon » : bleu ciel et vert électrique */
:root[data-gr-theme="3"] {
  --gr-rgb: 56,189,248;
  --gr-orange: #38BDF8;
  --gr-orange2: #7DD3FC;
  --gr-amber: #4ADE80;
  --gr-bg: #01080F;
  --gr-bg2: #04121F;
  --gr-bg3: #061A2B;
  --gr-surface: #0A2338;
  --gr-surface2: #0E2C46;
  --gr-border-bright: rgba(74,222,128,0.5);
}

/* 4 — « Fuchsia » : rose et violet */
:root[data-gr-theme="4"] {
  --gr-rgb: 244,114,182;
  --gr-orange: #F472B6;
  --gr-orange2: #F9A8D4;
  --gr-amber: #A78BFA;
  --gr-bg: #0B0413;
  --gr-bg2: #150925;
  --gr-bg3: #1D0D32;
  --gr-surface: #26123F;
  --gr-surface2: #2F164C;
  --gr-border: rgba(167,139,250,0.28);
}

/* 5 — « Givre » : argent glacé, mon choix — le seul thème froid et sobre,
       reposant après quatre palettes saturées */
:root[data-gr-theme="5"] {
  --gr-rgb: 203,213,225;
  --gr-orange: #CBD5E1;
  --gr-orange2: #E2E8F0;
  --gr-amber: #7DD3FC;
  --gr-bg: #06080B;
  --gr-bg2: #0C1116;
  --gr-bg3: #121820;
  --gr-surface: #19212B;
  --gr-surface2: #212B37;
  --gr-orange-glow: rgba(186,230,253,0.35);
}

/* Le titre du Grenier fait office de sélecteur de thème. */
.grenier-titlebox {
  text-align: right;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.grenier-titlebox:active { transform: scale(0.96); opacity: 0.75; }

/* ── Grenier Home ────────────────────────────────────────────── */
.grenier-screen {
  background: var(--gr-bg);
  min-height: 100%;
  position: relative;
}
.grenier-screen::before {
  content: '';
  position: fixed;
  top: -40%;
  left: -40%;
  width: 180%;
  height: 180%;
  background:
    radial-gradient(ellipse 500px 300px at 70% 10%, rgba(var(--gr-rgb),0.07) 0%, transparent 60%),
    radial-gradient(ellipse 400px 300px at 20% 80%, rgba(255,140,66,0.05) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.grenier-header {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 12px;
  background: linear-gradient(180deg, rgba(var(--gr-rgb),0.06) 0%, transparent 100%);
  border-bottom: 1px solid var(--gr-border);
}
.grenier-logo {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.grenier-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--gr-orange);
  letter-spacing: -0.02em;
  text-shadow: 0 0 20px var(--gr-orange-glow);
}
.grenier-tagline {
  font-size: 11px;
  color: rgba(var(--gr-rgb),0.6);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.grenier-header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.grenier-icon-btn {
  background: var(--gr-surface);
  border: 1px solid var(--gr-border);
  border-radius: var(--radius-sm);
  color: var(--gr-orange2);
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.grenier-icon-btn:hover { background: var(--gr-surface2); border-color: var(--gr-border-bright); }
.grenier-icon-btn svg { width: 18px; height: 18px; }

/* Toolbar: view toggle + add button */
.grenier-toolbar {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
}
.grenier-view-toggle {
  display: flex;
  background: var(--gr-surface);
  border: 1px solid var(--gr-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.grenier-view-btn {
  background: none;
  border: none;
  padding: 6px 12px;
  color: var(--gr-orange2);
  opacity: 0.5;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
}
.grenier-view-btn.active {
  background: var(--gr-orange-dim);
  opacity: 1;
  color: var(--gr-orange);
}
.grenier-view-btn svg { width: 15px; height: 15px; }

/* Deck Grid / List */
.grenier-decks-area {
  position: relative;
  z-index: 1;
  padding: 8px 16px 100px;
}
.grenier-decks-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.grenier-decks-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.grenier-empty {
  text-align: center;
  padding: 60px 20px;
  color: rgba(var(--gr-rgb),0.4);
}
.grenier-empty-icon { font-size: 48px; margin-bottom: 12px; }
.grenier-empty-text { font-size: 14px; line-height: 1.5; }

/* Deck Card */
.grenier-deck-card {
  background: var(--gr-surface);
  border: 1px solid var(--gr-border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  text-align: left;
  width: 100%;
}
.grenier-deck-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--deck-accent, var(--gr-orange));
  border-radius: var(--radius) var(--radius) 0 0;
}
.grenier-deck-card:hover {
  transform: translateY(-2px);
  border-color: var(--gr-border-bright);
  box-shadow: 0 8px 24px rgba(var(--gr-rgb),0.12);
}
.grenier-deck-card.deck-selected {
  border-color: var(--deck-accent, var(--gr-orange));
  box-shadow: 0 0 0 2px var(--deck-accent, var(--gr-orange));
}
.grenier-deck-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  margin-bottom: 4px;
  word-break: break-word;
}
.grenier-deck-meta {
  font-size: 11px;
  color: rgba(var(--gr-rgb),0.6);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.grenier-deck-due {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: rgba(var(--gr-rgb),0.15);
  border-radius: 100px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--gr-orange);
}
.grenier-deck-due.zero { background: rgba(255,255,255,0.05); color: var(--text3); }

/* List view deck row */
/* ── mode réorganisation des paquets ──────────────────────── */
.gr-reorder-toggle { margin-left: 8px; }
.gr-reorder-toggle.active {
  background: rgba(var(--gr-rgb),0.15);
  border-color: var(--gr-orange);
  color: var(--gr-orange);
}
.grenier-deck-card.gr-reorder-row {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: default;
}
.gr-reorder-row .grenier-deck-name { flex: 1; margin-bottom: 0; text-align: left; }
.gr-reorder-arrows { display: flex; gap: 6px; flex-shrink: 0; }
.gr-arrow-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--gr-surface2);
  border: 1px solid var(--gr-border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.gr-arrow-btn svg { width: 18px; height: 18px; }
.gr-arrow-btn:hover:not(:disabled) { border-color: var(--gr-orange); color: var(--gr-orange); }
.gr-arrow-btn:disabled { opacity: 0.25; cursor: default; }
.gr-reorder-done {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  background: rgba(var(--gr-rgb),0.12);
  border: 1.5px solid var(--gr-orange);
  border-radius: var(--radius-sm);
  color: var(--gr-orange);
  font-family: var(--font-display);
  font-size: 15px;
  cursor: pointer;
}
.gr-reorder-done:hover { background: rgba(var(--gr-rgb),0.22); }
.grenier-decks-list .grenier-deck-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
}
.grenier-decks-list .grenier-deck-card::before { display: none; }
.grenier-deck-accent-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--deck-accent, var(--gr-orange));
  flex-shrink: 0;
}
.grenier-decks-list .grenier-deck-name { margin-bottom: 0; flex: 1; }

/* FAB button */
.grenier-fab {
  position: fixed;
  bottom: 28px;
  right: 20px;
  z-index: 100;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gr-orange);
  border: none;
  color: #fff;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 20px var(--gr-orange-glow), 0 0 40px rgba(var(--gr-rgb),0.25);
  transition: transform 0.15s, box-shadow 0.15s;
}
.grenier-fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px var(--gr-orange-glow); }
.grenier-fab.open { transform: rotate(45deg); }

/* FAB menu */
.grenier-fab-menu {
  position: fixed;
  bottom: 96px;
  right: 20px;
  z-index: 99;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
  pointer-events: none;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.2s, transform 0.2s;
}
.grenier-fab-menu.open { opacity: 1; transform: translateY(0); pointer-events: all; }
.grenier-fab-item {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  background: none;
  border: none;
}
.grenier-fab-label {
  background: var(--gr-surface2);
  border: 1px solid var(--gr-border-bright);
  border-radius: 100px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gr-orange2);
}
.grenier-fab-icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--gr-surface2);
  border: 1.5px solid var(--gr-border-bright);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

/* ── Deck Context Menu (long press) ─────────────────────────── */
.grenier-ctx-menu {
  position: fixed;
  z-index: 200;
  background: var(--gr-surface2);
  border: 1px solid var(--gr-border-bright);
  border-radius: var(--radius);
  overflow: hidden;
  min-width: 180px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  animation: ctxIn 0.15s ease;
}
@keyframes ctxIn { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
.grenier-ctx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  transition: background 0.15s;
}
.grenier-ctx-item:hover { background: var(--gr-orange-dim); }
.grenier-ctx-item.danger { color: #F87171; }
.grenier-ctx-sep { height: 1px; background: var(--gr-border); margin: 4px 0; }

/* ── New Deck Modal ──────────────────────────────────────────── */
.grenier-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.grenier-modal {
  background: var(--gr-bg2);
  border: 1px solid var(--gr-border-bright);
  border-bottom: none;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 24px 20px 40px;
  width: 100%;
  max-width: 480px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.grenier-modal-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--gr-orange);
  margin-bottom: 20px;
  text-align: center;
}
.grenier-modal-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--gr-orange2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.grenier-modal-input {
  width: 100%;
  background: var(--gr-surface);
  border: 1.5px solid var(--gr-border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 15px;
  color: var(--text);
  font-family: var(--font-body);
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 16px;
}
.grenier-modal-input:focus { border-color: var(--gr-orange); }
.grenier-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.grenier-btn-primary {
  flex: 1;
  background: var(--gr-orange);
  border: none;
  border-radius: var(--radius-sm);
  padding: 13px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  font-family: var(--font-body);
}
.grenier-btn-primary:hover { background: var(--gr-orange2); }
.grenier-btn-secondary {
  flex: 1;
  background: var(--gr-surface);
  border: 1px solid var(--gr-border-bright);
  border-radius: var(--radius-sm);
  padding: 13px;
  color: var(--gr-orange2);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-body);
}

/* colour picker row */
.grenier-color-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.grenier-color-swatch {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.grenier-color-swatch.selected { border-color: #fff; transform: scale(1.15); }

/* folder select chips */
.grenier-folder-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.grenier-folder-chip {
  background: var(--gr-surface);
  border: 1.5px solid var(--gr-border);
  border-radius: 100px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.grenier-folder-chip.selected {
  background: var(--gr-orange-dim);
  border-color: var(--gr-orange);
  color: var(--gr-orange);
}

/* ── Card Creation Screen ────────────────────────────────────── */
.grenier-card-create-screen {
  background: var(--gr-bg);
  min-height: 100%;
  position: relative;
}
.grenier-form-section {
  padding: 0 16px 16px;
  position: relative;
  z-index: 1;
}
.grenier-form-section + .grenier-form-section {
  padding-top: 0;
}

/* ── Study Session ───────────────────────────────────────────── */
.grenier-study-screen {
  background: var(--gr-bg);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.grenier-study-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--gr-border);
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}
.grenier-study-progress {
  flex: 1;
  height: 4px;
  background: var(--gr-surface);
  border-radius: 2px;
  margin: 0 12px;
  overflow: hidden;
}
.grenier-study-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gr-orange), var(--gr-amber));
  border-radius: 2px;
  transition: width 0.4s ease;
}
.grenier-study-count {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--gr-orange);
  white-space: nowrap;
  margin-right: 6px;
}
.grenier-card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 16px 0;
  overflow: hidden;
  position: relative;
  z-index: 1;
  min-height: 0;
}
/* The main card — fixed height, fills available space */
.grenier-card {
  width: 100%;
  max-width: 480px;
  flex: 1;
  min-height: 0;
  background: var(--card-bg, var(--gr-surface));
  border: 1.5px solid var(--card-border, var(--gr-border-bright));
  border-radius: var(--radius-lg);
  padding: 20px 20px 16px;
  position: relative;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(var(--gr-rgb),0.1);
}
.grenier-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--card-accent, var(--gr-orange)), var(--gr-amber));
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.grenier-card-word {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 700;
  text-align: center;
  color: var(--card-accent, var(--gr-orange));
  text-shadow: 0 0 30px var(--gr-orange-glow);
  margin-bottom: 4px;
}
.grenier-card-ipa {
  text-align: center;
  font-size: 18px;
  color: color-mix(in srgb, var(--card-accent, var(--gr-amber)) 70%, var(--gr-amber));
  opacity: 0.85;
  margin-bottom: 4px;
  letter-spacing: 0.03em;
}
.grenier-card-listen-row {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}
.grenier-card-btn {
  flex: 1;
  background: var(--gr-surface2);
  border: 1px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 40%, transparent);
  border-radius: var(--radius-sm);
  padding: 10px;
  color: var(--card-accent, var(--gr-orange2));
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  font-family: var(--font-body);
  transition: background 0.15s;
}
.grenier-card-btn:hover { background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 15%, transparent); }
.grenier-card-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.grenier-record-btn-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 8px 0;
}
.grenier-record-btn {
  width: 68px; height: 68px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--card-accent, var(--gr-orange)), color-mix(in srgb, var(--card-accent, var(--gr-orange)) 60%, #fff));
  border: none;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 20px color-mix(in srgb, var(--card-accent, var(--gr-orange)) 50%, transparent);
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
}
.grenier-record-btn:hover { transform: scale(1.05); }
.grenier-record-btn.recording {
  animation: grPulse 1.2s ease-in-out infinite;
}
@keyframes grPulse {
  0%,100% { box-shadow: 0 4px 20px color-mix(in srgb, var(--card-accent, var(--gr-orange)) 50%, transparent), 0 0 0 0 color-mix(in srgb, var(--card-accent, var(--gr-orange)) 40%, transparent); }
  50% { box-shadow: 0 4px 20px color-mix(in srgb, var(--card-accent, var(--gr-orange)) 50%, transparent), 0 0 0 14px rgba(var(--gr-rgb),0); }
}
.grenier-record-btn svg { width: 28px; height: 28px; }
.grenier-record-label { font-size: 12px; color: var(--card-accent, var(--gr-orange2)); margin-top: 6px; opacity: 0.8; }

/* Card flip button — lower right */
.grenier-flip-btn {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 15%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 45%, transparent);
  color: var(--card-accent, var(--gr-orange));
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 2;
}
.grenier-flip-btn:hover {
  background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 28%, transparent);
  transform: scale(1.1) rotate(12deg);
  box-shadow: 0 2px 10px color-mix(in srgb, var(--card-accent, var(--gr-orange)) 35%, transparent);
}
.grenier-flip-btn svg { width: 18px; height: 18px; }

/* Card back / definition side */
.grenier-card-back {
  padding: 4px 0 8px;
  animation: grFadeIn 0.3s ease;
}
@keyframes grFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.grenier-card-back-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 60%, transparent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.grenier-card-def {
  font-size: 14px;
  line-height: 1.65;
  color: var(--text2);
  background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 6%, transparent);
  border: 1px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 20%, transparent);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  min-height: 60px;
  white-space: pre-wrap;
  word-break: break-word;
}
.grenier-card-def:empty::before {
  content: 'Aucune définition.';
  color: var(--text3);
  font-style: italic;
}
.grenier-def-edit-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  background: none;
  border: 1px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 30%, transparent);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  color: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 80%, var(--text2));
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-body);
}
.grenier-def-edit-btn:hover { background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 12%, transparent); }

/* ── Processing glow: border traces around button ── */
@keyframes btn-border-trace {
  0%   { box-shadow: 0 0 0 1.5px currentColor, 0 0 6px 1px currentColor; opacity: 1; }
  50%  { box-shadow: 0 0 0 2px currentColor, 0 0 12px 3px currentColor; opacity: 0.7; }
  100% { box-shadow: 0 0 0 1.5px currentColor, 0 0 6px 1px currentColor; opacity: 1; }
}
.btn-processing {
  animation: btn-border-trace 1.2s ease-in-out infinite !important;
  cursor: wait !important;
  pointer-events: none;
}
.grenier-def-textarea {
  width: 100%;
  background: var(--gr-bg2);
  border: 1.5px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 50%, transparent);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  color: var(--text);
  font-family: var(--font-body);

  line-height: 1.6;
  min-height: 80px;
  outline: none;
  margin-top: 8px;
  white-space: pre-wrap;
  word-break: break-word;
  cursor: text;
  box-sizing: border-box;
}
.grenier-def-textarea:focus { border-color: var(--card-accent, var(--gr-orange)); }
.grenier-def-textarea:empty:before, .wf-def-textarea:empty:before {
  content: attr(data-placeholder);
  color: var(--text3);
  opacity: 0.5;
  pointer-events: none;
  font-style: italic;
}
.grenier-def-textarea img, .wf-def-textarea img {
  max-width: 100%;
  max-height: 220px;
  border-radius: 6px;
  margin: 4px auto;
  display: block;
  object-fit: contain;
}
.grenier-card-def img, .wf-def-content img {
  max-width: 100%;
  max-height: 220px;
  border-radius: 6px;
  margin: 4px auto;
  display: block;
  object-fit: contain;
}
.def-img-placeholder {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  background: rgba(255,255,255,0.06);
  border: 1px dashed rgba(255,255,255,0.2);
  border-radius: 6px;
  font-size: 12px;
  color: var(--text3);
  font-style: italic;
}

/* Rating buttons */
.grenier-rating-area {
  width: 100%;
  max-width: 480px;
  padding: 12px 16px 16px;
  flex-shrink: 0;
  background: var(--gr-bg);
}
.grenier-rating-label {
  text-align: center;
  font-size: 11px;
  color: rgba(var(--gr-rgb),0.5);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}
.grenier-rating-btns {
  display: flex;
  gap: 8px;
}
.grenier-rate-btn {
  flex: 1;
  border: none;
  border-radius: var(--radius-sm);
  padding: 13px 6px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-body);
  transition: transform 0.1s, opacity 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.grenier-rate-btn:hover { transform: translateY(-2px); }
.grenier-rate-btn span { font-size: 10px; font-weight: 400; opacity: 0.8; }
.gr-rate-again { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.4); color: #F87171; }
.gr-rate-hard  { background: rgba(251,191,36,0.15);  border: 1px solid rgba(251,191,36,0.4);  color: #FBBF24; }
.gr-rate-good  { background: rgba(52,211,153,0.15);  border: 1px solid rgba(52,211,153,0.4);  color: #34D399; }
.gr-rate-easy  { background: rgba(99,102,241,0.15);  border: 1px solid rgba(99,102,241,0.4);  color: #818CF8; }

.grenier-rhymes-btn {
  background: color-mix(in srgb, var(--card-accent, var(--gr-orange)) 10%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--card-accent, var(--gr-orange)) 35%, transparent);
  border-radius: 20px;
  padding: 5px 10px 5px 7px;
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--card-accent, var(--gr-orange));
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  align-self: flex-start;
  margin: 8px 0 0;
  white-space: nowrap;
