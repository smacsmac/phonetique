  async testAzureConnection() {
    const el = document.getElementById('azureTestResult');
    el.style.display = 'block';
    el.style.background = 'rgba(99,179,237,0.1)';
    el.style.color = '#63B3ED';
    el.textContent = 'Test en cours...';

    if (!window.SpeechSDK) {
      el.style.background = 'rgba(248,113,113,0.15)';
      el.style.color = '#F87171';
      el.textContent = '❌ Speech SDK non chargé - vérifiez votre connexion internet';
      return;
    }
    if (!this.settings.azureKey || !this.settings.azureRegion) {
      el.style.background = 'rgba(248,113,113,0.15)';
      el.style.color = '#F87171';
      el.textContent = '❌ Clé ou région manquante';
      return;
    }

    try {
      const SpeechSDK = window.SpeechSDK;
      const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(this.settings.azureKey, this.settings.azureRegion);
      speechConfig.speechRecognitionLanguage = this.settings.frVariant;
      speechConfig.outputFormat = SpeechSDK.OutputFormat.Detailed;

      const silenceWav = this._makeSilenceWav();
      const arrayBuf = await silenceWav.arrayBuffer();
      const pushStream = SpeechSDK.AudioInputStream.createPushStream();
      pushStream.write(arrayBuf);
      pushStream.close();

      const paConfig = new SpeechSDK.PronunciationAssessmentConfig('Bonjour',
        SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
        SpeechSDK.PronunciationAssessmentGranularity.Word, false);

      const audioConfig = SpeechSDK.AudioConfig.fromStreamInput(pushStream);
      const recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);
      paConfig.applyTo(recognizer);

      recognizer.recognizeOnceAsync(result => {
        recognizer.close();
        console.log('Test result:', result.reason, result.json);
        if (result.reason === SpeechSDK.ResultReason.Canceled) {
          const details = SpeechSDK.CancellationDetails.fromResult(result);
          el.style.background = 'rgba(248,113,113,0.15)';
          el.style.color = '#F87171';
          el.textContent = `❌ ${details.errorDetails || details.reason}`;
          return;
        }
        try {
          const d = JSON.parse(result.json);
          const nbest = d?.NBest?.[0];
          const keys = nbest ? Object.keys(nbest) : [];
          const hasPa = keys.some(k => ['PronScore','AccuracyScore','PronunciationAssessment'].includes(k));
          console.log('Test NBest keys:', keys);
          if (hasPa) {
            el.style.background = 'rgba(52,211,153,0.15)';
            el.style.color = '#34D399';
            el.textContent = '✅ Azure OK + Pronunciation Assessment actif!';
          } else {
            el.style.background = 'rgba(251,191,36,0.15)';
            el.style.color = '#FBBF24';
            el.textContent = `⚠️ SDK OK mais pas de scores PA. Clés: ${keys.join(', ') || 'aucun'}. Vérifiez que la ressource Speech Azure supporte la PA.`;
          }
        } catch(e) {
          el.style.background = 'rgba(52,211,153,0.15)';
          el.style.color = '#34D399';
          el.textContent = '✅ Azure connecté (résultat vide - silence envoyé)';
        }
      }, err => {
        recognizer.close();
        el.style.background = 'rgba(248,113,113,0.15)';

      el.style.color = '#F87171';
      el.textContent = `❌ Exception: ${e.message}`;
    }
  },
  _makeSilenceWav() {
    // 0.5s of silence at 16kHz mono 16-bit
    const sr = 16000, dur = 0.5, nc = 1;
    const samples = Math.floor(sr * dur);
    const buf = new ArrayBuffer(44 + samples * 2);
    const v = new DataView(buf);
    const w = (off, s) => { for(let i=0;i<s.length;i++) v.setUint8(off+i, s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4, 36+samples*2, true); w(8,'WAVE'); w(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nc,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*nc*2,true); v.setUint16(32,nc*2,true);
    v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,samples*2,true);
    return new Blob([buf], { type: 'audio/wav' });
  },

    return 'Recommencez — rapprochez-vous du son cible!';

  // ── SM-2-inspired scheduler ───────────────────────────────────
  // ratings: 0=Again 1=Hard 2=Good 3=Easy
  _grSchedule(card, rating) {
    const now = Date.now();
    let { interval = 1, ease = 2.5, reps = 0 } = card;

    // ratings: 0=Again  1=Hard  2=Good  3=Easy
    if (rating === 0) {
      // Forgot — set next due to tomorrow (interval=1) but keep ease penalty
      // This way if the user sees it again this session and rates it, they get real intervals
      interval = 1;
      reps = 0;
      ease = Math.max(1.3, ease - 0.2);
    } else {
      reps += 1;

      if (reps === 1) {
        // First ever correct answer
        interval = rating === 3 ? 4 : rating === 2 ? 1 : 1;
      } else if (reps === 2) {
        // Second correct answer — small fixed step
        interval = rating === 3 ? 7 : rating === 2 ? 3 : 2;
      } else {
        // Established card — multiply current interval
        // Hard  ×1.2  |  Good  ×ease  |  Easy  ×(ease + 0.3)
        const mult = rating === 1
          ? 1.2
          : rating === 2
            ? ease
            : ease + 0.3;
        interval = Math.round(interval * mult);
        // Ensure interval always grows: Hard must be at least +1d over current
        if (rating === 1) interval = Math.max(interval, card.interval + 1);
        // Good and Easy must exceed Hard result
        if (rating >= 2) interval = Math.max(interval, Math.round(card.interval * 1.2) + 1);
      }

      // Adjust ease factor
      if (rating === 1) ease = Math.max(1.3, ease - 0.15);
      if (rating === 3) ease = Math.min(3.0, ease + 0.1);

      // Clamp interval: minimum 1 day, no upper cap
      interval = Math.max(1, interval);
    }

    // Add ±1 day jitter (whole days only) so cards don't all cluster identically,
    // but snapping to midnight still groups same-day cards correctly.
    const jitterDays = Math.floor(Math.random() * 3) - 1; // -1, 0, or +1
    const finalInterval = Math.max(1, interval + (interval > 2 ? jitterDays : 0));

    card.interval = interval;   // store un-jittered for next calculation
    card.ease = ease;
    card.reps = reps;
    card.lastReviewed = now;
    // Snap nextDue to the START of the target day (00:00 local time),
    // so all cards scheduled for the same calendar day appear together.
    const rawDue = now + finalInterval * 86400000;
    const dueDate = new Date(rawDue);
    dueDate.setHours(0, 0, 0, 0);
    card.nextDue = dueDate.getTime();
    return card;
  },

  // Preview what interval each rating would produce (used by button labels)
  _grPreviewIntervals(card) {
    const { interval = 1, ease = 2.5, reps = 0 } = card;
    const preview = (rating) => {
      let iv;
      if (rating === 0) {
        iv = 1;
      } else {
        const nextReps = reps + 1;
        if (nextReps === 1) {
          iv = rating === 3 ? 4 : 1;
        } else if (nextReps === 2) {
          iv = rating === 3 ? 7 : rating === 2 ? 3 : 2;
        } else {
          const mult = rating === 1 ? 1.2 : rating === 2 ? ease : ease + 0.3;
          iv = Math.round(interval * mult);
          if (rating === 1) iv = Math.max(iv, interval + 1);
          if (rating >= 2)  iv = Math.max(iv, Math.round(interval * 1.2) + 1);
        }
        iv = Math.max(1, iv);
      }
      return iv;
    };
    // Compute raw values then enforce strictly ascending order: again < hard < good < easy
    let again = preview(0);
    let hard  = preview(1);
    let good  = preview(2);
    let easy  = preview(3);
    // Each level must be at least 1 day more than the previous
    hard = Math.max(hard, again + 1);
    good = Math.max(good, hard  + 1);
    easy = Math.max(easy, good  + 1);
    return { again, hard, good, easy };
  },

  _grDueCards(deckId) {
    const now = Date.now();
    return (this._grenier.cards || []).filter(c =>
      c.deckId === deckId && !c.deleted && (!c.nextDue || c.nextDue <= now)
    );
  },

  _grDeckDueCount(deckId) {

          </button>` : ''}

          ${emptyHtml}

        </div>

      <div class="grenier-fab-menu" id="grFabMenu">
        <button class="grenier-fab-item" onclick="App._grShowNewCard()">
          <span class="grenier-fab-label">Nouvelle carte</span>

        </button>
      </div>
      <button class="grenier-fab" id="grFab" onclick="App._grToggleFab()">+</button>
    `;
    this._grSetupLongPress();
  },

  // ══════════════════════════════════════════════════════════════════════
  // INDEX PHONÉTIQUE — le pont entre les sons enseignés et TES mots
  //
  // Les cartes portent déjà leur transcription API. En la découpant en
  // phonèmes, on répond enfin à « quels de MES mots contiennent le son que
  // je rate ? » — ce que ni le Bilan ni le Grenier ne savaient faire seuls.
  // ══════════════════════════════════════════════════════════════════════

  PH_INV: [
    'sjɔ̃','jɛ̃','ɑ̃','ɛ̃','ɔ̃','œ̃','ɥi','ij','aj','ɛj',
    'a','ɑ','e','ɛ','i','o','ɔ','u','y','ø','œ','ə',
    'j','w','ɥ',
    'p','b','t','d','k','g','f','v','s','z','ʃ','ʒ','m','n','ɲ','ŋ','l','ʁ','r',
  ],

  // Trié du plus long au plus court : sans cet ordre, /ɑ̃/ se lirait /ɑ/
  // suivi d'un signe, et toutes les nasales seraient confondues avec leur
  // voyelle orale. On trie ici plutôt que de compter sur l'ordre de la liste.
  _phInv() {
    if (!this._phInvTri) this._phInvTri = [...this.PH_INV].sort((a, b) => b.length - a.length);
    return this._phInvTri;
  },

  _phTokenize(ipa) {
    const s = String(ipa || '').replace(/[\/\[\]()ˈˌː.·\s\-‿]/g, '');
    const inv = this._phInv();
    const out = [];
    let i = 0;
    while (i < s.length) {
      let trouve = null;
      for (const p of inv) { if (s.startsWith(p, i)) { trouve = p; break; } }
      if (trouve) { out.push(trouve); i += trouve.length; }
      else i++;                       // signe inconnu : ignoré
    }
    return out;
  },

  // Les sons enseignés utilisables. Un phonème dont le champ ipa se découpe
  // en EXACTEMENT un jeton est un vrai son ; les entrées de prosodie, de
  // liaison et les muets s'écartent ainsi d'elles-mêmes, sans liste noire.
  _phSounds() {
    if (this._phSoundsCache) return this._phSoundsCache;
    const out = [];
    for (const [id, p] of Object.entries(APP_DATA.phonemes || {})) {
      const t = this._phTokenize(p.ipa);
      if (t.length !== 1) continue;
      out.push({ id, sym: t[0], label: p.label || id, cat: p.category || '' });
    }
    this._phSoundsCache = out;
    return out;
  },

  // Tes cartes, découpées. Recalculé à la demande : quelques centaines de
  // mots de huit signes, c'est instantané et jamais périmé.
  _phIndex() {
    const out = [];
    for (const c of (this._grenier?.cards || [])) {
      if (c.deleted || !c.word) continue;
      const seq = this._phTokenize(c.ipa);
      if (!seq.length) continue;
      out.push({ id: c.id, mot: c.word, ipa: c.ipa || '', seq, ens: new Set(seq) });
    }
    return out;
  },

  // Moyenne de tes dix derniers essais sur ce son ; null si jamais pratiqué.
  _phWeakness(id) {
    const arr = this.scores?.[id];
    if (!Array.isArray(arr) || !arr.length) return null;
    return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
  },

  // Les sons, du plus faible au plus sûr. Jamais pratiqué vient après les
  // sons faibles mais avant les sons acquis : c'est une invitation, pas une
  // lacune avérée.
  _phSoundsRanked() {
    const idx = this._phIndex();
    return this._phSounds().map(s => {
      const mots = idx.filter(c => c.ens.has(s.sym));
      return { ...s, score: this._phWeakness(s.id), mots };
    }).sort((a, b) => {
      const ra = a.score == null ? 1000 : a.score;
      const rb = b.score == null ? 1000 : b.score;
      if (ra !== rb) return ra - rb;
      return b.mots.length - a.mots.length;
    });
  },

  _phSelected: null,

  renderPhonemeFocus() {
    const rangs = this._phSoundsRanked();
    const total = this._phIndex().length;
    const sel = this._phSelected ? rangs.find(s => s.id === this._phSelected) : null;

    const puce = (s) => {
      if (s.score == null) return `<span class="ph-chip ph-chip-neutre">jamais évalué</span>`;
      const c = s.score >= 80 ? 'ph-chip-bon' : s.score >= 60 ? 'ph-chip-moyen' : 'ph-chip-faible';
      return `<span class="ph-chip ${c}">${s.score}%</span>`;
    };

    const liste = rangs.map(s => `
      <button class="ph-row" onclick="App._phSelect('${s.id}')">
        <span class="ph-sym">${s.sym}</span>
        <span class="ph-label">${s.label}</span>
        ${puce(s)}
        <span class="ph-count ${s.mots.length ? '' : 'vide'}">${s.mots.length} mot${s.mots.length !== 1 ? 's' : ''}</span>
      </button>`).join('');

    const detail = !sel ? '' : `
      <div class="ph-detail">
        <div class="ph-detail-head">
          <span class="ph-sym gros">${sel.sym}</span>
          <div style="flex:1">
            <div style="font-weight:700;color:var(--text)">${sel.label}</div>
            <div style="font-size:12px;color:var(--text3)">${sel.mots.length} de tes mots contiennent ce son</div>
          </div>
          <button class="ph-close" onclick="App._phSelect(null)" title="Fermer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        ${sel.mots.length ? `
          <div class="ph-words">${sel.mots.slice(0, 40).map(m => `
            <button class="ph-word" onclick="App.navigate('word-focus',{word:'${m.mot.replace(/'/g,"\\'")}'})">
              ${m.mot}<span class="ph-word-ipa">${m.ipa}</span>
            </button>`).join('')}
            ${sel.mots.length > 40 ? `<div style="font-size:11px;color:var(--text3);padding:4px 2px">…et ${sel.mots.length - 40} autres</div>` : ''}
          </div>
          <button class="ph-start" onclick="App._phStartSession('${sel.id}')">
            Réviser ces ${sel.mots.length} mot${sel.mots.length !== 1 ? 's' : ''}
          </button>` : `
          <div style="font-size:13px;color:var(--text3);font-style:italic;padding:10px 2px">
            Aucun mot de ta collection ne contient ce son. Ajoute-en depuis Mot en Focus.
          </div>`}
      </div>`;

    document.getElementById('main').innerHTML = `
      <div class="screen-header">
        <button class="home-btn" onclick="App.navigate('labo')" title="Le Labo" style="padding:7px 10px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:#14B8A6"><path d="M9 3h6v10l3.5 6a1 1 0 0 1-.9 1.5H6.4a1 1 0 0 1-.9-1.5L9 13V3z"/><line x1="9" y1="3" x2="15" y2="3"/></svg>
        </button>
        <button class="back-btn" onclick="App.goBack()" title="Retour">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="back-btn" onclick="App.navigate('settings')" title="Paramètres">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="screen-title" style="color:#14B8A6">Entraînement ciblé</div>
      </div>
      <div class="ph-container">
        <div class="ph-intro">
          Tes sons du plus faible au plus sûr, et combien de <b>tes</b> mots
          contiennent chacun. ${total} carte${total !== 1 ? 's' : ''} de ta
          collection ont une transcription exploitable.
        </div>
        ${detail}
        <div class="ph-list">${liste}</div>
      </div>`;
  },

  _phSelect(id) {
    this._phSelected = (id === 'null' || !id) ? null : id;
    this.renderPhonemeFocus();
  },

  // Révision bâtie sur TES mots contenant ce son. On réutilise tel quel le
  // moteur du Grenier au moyen d'un paquet virtuel : toutes ses recherches de
  // paquet retombent déjà sur une valeur par défaut, donc rien à y modifier,
  // et les cartes gardent leur vrai paquet pour la planification.
  _phStartSession(soundId) {
    const s = this._phSoundsRanked().find(x => x.id === soundId);
    if (!s || !s.mots.length) return;
    const ids = new Set(s.mots.map(m => m.id));
    const cartes = (this._grenier.cards || []).filter(c => ids.has(c.id) && !c.deleted);
    if (!cartes.length) { this.showToast('Aucune carte à réviser'); return; }
    this._grenierStudySession = {
      deckId: '__phoneme__' + soundId,
      queue: [...cartes].sort(() => Math.random() - 0.5),
      idx: 0,
      stats: { again: 0, hard: 0, good: 0, easy: 0 },
    };
    this._grenierCardRecording = false;
    this._grenierCardAudioBlob = null;
    this._grenierCardSettingsOpen = false;
    this.navHistory.push({ screen: 'grenier-study', params: { deckId: this._grenierStudySession.deckId } });
    this.currentScreen = 'grenier-study';
    this._grRenderStudyCard();
  },

  // ══════════════════════════════════════════════════════════════════════
  // MAINS LIBRES — réviser sans écran, en voiture ou à la vaisselle
  //
  // L'appli prononce le mot, laisse un silence pour que tu répètes, lit la
  // définition si tu veux, puis enchaîne. Aucun toucher.
  //
  // Un écran éteint met les minuteurs en sommeil sur mobile : la boucle
  // s'arrêterait au bout de quelques secondes. On demande donc à garder
  // l'écran allumé — c'est la seule façon fiable de tenir la durée.
  // ══════════════════════════════════════════════════════════════════════
  _hfSession: null,
  _hfTimer: null,
  _hfWakeLock: null,

  _hfCards() {
    const maintenant = Date.now();
    return (this._grenier?.cards || [])
      .filter(c => !c.deleted && c.word && (!c.nextDue || c.nextDue <= maintenant));
  },

  renderHandsFree() {
    const dues = this._hfCards();
    const s = this._hfSession;
    const pause = this.settings.hfPause ?? 3;
    const lireDef = this.settings.hfDef !== false;

    document.getElementById('main').innerHTML = `
      <div class="screen-header">
        <button class="home-btn" onclick="App.navigate('labo')" title="Le Labo" style="padding:7px 10px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:#14B8A6"><path d="M9 3h6v10l3.5 6a1 1 0 0 1-.9 1.5H6.4a1 1 0 0 1-.9-1.5L9 13V3z"/><line x1="9" y1="3" x2="15" y2="3"/></svg>
        </button>
        <button class="back-btn" onclick="App._hfStop();App.goBack()" title="Retour">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="back-btn" onclick="App.navigate('settings')" title="Paramètres">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="screen-title" style="color:#14B8A6">Mains libres</div>
      </div>
      <div class="hf-container">
        <div class="hf-mot" id="hfMot">${s ? (s.queue[s.idx]?.word || '') : (dues.length ? '—' : '')}</div>
        <div class="hf-etat" id="hfEtat">${
          s ? `${s.idx + 1} / ${s.queue.length}`
            : dues.length ? `${dues.length} carte${dues.length !== 1 ? 's' : ''} à réviser`
                          : 'Aucune carte à réviser pour l\'instant'}</div>

        <button class="hf-play" id="hfPlay" onclick="App._hfToggle()" ${dues.length ? '' : 'disabled'}>
          ${s && !s.pause
            ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20"/></svg>`}
        </button>
        <div class="hf-hint" id="hfHint">${s ? (s.pause ? 'En pause' : 'Répète après la voix…') : 'Pose le téléphone et appuie sur ▶'}</div>

        ${s ? `<button class="hf-stop" onclick="App._hfStop()">Arrêter</button>` : `
        <div class="hf-reglages">
          <label class="hf-opt">
            <span>Silence pour répéter</span>
            <select class="settings-select" onchange="App._hfSetPause(this.value)">
              ${[2,3,4,5,7].map(v => `<option value="${v}" ${pause === v ? 'selected' : ''}>${v} s</option>`).join('')}
            </select>
          </label>
          <label class="hf-opt">
            <span>Lire aussi la définition</span>
            <input type="checkbox" ${lireDef ? 'checked' : ''} onchange="App._hfSetDef(this.checked)">
          </label>
        </div>`}
      </div>`;
  },

  _hfSetPause(v) { this.settings.hfPause = Number(v) || 3; this.saveSettings(); },
  _hfSetDef(on)  { this.settings.hfDef = !!on; this.saveSettings(); },

  async _hfToggle() {
    if (!this._hfSession) {
      const dues = this._hfCards();
      if (!dues.length) { this.showToast('Aucune carte à réviser'); return; }
      this._hfSession = { queue: [...dues].sort(() => Math.random() - 0.5), idx: 0, pause: false };
      await this._hfWake(true);
      this.renderHandsFree();
      this._hfEtape();
      return;
    }
    const s = this._hfSession;
    s.pause = !s.pause;
    if (s.pause) {
      clearTimeout(this._hfTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      await this._hfWake(false);
    } else {
      await this._hfWake(true);
      this._hfEtape();
    }
    this.renderHandsFree();
  },

  async _hfStop() {
    clearTimeout(this._hfTimer);
    this._hfTimer = null;
    this._hfSession = null;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    await this._hfWake(false);
    if (this.currentScreen === 'hands-free') this.renderHandsFree();
  },

  // L'écran doit rester allumé, sinon les minuteurs sont bridés et la boucle
  // s'arrête. Non supporté partout : on continue sans, en le disant.
  async _hfWake(on) {
    try {
      if (on) {
        if (!this._hfWakeLock && navigator.wakeLock) {
          this._hfWakeLock = await navigator.wakeLock.request('screen');
          this._hfWakeLock.addEventListener?.('release', () => { this._hfWakeLock = null; });
        }
      } else if (this._hfWakeLock) {
        await this._hfWakeLock.release();
        this._hfWakeLock = null;
      }
    } catch (e) { /* refusé ou absent : la boucle marche quand même écran allumé */ }
  },

  _hfDit(texte) {
    return new Promise(res => {
      if (!texte) return res();
      this.speakText(texte, false);
      // On ne sait pas quand la voix a fini : on estime d'après la longueur,
      // avec un plancher. Mieux vaut un blanc qu'un chevauchement.
      const ms = Math.min(9000, 900 + texte.length * 75);
      this._hfTimer = setTimeout(res, ms);
    });
  },

  async _hfEtape() {
    const s = this._hfSession;
    if (!s || s.pause) return;
    if (s.idx >= s.queue.length) { this.showToast('Session terminée ✓'); this._hfStop(); return; }
    const carte = s.queue[s.idx];

    const mot = document.getElementById('hfMot');
    if (mot) mot.textContent = carte.word || '';
    const etat = document.getElementById('hfEtat');
    if (etat) etat.textContent = `${s.idx + 1} / ${s.queue.length}`;

    await this._hfDit(carte.word);
    if (!this._hfSession || this._hfSession.pause) return;

    // le silence pendant lequel tu répètes
    const attente = (this.settings.hfPause ?? 3) * 1000;
    await new Promise(res => { this._hfTimer = setTimeout(res, attente); });
    if (!this._hfSession || this._hfSession.pause) return;

    if (this.settings.hfDef !== false && carte.definition) {
      // la définition peut contenir du HTML : on ne lit que le texte
      const tmp = document.createElement('div');
      tmp.innerHTML = carte.definition;
      const txt = (tmp.textContent || '').trim().slice(0, 220);
      if (txt) {
        await this._hfDit(txt);
        if (!this._hfSession || this._hfSession.pause) return;
      }
    }

    s.idx++;
    this._hfEtape();
  },

  // ── thèmes du Grenier ─────────────────────────────────────────────────
  // Fonctionnalité discrète : toucher le titre fait défiler les palettes.
  // Le 2 est le défaut, pour que rien ne change tant qu'on n'y touche pas.
  GRENIER_THEMES: [
    { n: 1, nom: 'Lagune' },
    { n: 2, nom: 'Braise' },
    { n: 3, nom: 'Néon' },
    { n: 4, nom: 'Fuchsia' },
    { n: 5, nom: 'Givre' },
  ],

  _grApplyTheme() {
    const n = Number(this.settings?.grenierTheme) || 2;
    const el = document.documentElement;
    // Le thème 2 est celui de :root : pas d'attribut, donc rien à surcharger.
    if (n === 2) el.removeAttribute('data-gr-theme');
    else el.setAttribute('data-gr-theme', String(n));
  },

  _grCycleTheme() {
    const n = Number(this.settings?.grenierTheme) || 2;
    const suivant = (n % this.GRENIER_THEMES.length) + 1;   // 5 → 1
    this.settings.grenierTheme = suivant;
    this.saveSettings();
    this._grApplyTheme();
    const nom = this.GRENIER_THEMES.find(t => t.n === suivant)?.nom || '';
    this.showToast(`Thème ${suivant} — ${nom}`);
  },

  // ── réorganisation des paquets ────────────────────────────────────────
  // Un mode dédié plutôt qu'un glissement : sur téléphone, viser une position
  // au doigt en tenant l'écran est pénible, alors que deux flèches ne ratent
  // jamais leur cible.
  _grenierReorder: false,

  _grToggleReorder(on) {
    this._grenierReorder = (on === undefined) ? !this._grenierReorder : !!on;
    this.renderGrenier();
  },

  _grMoveDeck(deckId, delta) {
    this._grSortDecks();
    const arr = this._grenier.decks;
    const i = arr.findIndex(d => d.id === deckId);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    this._grApplyDeckOrder();
    this.renderGrenier();
  },

  // Renumérote, enregistre, et recopie le rang sur les dossiers pour qu'il
  // voyage avec la synchro. Le Répertoire, lui, suit déjà l'ordre du tableau.
  _grApplyDeckOrder() {
    this._grenier.decks.forEach((d, i) => { d.ord = i; });
    this.saveGrenier();
    if (!this._repertoire?.folders) return;
    const rang = new Map();
    this._grenier.decks.forEach(d => rang.set((d.name || '').toLowerCase(), d.ord));
    let change = false;
    for (const f of this._repertoire.folders) {
      const o = rang.get((f.name || '').toLowerCase());
      if (o !== undefined && f.ord !== o) { f.ord = o; change = true; }
    }
    if (change) this.saveRepertoire();
  },

  // Le Répertoire trie ses dossiers d'après l'ordre de ce tableau, donc c'est
  // bien le tableau qu'on ordonne — pas seulement l'affichage. Tri stable :
  // un paquet sans ordre explicite garde sa place relative.
  _grSortDecks() {
    if (!this._grenier?.decks) return;
    const rang = d => Number.isFinite(d.ord) ? d.ord : Infinity;
    this._grenier.decks.sort((a, b) => rang(a) - rang(b));
  },



  _grSetView(v) {
    this._grenierView = v;

  _grStartPracticeAnyway(deckId) {
    const override = document.getElementById('grOverrideToggle')?.classList.contains('on');
    this._grCloseDeckModal();
    // Build queue from all non-deleted cards in deck
    const allCards = (this._grenier.cards||[]).filter(c=>c.deckId===deckId&&!c.deleted);
    if (override) {
      // Reset due dates so ratings will persist but we practice now
      allCards.forEach(c => { c.nextDue = Date.now(); });
      this.saveGrenier();
    }
    const queue = [...allCards].sort(() => Math.random() - 0.5);
    this._grenierStudySession = { deckId, queue, idx: 0, stats: { again:0, hard:0, good:0, easy:0 }, practiceMode: true };
    this._grenierCardRecording = false;

  _grSetupLongPress() {
    const area = document.querySelector('.grenier-decks-area');
    if (!area) return;
    let timer = null;
    area.addEventListener('pointerdown', e => {
      const card = e.target.closest('[data-deck-id]');
      if (!card) return;
      timer = setTimeout(() => {
        timer = null;
        this._grDeckCtxMenu(card.dataset.deckId, e);
      }, 550);
    }, { passive: true });
    area.addEventListener('pointerup', () => { if (timer) { clearTimeout(timer); timer = null; } });
    area.addEventListener('pointermove', () => { if (timer) { clearTimeout(timer); timer = null; } });
  },

  _grDeckCtxMenu(deckId, e) {
    document.querySelector('.grenier-ctx-menu')?.remove();
    document.querySelector('.grenier-ctx-overlay')?.remove();
    const deck = this._grenier.decks.find(d => d.id === deckId);
    if (!deck) return;

    // Invisible overlay to catch outside taps
    const overlay = document.createElement('div');
    overlay.className = 'grenier-ctx-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:199';
    overlay.addEventListener('click', () => { overlay.remove(); document.querySelector('.grenier-ctx-menu')?.remove(); });
    document.body.appendChild(overlay);

    const menu = document.createElement('div');
    menu.className = 'grenier-ctx-menu';
    const x = Math.min(e.clientX, window.innerWidth - 210);
    const y = Math.min(e.clientY, window.innerHeight - 220);
    menu.style.cssText = `left:${x}px;top:${y}px`;

    const addItem = (emoji, label, fn, danger=false) => {
      const btn = document.createElement('button');
      btn.className = 'grenier-ctx-item' + (danger ? ' danger' : '');
      btn.innerHTML = emoji + ' ' + label;
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        overlay.remove();
        menu.remove();
        fn();
      });
      menu.appendChild(btn);
    };

    addItem('🎨', 'Changer la couleur / emoji', () => this._grShowDeckModal(deck));
    addItem('✏️', 'Renommer', () => this._grShowRenameDeck(deckId));
    const sep = document.createElement('div'); sep.className = 'grenier-ctx-sep';
    menu.appendChild(sep);
    addItem('🗑️', 'Supprimer le paquet', () => this._grDeleteDeck(deckId), true);

    document.body.appendChild(menu);

  _grCloseCtx() {
    document.querySelector('.grenier-ctx-menu')?.remove();
    document.querySelector('.grenier-ctx-overlay')?.remove();
  },

  _grDeleteDeck(deckId) {
    const deck = this._grenier.decks.find(d => d.id === deckId);
    const deckName = deck?.name;
    this._syncTombstoneNamed(deckName, deckId,
      this._grenier.cards.filter(c => c.deckId === deckId).map(c => c.id));
    this._grenier.decks = this._grenier.decks.filter(d => d.id !== deckId);
    this._grenier.cards = this._grenier.cards.filter(c => c.deckId !== deckId);
    this.saveGrenier();
    // Mirror: delete matching Répertoire folder and move its words to first remaining folder
    if (deckName && this._repertoire) {
      const folder = this._repertoire.folders.find(f => f.name === deckName);
      if (folder) {
        const others = this._repertoire.folders.filter(f => f.id !== folder.id);
        const fallback = others[0];
        this._repertoire.words.forEach(w => {
          if (w.folderId === folder.id) w.folderId = fallback ? fallback.id : null;
        });
        this._syncTombstone(folder.id);
        this._repertoire.folders = this._repertoire.folders.filter(f => f.id !== folder.id);
        this.saveRepertoire();
      }
    }
    this.renderGrenier();
    this.showToast('Paquet supprimé');
  },

  _grSaveDeck(existingId) {
    const name = document.getElementById('grDeckNameInput')?.value.trim();
    if (!name) { document.getElementById('grDeckNameInput')?.focus(); return; }
    const color = this._grSelectedColor || this.GRENIER_COLORS[0];
    const emoji = this._grSelectedDeckEmoji || '📦';

    if (existingId) {
      const deck = this._grenier.decks.find(d => d.id === existingId);
      if (deck) {
        const oldName = deck.name;
        deck.name = name; deck.color = color; deck._emoji = emoji;
        // Mirror rename to the matching Répertoire folder
        const folder = this._repertoire.folders.find(f => f.name === oldName);
        if (folder) { folder.name = name; folder.emoji = emoji; this.saveRepertoire(); }
      }
      this.saveGrenier();
      this._grCloseDeckModal();
      this.renderGrenier();
      return;
    }

    // New deck
    const deckId = this._gid();
    this._grenier.decks.push({ id: deckId, name, color, _emoji: emoji, createdAt: Date.now() });

    // Also create a matching Répertoire folder if none exists with this name
    if (!this._repertoire.folders.find(f => f.name === name)) {
      this._repertoire.folders.push({ id: 'folder_' + Date.now(), name, emoji, createdAt: Date.now() });
      this.saveRepertoire();
    }

    this.saveGrenier();
    this._grCloseDeckModal();
    this.renderGrenier();
    this.showToast(`Paquet "${name}" créé 🎉`);
  },

  _grAutoIpaTimer: null,

  _grCardAutoIpaDebounced(word) {
    clearTimeout(this._grAutoIpaTimer);
    if (!word || word.length < 2) return;
    this._grAutoIpaTimer = setTimeout(() => this._grCardAutoIpa(word), 650);
  },

  async _grCardAutoIpa(word) {
    if (!word || word.length < 2) return;
    const ipaEl    = document.getElementById('grCardIpaInput');
    const genderEl = document.getElementById('grCardGenderInput');
    // Only autofill fields the user hasn't touched yet
    const ipaEmpty    = !ipaEl?.value;
    const genderEmpty = !genderEl?.value;
    if (!ipaEmpty && !genderEmpty) return;
    const { ipa, gender } = await this._grFetchIpaAndGender(word.trim());
    if (ipa    && ipaEmpty    && ipaEl    && !ipaEl.value)    ipaEl.value    = ipa;
    if (gender && genderEmpty && genderEl && !genderEl.value) genderEl.value = gender;

  // Returns { ipa, gender } — uses shared _fetchIpaForWord helper
  async _grFetchIpaAndGender(word) {

  // Shared gender parser for FR wikitext — looks at the first noun entry only
  _parseGenderFromWikitext(content) {
    // Isolate the French section (everything before the first non-FR language heading)
    const frSectionMatch = content.match(/==\s*\{\{langue\|fr\}\}\s*==([\s\S]*?)(?:==\s*\{\{langue\|(?!fr)[a-z-]+\}\}\s*==|$)/i);
    const frSection = frSectionMatch ? frSectionMatch[1] : content;

    // Find the first noun/substantive sub-section  
    // FR wikitext uses: === {{S|nom|fr}} === or === {{S|nom propre|fr}} ===
    const nounMatch = frSection.match(/===\s*\{\{S\|nom(?:[^}]*)?\|fr[^}]*\}\}\s*===([\s\S]*?)(?:===|$)/i);
    const target = nounMatch ? nounMatch[1] : frSection;

    // In FR wikitext, gender appears in the first few lines of the entry as:
    // {{m}}, {{f}}, {{mf}}, {{fm}}, {{n}}
    // or inline like: '''chat''' {{m}} or '''chatte''' {{f}}
    // or in inflection templates: {{fr-rég|...}} which may contain |genre=m
    // Strategy: look at first 500 chars of the noun entry for the clearest signals
    const head = target.slice(0, 600);

    // Explicit combined gender templates first
    if (/\{\{mf\}\}|\{\{fm\}\}|\{\{m ou f\}\}/i.test(head)) return 'mf';

    const hasM = /\{\{m\}\}|\bgenre\s*=\s*m\b/i.test(head);
    const hasF = /\{\{f\}\}|\bgenre\s*=\s*f\b/i.test(head);

    if (hasM && !hasF) return 'm';
    if (hasF && !hasM) return 'f';

    // If both appear in the short head, the word itself is likely the feminine form
    // (e.g. "chatte" page shows {{f}} for chatte and refers to {{m}} "chat" nearby)
    // Tie-break: whichever appears FIRST wins
    if (hasM && hasF) {
      const mPos = head.search(/\{\{m\}\}|\bgenre\s*=\s*m\b/i);
      const fPos = head.search(/\{\{f\}\}|\bgenre\s*=\s*f\b/i);
      return mPos <= fPos ? 'm' : 'f';
    }

    return '';
  },

  _grSaveCard(editId) {
    const word = document.getElementById('grCardWordInput')?.value.trim();
    if (!word) { document.getElementById('grCardWordInput')?.focus(); return; }
    const ipa = document.getElementById('grCardIpaInput')?.value.trim() || '';
    let deckId = document.getElementById('grCardDeckSelect')?.value;
    if (!deckId || deckId === '__new__') {
      if (this._grenier.decks.length === 0) { this.showToast('Créez d\'abord un paquet'); return; }
      deckId = this._grenier.decks[0].id;
    }
    const color = this._grSelectedCardColor || null;
    const genderInput = document.getElementById('grCardGenderInput')?.value.trim() || '';
    const tags = [...(this._grSelectedTags || new Set())];
    const showListen = document.getElementById('grOpt_showListen')?.classList.contains('on') ?? true;
    const showRecord = document.getElementById('grOpt_showRecord')?.classList.contains('on') ?? true;
    const showRhymes = document.getElementById('grOpt_showRhymes')?.classList.contains('on') ?? true;
    const showIpa    = document.getElementById('grOpt_showIpa')?.classList.contains('on') ?? true;
    const showGender = document.getElementById('grOpt_showGender')?.classList.contains('on') ?? true;

    if (editId) {
      const card = this._grenier.cards.find(c=>c.id===editId);
      if (card) {
        const oldDeckId = card.deckId;
        const oldWord = card.word;
        // Use manually entered gender if provided, otherwise keep existing
        const resolvedGender = genderInput || card.gender || '';
        Object.assign(card, { word, ipa, deckId, color, showListen, showRecord, showRhymes, showIpa, showGender, tags, gender: resolvedGender });
        // If deck changed, update the study session reference too
        if (oldDeckId !== deckId && this._grenierStudySession?.deckId === oldDeckId) {
          this._grenierStudySession.deckId = deckId;
        }
        // If the word spelling changed, update the matching Répertoire entry so the
        // edited spelling is the canonical one and the old spelling doesn't back-sync.
        if (oldWord && oldWord.toLowerCase() !== word.toLowerCase()) {
          const currentDeck = this._grenier.decks.find(d => d.id === deckId);
          const currentFolder = currentDeck
            ? this._repertoire.folders.find(f => f.name === currentDeck.name)
            : null;
          if (currentFolder) {
            const repWord = this._repertoire.words.find(w =>
              w.word.toLowerCase() === oldWord.toLowerCase() && w.folderId === currentFolder.id
            );
            if (repWord) { repWord.word = word; repWord.ipa = ipa; this.saveRepertoire(); }
          }
        }
        // If deck changed, move the matching Répertoire word to the new folder
        // to prevent _syncReconcile from re-adding it to the old deck as a duplicate
        if (oldDeckId !== deckId) {
          const oldDeck = this._grenier.decks.find(d => d.id === oldDeckId);
          const newDeck = this._grenier.decks.find(d => d.id === deckId);
          if (oldDeck && newDeck) {
            const oldFolder = this._repertoire.folders.find(f => f.name === oldDeck.name);
            const newFolder = this._repertoire.folders.find(f => f.name === newDeck.name);
            if (oldFolder && newFolder) {
              // Use the new word spelling (already updated above if it changed)
              const repWord = this._repertoire.words.find(w =>
                w.word.toLowerCase() === word.toLowerCase() && w.folderId === oldFolder.id
              );
              if (repWord) { repWord.folderId = newFolder.id; this.saveRepertoire(); }
            }
          }
        }
      }
    } else {
      const pendingGender = genderInput || this._grPendingGender || '';
      this._grPendingGender = '';
      const newCard = {
        id:this._gid(), deckId, word, ipa, interval:1, ease:2.5, reps:0,
        nextDue:Date.now(), showListen, showRecord, showRhymes, showIpa, showGender,
        color, definition:'', gender: pendingGender, tags, createdAt:Date.now()
      };
      this._grenier.cards.push(newCard);
      // Auto-fetch gender in background for new cards
      if (!pendingGender && showGender) {
        const cid = newCard.id;
        this._grFetchIpaAndGender(word).then(({gender}) => {
          const c = this._grenier.cards.find(x=>x.id===cid);
          if (c && gender) { c.gender = gender; this.saveGrenier(); }
        });
      }
      // Sync to matching Répertoire folder
      const deck = this._grenier.decks.find(d => d.id === deckId);
      if (deck) {
        const matchFolder = this._repertoire.folders.find(f => f.name === deck.name);
        if (matchFolder && !this.repIsWordSaved(word)) {
          this._repertoire.words.unshift({
            id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
            word, ipa: ipa || '', folderId: matchFolder.id,
            addedAt: Date.now(), source: 'grenier'
          });
          this.saveRepertoire();
        }
      }
    }
    this.saveGrenier();
    this.showToast(editId ? 'Carte modifiée ✓' : `"${word}" ajouté au paquet ✓`);
    // After editing a card, return to the study session if one is active
    if (editId && this._grEditReturnDeckId) {
      const returnDeck = this._grEditReturnDeckId;
      this._grEditReturnDeckId = null;
      this.currentScreen = 'grenier-study';
      const main = document.getElementById('main');
      main.classList.add('screen-exit');
      setTimeout(() => {
        main.classList.remove('screen-exit');
        main.classList.add('screen-enter');
        this._grRenderStudyCard();
        setTimeout(() => main.classList.remove('screen-enter'), 400);
      }, 150);
    } else {
      this.goBack();
    }
  },


  // Re-fetch IPA from card create/edit screen
  async _grRefetchIpa() {
    const word = document.getElementById('grCardWordInput')?.value.trim();
    if (!word) { this.showToast('Entrez un mot d\'abord'); return; }
    const ipaEl = document.getElementById('grCardIpaInput');
    if (ipaEl) { ipaEl.value = ''; ipaEl.placeholder = 'Récupération…'; }
    const { ipa } = await this._grFetchIpaAndGender(word);
    if (ipaEl) { ipaEl.value = ipa || ''; ipaEl.placeholder = 'Se remplit automatiquement…'; }
    if (!ipa) this.showToast('IPA non trouvé');
  },

  // Re-fetch gender from card create/edit screen
  async _grRefetchGender() {
    const word = document.getElementById('grCardWordInput')?.value.trim();
    if (!word) { this.showToast('Entrez un mot d\'abord'); return; }
    const genderEl = document.getElementById('grCardGenderInput');
    if (genderEl) { genderEl.value = ''; genderEl.placeholder = 'Récupération…'; }
    this.showToast('Récupération du genre…');
    const { gender } = await this._grFetchIpaAndGender(word);
    if (genderEl) { genderEl.value = gender || ''; genderEl.placeholder = 'Se remplit automatiquement… (m / f / mf)'; }
    if (gender) {
      this.showToast(`Genre trouvé : ${gender === 'm' ? 'masculin (m)' : gender === 'f' ? 'féminin (f)' : gender}`);
      this._grPendingGender = gender;
      // Also directly update card.gender if we can find the card being edited
      const editCardId = this._grEditCardId;
      if (editCardId) {
        const card = this._grenier.cards.find(c => c.id === editCardId);
        if (card) {
          card.gender = gender;
          card.showGender = true;
          this.saveGrenier();
          // Live-update the word display in the edit form
          const wordEl = document.querySelector('.grenier-card-word');
          if (wordEl) {
            const accent = wordEl.style.color || 'var(--gr-orange)';
            wordEl.innerHTML = `${card.word}<em style="font-size:0.45em;font-weight:400;color:${accent};opacity:0.7;margin-left:6px;vertical-align:middle">(${gender})</em>`;
          }
        }
      }
    } else {
      this.showToast('Genre non trouvé pour ce mot');
      this._grPendingGender = '';
    }
  },

  // Navigate back from card edit screen to study session (or grenier list)
  _grEditCardBack() {
    this._grEditReturnDeckId = null;
    if (this._grenierStudySession) {
      this.currentScreen = 'grenier-study';
      const main = document.getElementById('main');
      main.classList.add('screen-exit');

        main.classList.remove('screen-exit');
        main.classList.add('screen-enter');

  // Delete card from the edit screen (not overlay)
  _grDeleteCardFromEdit(cardId) {
    if (!confirm('Supprimer cette carte ? Cette action est irréversible.')) return;
    const card = this._grenier.cards.find(c => c.id === cardId);
    if (card) {
      card.deleted = true;
      this.saveGrenier();
      // Mirror: remove from Répertoire
      this._syncRemoveWordFromRepertoire(card.word);
    }
    this.showToast('Carte supprimée');
    // Return to study session, advancing past deleted card
    if (this._grenierStudySession) {
      this._grEditReturnDeckId = null;
      const sess = this._grenierStudySession;
      // Advance index so the deleted card is skipped
      sess.idx++;
      this.currentScreen = 'grenier-study';
      const main = document.getElementById('main');
      main.classList.add('screen-exit');
      setTimeout(() => {
        main.classList.remove('screen-exit');
        main.classList.add('screen-enter');
        this._grRenderStudyCard();
        setTimeout(() => main.classList.remove('screen-enter'), 400);
      }, 150);
    } else {
      this.goBack();
    }
  },

  // ── Study Session ─────────────────────────────────────────────
  renderGrenierStudy(deckId) {
    if (!deckId) { this.navigate('grenier'); return; }
    const deck = this._grenier.decks.find(d=>d.id===deckId);
    if (!deck) { this.navigate('grenier'); return; }

    const due = this._grDueCards(deckId);
    // Shuffle queue
    const queue = [...due].sort(() => Math.random() - 0.5);
    this._grenierStudySession = {
      deckId, queue, idx: 0,
      stats: { again:0, hard:0, good:0, easy:0 }
    };
    this._grenierCardRecording = false;
    this._grenierCardAudioBlob = null;
    this._grenierCardSettingsOpen = false;
    this._grRenderStudyCard();
  },

            ${(() => { const pv = App._grPreviewIntervals(card); return `<button class="grenier-rate-btn gr-rate-again" onclick="App._grRate(0)">À revoir<span>auj</span></button><button class="grenier-rate-btn gr-rate-hard" onclick="App._grRate(1)">Difficile<span>${App._grFmtInterval(pv.hard,'+')}</span></button><button class="grenier-rate-btn gr-rate-good" onclick="App._grRate(2)">Bien<span>${App._grFmtInterval(pv.good,'+')}</span></button><button class="grenier-rate-btn gr-rate-easy" onclick="App._grRate(3)">Facile<span>${App._grFmtInterval(pv.easy,'+')}</span></button>`; })()}

    // If no IPA stored, try to fetch it
    if (!ipa) this._grFetchCardIpa(card);

  _grToggleRhymes() {

  async _grFetchCardIpa(card) {

      card.ipa = ipa;
      const el = document.getElementById('grIpaLoading');

      const el = document.getElementById('grIpaLoading');
      if (el) { el.textContent = ''; }

  _grSpeak(word) {

    this.speakText(word, false);

  _grMediaRecorder: null,
  _grRecordChunks: [],

  async _grToggleRecording() {
    if (this._grenierCardRecording) {
      this._grStopRecording();
    } else {
      await this._grStartRecording();
    }
  },

  async _grStartRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this._grRecordChunks = [];
      this._grMediaRecorder = new MediaRecorder(stream);
      this._grMediaRecorder.ondataavailable = e => { if (e.data.size>0) this._grRecordChunks.push(e.data); };
      this._grMediaRecorder.onstop = () => {
        stream.getTracks().forEach(t=>t.stop());
        const blob = new Blob(this._grRecordChunks, { type:'audio/webm' });
        this._grenierCardAudioBlob = blob;
        const relisten = document.getElementById('grRelistenBtn');
        if (relisten) { relisten.disabled = false; relisten.style.opacity=''; }
        this._grScoreRecording(blob);
      };
      this._grMediaRecorder.start();
      this._grenierCardRecording = true;
      const btn = document.getElementById('grRecordBtn');
      const lbl = document.getElementById('grRecordLabel');
      if (btn) btn.classList.add('recording');
      if (lbl) lbl.textContent = 'Enregistrement… (appuyer pour arrêter)';
    } catch(e) { this.showToast('Microphone non disponible'); }
  },

  _grStopRecording() {
    if (this._grMediaRecorder && this._grMediaRecorder.state !== 'inactive') {
      this._grMediaRecorder.stop();
    }
    this._grenierCardRecording = false;
    const btn = document.getElementById('grRecordBtn');
    const lbl = document.getElementById('grRecordLabel');
    if (btn) btn.classList.remove('recording');
    if (lbl) lbl.textContent = 'Appuyer pour enregistrer';
  },

  _grPlayRecording() {

  async _grScoreRecording(blob) {
    const key = this.settings?.azureKey;
    const region = this.settings?.azureRegion || 'eastus';
    if (!key) return;
    const sess = this._grenierStudySession;
    if (!sess) return;
    const card = sess.queue[sess.idx];
    const scoreEl = document.getElementById('grScoreArea');
    if (scoreEl) scoreEl.innerHTML = `<div style="text-align:center;font-size:12px;color:var(--gr-orange2);opacity:0.7">Analyse en cours…</div>`;
    try {
      const arrayBuf = await blob.arrayBuffer();
      const wavBlob = await this._convertToWav(arrayBuf);
      const sc = SpeechSDK.SpeechConfig.fromSubscription(key, region);
      sc.speechRecognitionLanguage = 'fr-FR';
      const paConfig = new SpeechSDK.PronunciationAssessmentConfig(
        card.word,
        SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
        SpeechSDK.PronunciationAssessmentGranularity.Word, true
      );
      const pushStream = SpeechSDK.AudioInputStream.createPushStream();
      const wavBytes = new Uint8Array(await wavBlob.arrayBuffer());
      pushStream.write(wavBytes.buffer);
      pushStream.close();
      const audioConfig = SpeechSDK.AudioConfig.fromStreamInput(pushStream);
      const recognizer = new SpeechSDK.SpeechRecognizer(sc, audioConfig);
      paConfig.applyTo(recognizer);
      recognizer.recognizeOnceAsync(result => {
        recognizer.close();
        try {
          const d = JSON.parse(result.json);
          const nbest = d?.NBest?.[0];
          const score = Math.round(nbest?.PronScore || nbest?.PronunciationAssessment?.PronScore || 0);
          const color = this.scoreColor(score);
          if (scoreEl) scoreEl.innerHTML = `
            <div style="text-align:center;padding:8px;background:${color}22;border-radius:10px;border:1px solid ${color}44">
              <span style="font-family:var(--font-display);font-size:22px;font-weight:700;color:${color}">${score}</span>
              <span style="font-size:11px;color:var(--text3)">/100</span>
              <div style="font-size:11px;color:${color};margin-top:2px">${this.scoreFeedback(score)}</div>
            </div>`;
        } catch(e) {
          if (scoreEl) scoreEl.innerHTML = '';
        }
      }, err => { recognizer.close(); if (scoreEl) scoreEl.innerHTML=''; });
    } catch(e) { if (scoreEl) scoreEl.innerHTML=''; }
  },

  async _convertToWav(arrayBuf) {
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)({ sampleRate:16000 });
      const decoded = await ctx.decodeAudioData(arrayBuf);
      const ch = decoded.getChannelData(0);
      const buf = new ArrayBuffer(44+ch.length*2);
      const v = new DataView(buf);
      const w = (off,s)=>{for(let i=0;i<s.length;i++)v.setUint8(off+i,s.charCodeAt(i));};
      const sr=16000,nc=1;
      w(0,'RIFF');v.setUint32(4,36+ch.length*2,true);w(8,'WAVE');w(12,'fmt ');
      v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);
      v.setUint32(24,sr,true);v.setUint32(28,sr*nc*2,true);v.setUint16(32,nc*2,true);
      v.setUint16(34,16,true);w(36,'data');v.setUint32(40,ch.length*2,true);
      for(let i=0;i<ch.length;i++){const s=Math.max(-1,Math.min(1,ch[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}
      ctx.close();
      return new Blob([buf],{type:'audio/wav'});
    } catch(e) { return new Blob([arrayBuf],{type:'audio/webm'}); }
  },

  _grBuildRhymesPrompt(word, ipaCore) {
    // Find LAST vowel in IPA (walk backwards through Unicode chars)
    const plainVowels = 'aàâæeéèêëiîïoôœøuùûüyɑɛɔœəɐɪʊɥ';
    let rhymeTail = ipaCore || word;
    if (ipaCore) {
      const chars = [...ipaCore];
      let lastVowelIdx = -1;
      for (let i = chars.length - 1; i >= 0; i--) {
        if (plainVowels.includes(chars[i])) { lastVowelIdx = i; break; }
      }
      if (lastVowelIdx >= 0) rhymeTail = chars.slice(lastVowelIdx).join('');
    }
    const ipaLine = ipaCore
      ? `"${word}" = /${ipaCore}/. Terminaison à rimer (depuis la DERNIÈRE voyelle) : /${rhymeTail}/.`
      : `Mot cible : "${word}".`;
    return `${ipaLine}
Trouve des mots FRANÇAIS du dictionnaire courant rimant avec "${word}".
Règle : la rime commence à la DERNIÈRE voyelle tonique. Ignore tout ce qui précède. Pour /${rhymeTail}/, cherche des mots qui se terminent par ce son.

RÈGLES :
- Mots réels du dictionnaire français seulement. N'invente aucun mot.
- Aucun mot anglais.
- Qualité 3 = même finale phonétique /${rhymeTail}/ ET mot très courant.
- Qualité 2 = même finale phonétique /${rhymeTail}/, mot moins courant mais réel.
- Pas de qualité 1. Retourne 1 à 5 mots seulement selon ce qui existe.

Réponds UNIQUEMENT avec ce JSON :
{"rhymes":[{"word":"...","ipa":"/.../","quality":3},{"word":"...","ipa":"/.../","quality":2}]}`;
  },

  _grParseRhymesFromText(text) {
    // Strategy 1: {"rhymes":[...]}
    const arrMatch = text.match(/"rhymes"\s*:\s*(\[[\s\S]*?\])/);
    if (arrMatch) {
      try { const r = JSON.parse(arrMatch[1]); if (r.length) return r.filter(x => x.word); } catch(e) {}
    }
    // Strategy 2: bare [...]
    const bare = text.match(/\[[\s\S]*?\]/);
    if (bare) {
      try { const r = JSON.parse(bare[0]); if (Array.isArray(r) && r.length) return r.filter(x => x.word); } catch(e) {}
    }
    // Strategy 3: collect individual {"word":"...",...} objects
    const objs = [];
    const re = /\{[^{}]*"word"\s*:\s*"([^"]+)"[^{}]*\}/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      try { objs.push(JSON.parse(m[0])); } catch(e) {}
    }
    return objs.length ? objs.filter(x => x.word) : null;
  },

  async _grFetchRhymes(cardId, word) {
    const key = this.settings?.openrouterKey;
    if (!key) { this.showToast('Clé OpenRouter requise pour les rimes'); return; }
    const btn = document.getElementById('grRhymesBtn');
    const slot = document.getElementById('grRhymesSlot');
    if (!btn || !slot) return;
    if (this._grenierRhymesCache[cardId]) {
      slot.innerHTML = this._grenierRhymesCache[cardId];
      slot.style.display = '';
      const svgI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
      btn.innerHTML = `${svgI} Masquer les rimes <span class="gr-star">✦</span>`;
      btn.onclick = () => App._grToggleRhymes();
      return;
    }
    const svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
    btn.style.opacity='0.6';
    btn.innerHTML = `${svgIcon} Chargement… <span class="gr-star">✦</span>`;
    try {
      const model = this.settings?.rhymesModel || 'google/gemini-2.5-flash-lite-preview-09-2025';
      // Get IPA of current card
      const sess = this._grenierStudySession;
      const card = sess ? sess.queue[sess.idx] : null;
      const ipaRaw = card?.ipa || '';
      const ipaCore = ipaRaw.replace(/[\/\[\]]/g, '').trim();

      const prompt = this._grBuildRhymesPrompt(word, ipaCore);
      console.log(`[Rimes/gr] "${word}" | model: ${model} | tail: /${ipaCore}/`);
      const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method:'POST',
        headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json','HTTP-Referer':window.location.href},
        body:JSON.stringify({model, messages:[{role:'user',content:prompt}], max_tokens:400})
      });
      console.log(`[Rimes/gr] HTTP ${resp.status}`);
      const data = await resp.json();
      if (data.error) throw new Error(`API: ${data.error.message || JSON.stringify(data.error)}`);
      const text = data.choices?.[0]?.message?.content?.trim() || '';
      console.log(`[Rimes/gr] finish=${data.choices?.[0]?.finish_reason} len=${text.length}`, text.slice(0, 400));
      const rhymes = this._grParseRhymesFromText(text);
      console.log(`[Rimes/gr] parsed:`, rhymes);
      if (!rhymes || rhymes.length === 0) throw new Error('No rhymes parsed');

      const html = this._grRhymesHtml(word, rhymes.slice(0, 5));
      this._grenierRhymesCache[cardId] = html;
      if (card) { card._rhymes = html; this.saveGrenier(); }
      slot.innerHTML = html;
      slot.style.display = '';
      btn.style.opacity = '';
      btn.innerHTML = `${svgIcon} Masquer les rimes <span class="gr-star">✦</span>`;
      btn.onclick = () => App._grToggleRhymes();
    } catch(e) {
      console.error(`[Rimes/gr] FAILED "${word}":`, e.message);
      btn.style.opacity = '';
      btn.classList.remove('loading');
      const svgI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
      btn.innerHTML = `${svgI} Rimes <span class="gr-star">✦</span>`;
      if (slot) { slot.innerHTML = `<div style="font-size:12px;color:color-mix(in srgb,var(--card-accent,var(--gr-orange)) 60%,transparent);padding:6px 2px">Impossible de trouver des rimes.</div>`; slot.style.display = ''; }
    }

  _grRhymesHtml(word, rhymes) {
    // Only show quality 2 and 3 — drop quality 1 entirely
    const visibleRhymes = rhymes.filter(r => (r.quality || 2) >= 2);
    if (visibleRhymes.length === 0) return '<div style="font-size:12px;color:var(--text3);padding:6px 0">Aucune rime fiable trouvée.</div>';
    const chips = visibleRhymes.map(r => {
      const q = Math.min(3, Math.max(2, r.quality || 2));
      // q3: vivid accent (perfect + common) | q2: standard accent (solid rhyme)
      const style = q === 3
        ? `background:color-mix(in srgb,var(--card-accent,var(--gr-orange)) 20%,transparent);border:1.5px solid color-mix(in srgb,var(--card-accent,var(--gr-orange)) 75%,transparent);color:var(--card-accent,var(--gr-orange))`
        : `background:color-mix(in srgb,var(--card-accent,var(--gr-orange)) 10%,transparent);border:1px solid color-mix(in srgb,var(--card-accent,var(--gr-orange)) 45%,transparent);color:color-mix(in srgb,var(--card-accent,var(--gr-orange)) 85%,var(--text2))`;
      const safeWord = r.word.replace(/'/g, "\\'");
      return `<div style="${style};border-radius:10px;padding:7px 12px;font-size:13px;font-weight:${q===3?'700':'600'};display:inline-flex;align-items:center;gap:5px;cursor:pointer"
        onclick="App._grOpenRhymeInWF('${safeWord}')"
        title="Voir dans Mot en Focus">
        ${r.word}<span style="font-size:11px;font-weight:400;opacity:0.7">${r.ipa||''}</span>
      </div>`;
    }).join('');
    const safeWordEsc = word.replace(/'/g, "\\'");
    return `<div style="margin-top:10px;padding:12px;background:color-mix(in srgb,var(--card-accent,var(--gr-orange)) 6%,transparent);border:1px solid color-mix(in srgb,var(--card-accent,var(--gr-orange)) 20%,transparent);border-radius:var(--radius-sm)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:10px;color:var(--card-accent,var(--gr-orange));opacity:0.7;text-transform:uppercase;letter-spacing:.1em">Rimes pour « ${word} »</div>
        <button onclick="App._grRegenRhymes('${safeWordEsc}')" title="Regénérer les rimes"
          style="background:none;border:1px solid color-mix(in srgb,var(--card-accent,var(--gr-orange)) 35%,transparent);border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;color:var(--card-accent,var(--gr-orange));opacity:0.75;cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;gap:4px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
          Regénérer
        </button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${chips}</div>
    </div>`;
  },

  _grRegenRhymes(word) {
    // Clear cache for current card and re-fetch
    const sess = this._grenierStudySession;
    if (!sess) return;
    const card = sess.queue[sess.idx];
    if (!card) return;

  _grRate(rating) {
    const sess = this._grenierStudySession;
    if (!sess) return;
    const card = sess.queue[sess.idx];

    // Save state for undo BEFORE mutating anything
    sess.undoStack = sess.undoStack || [];
    sess.undoStack.push({
      idx: sess.idx,
      queueLength: sess.queue.length,
      cardSnapshot: {
        id: card.id, interval: card.interval, ease: card.ease,
        reps: card.reps, nextDue: card.nextDue, lastReviewed: card.lastReviewed
      },
      stats: { ...sess.stats },
      rating,
    });

    // Update stats
    const rNames = ['again','hard','good','easy'];
    sess.stats[rNames[rating]]++;

    // Schedule card
    this._grSchedule(card, rating);
    if (rating === 0) {
      // Push to end of queue for re-practice (mark so undo can remove it)
      const requeued = { ...card, _requeuedFrom: sess.idx };
      sess.queue.push(requeued);
    }
    const updCard = this._grenier.cards.find(c=>c.id===card.id);
    if (updCard) Object.assign(updCard, { interval:card.interval, ease:card.ease, reps:card.reps, nextDue:card.nextDue, lastReviewed:card.lastReviewed });
    this.saveGrenier();

    sess.idx++;
    this._grenierCardRecording = false;
    this._grenierCardAudioBlob = null;
    this._grRenderStudyCard();
  },

  _grUndo() {
    const sess = this._grenierStudySession;
    if (!sess || !sess.undoStack || !sess.undoStack.length) return;
    const prev = sess.undoStack.pop();

    // Remove any re-queued copies added by "À revoir" for this undo step
    sess.queue = sess.queue.filter(c => c._requeuedFrom !== prev.idx);

    // Restore card state in grenier data
    const updCard = this._grenier.cards.find(c => c.id === prev.cardSnapshot.id);
    if (updCard) {
      Object.assign(updCard, {
        interval: prev.cardSnapshot.interval,
        ease: prev.cardSnapshot.ease,
        reps: prev.cardSnapshot.reps,
        nextDue: prev.cardSnapshot.nextDue,
        lastReviewed: prev.cardSnapshot.lastReviewed,
      });
      // Also restore on the queue card object
      const qCard = sess.queue[prev.idx];
      if (qCard) Object.assign(qCard, updCard);
    }
    this.saveGrenier();

    // Restore stats and index
    sess.stats = prev.stats;
    sess.idx = prev.idx;

    this._grenierCardRecording = false;
    this._grenierCardAudioBlob = null;
    this._grRenderStudyCard();
  },

  async _grGenerateDef(cardId, word, type = 'simple') {
    const key = this.settings?.openrouterKey;
    if (!key) { this.showToast('Clé OpenRouter requise'); return; }
    const btnId = type === 'complex' ? 'grDefGenComplexBtn' : 'grDefGenSimpleBtn';
    const btn = document.getElementById(btnId);
    const origHtml = btn?.innerHTML;
    if (btn) { btn.disabled = true; btn.classList.add('btn-processing'); }
    // Read context from the card-back context input if present
    const context = document.getElementById('grCtxInput')?.value?.trim() || '';
    // Append mode: if checkbox is NOT checked, append to existing def (checked = overwrite)
    const appendMode = !(document.getElementById('grAppendToggle')?.checked || false);
    try {
      const isComplex = type === 'complex';
      const model = (isComplex ? this.settings?.defComplexModel : this.settings?.defSimpleModel)
        || this.settings?.openrouterModel || 'openai/gpt-4o-mini';
      const customPrompt = isComplex ? this.settings?.defComplexPrompt : this.settings?.defSimplePrompt;
      let prompt;
      if (customPrompt?.trim()) {
        prompt = customPrompt.replace(/\{word\}/g, word);
        if (context) prompt += `\n\nContexte fourni : « ${context} »\nIntègre cet exemple dans la définition.`;
      } else if (isComplex) {
        prompt = `Fais une analyse complète en français du mot « ${word} » :\n1. Définition principale\n2. Étymologie (brève)\n3. Registre d'usage (formel, familier, littéraire…)\n4. Synonymes (2-3)\n5. Exemple en contexte${context ? ` (intègre : « ${context} »)` : ''}\n6. Note phonétique ou particularité\nRéponds UNIQUEMENT avec la liste numérotée, sans titre ni introduction.`;
      } else if (context) {
        prompt = `Donne une courte définition en français (1-2 phrases max) du mot : « ${word} ».\nContexte : « ${context} » — intègre cet exemple. Inclus d'autres usages courants. Mentionne brièvement le registre (courant/conversationnel, technique, littéraire, etc.) et, si applicable, tout usage régional notable — sinon ne le mentionne pas.\nRéponds UNIQUEMENT avec la définition, sans titre ni mise en forme.`;
      } else {
        prompt = `Donne une courte définition en français (1-2 phrases max) du mot : « ${word} ». Inclus un exemple d'usage. Mentionne brièvement le registre (courant/conversationnel, technique, littéraire, etc.) et, si applicable, tout usage régional notable — sinon ne le mentionne pas. Réponds UNIQUEMENT avec la définition, sans titre ni mise en forme.`;
      }
      const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method:'POST',
        headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json','HTTP-Referer':window.location.href},
        body:JSON.stringify({ model, messages:[{role:'user',content:prompt}], max_tokens:600 })
      });
      const data = await resp.json();
      const newText = data.choices?.[0]?.message?.content?.trim() || '';
      if (newText) {
        const card = this._grenier.cards.find(c => c.id === cardId);
        const def = (appendMode && card?.definition) ? card.definition + '\n\n' + newText : newText;
        if (card) { card.definition = def; this.saveGrenier(); }
        const display = document.getElementById('grDefDisplay');
        if (display) { display.innerHTML = def; App._idbHydrateImages(display); }
        const ta = document.getElementById('grDefTextarea');
        if (ta) ta.innerHTML = def;
        this.showToast(`Définition ${isComplex ? 'complexe' : 'simple'} générée ✓`);
        // ── Mirror to MOF if same word ────────────────────────────
        if (this._wfCurrentWord && card && card.word?.toLowerCase() === this._wfCurrentWord.toLowerCase()) {
          this._wfCurrentDef = def;
          this._wfUpdateFlipDot();
          const wfContent = document.getElementById('wfDefContent');
          if (wfContent) { wfContent.innerHTML = def; App._idbHydrateImages(wfContent); }
          const wfTa = document.getElementById('wfDefTextarea');
          if (wfTa) wfTa.innerHTML = def;
        }
      }
    } catch(e) { this.showToast('Erreur lors de la génération'); }
    if (btn) { btn.disabled = false; btn.classList.remove('btn-processing'); if (origHtml) btn.innerHTML = origHtml; }
  },

          <div style="display:flex;flex-wrap:wrap;gap:3px" id="wfGrenierTagRow">${
            [
              { id:'fr',    emoji:'🇫🇷', label:'Usage France' },
              { id:'ca',    emoji:'🇨🇦', label:'Usage Québec / Canada' },
              { id:'book',  emoji:'📚', label:'Littéraire / soutenu' },
              { id:'mouth', emoji:'👄', label:'Oral / familier' },
              { id:'news',  emoji:'🗞️', label:'Journalistique' },
              { id:'sci',   emoji:'🌱', label:'Mot scientifique' },
              { id:'fun',   emoji:'😄', label:'Argot / décontracté' },
              { id:'arch',  emoji:'🏛️', label:'Vieux / désuet' },
            ].map(t => { const on = tagsActuels.has(t.id);
              return `<button type="button" id="wfGrTag_${t.id}" title="${t.label}" onclick="App._wfGrToggleTag('${t.id}',this)"
              style="font-size:18px;padding:3px 5px;border-radius:8px;cursor:pointer;transition:all 0.15s;${on
                ? 'border:2px solid #A78BFA;background:rgba(167,139,250,0.12);filter:none'
                : 'border:2px solid transparent;background:transparent;filter:grayscale(1) opacity(0.35)'}">${t.emoji}</button>`; }).join('')
          }</div>
        </div>
        <button class="rep-overlay-cancel" onclick="document.getElementById('wfGrenierModal').remove()">Annuler</button>
      </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    // Store word/ipa/context/existingDef for use in deck selection
    this._wfGrenierPendingWord = word;
    this._wfGrenierPendingIpa = ipa;
    this._wfGrenierPendingContext = context;
    this._wfGrenierPendingDef = existingDef;
    this._wfGrenierPendingTags = tagsActuels;
  },

  _wfGrToggleTag(id, btn) {
    if (!this._wfGrenierPendingTags) this._wfGrenierPendingTags = new Set();
    const on = this._wfGrenierPendingTags.has(id);
    if (on) {
      this._wfGrenierPendingTags.delete(id);
      btn.style.filter = 'grayscale(1) opacity(0.35)';
      btn.style.borderColor = 'transparent';
      btn.style.background = 'transparent';
    } else {
      this._wfGrenierPendingTags.add(id);
      btn.style.filter = 'none';
      btn.style.borderColor = '#A78BFA';
      btn.style.background = 'rgba(167,139,250,0.12)';
    }
    // Mot déjà au Grenier : on écrit sans attendre de confirmation, puisqu'il
    // n'y a plus rien à confirmer — la carte existe déjà.
    const ids = this._wfGrenierEditCards || [];
    if (!ids.length) return;
    const tags = [...this._wfGrenierPendingTags];
    let n = 0;
    for (const c of this._grenier.cards) {
      if (ids.includes(c.id)) { c.tags = [...tags]; n++; }
    }
    if (n) {
      this.saveGrenier();
      this.showToast(tags.length ? 'Étiquettes mises à jour ✓' : 'Étiquettes effacées ✓');
    }
  },

  _wfGrenierSelectDeck(deckId) {
    const word = this._wfGrenierPendingWord;
    const ipa = this._wfGrenierPendingIpa || this._wfCurrentIpa;
    const context = this._wfGrenierPendingContext || '';
    const existingDef = this._wfGrenierPendingDef || '';
    if (!word) return;
    const alreadyIn = this._grenier.cards.some(c => c.deckId === deckId && c.word?.toLowerCase() === word.toLowerCase() && !c.deleted);
    if (alreadyIn) { this.showToast(`"${word}" est déjà dans ce paquet`); return; }
    const genDef = document.getElementById('wfGrenierDefToggle')?.classList.contains('on');
    const tags = [...(this._wfGrenierPendingTags || new Set())];
    const cardId = this._gid();
    this._grenier.cards.push({
      id: cardId, deckId, word, ipa: ipa || '',
      interval: 1, ease: 2.5, reps: 0, nextDue: Date.now(),
      showListen: true, showRecord: true, showRhymes: true,
      color: null, definition: existingDef, tags, createdAt: Date.now()
    });
    // Also add to corresponding repertoire folder if one is linked
    const deck = this._grenier.decks.find(d => d.id === deckId);
    if (deck) {
      const matchFolder = this._repertoire.folders.find(f => f.name === deck.name);
      if (matchFolder && !this.repIsWordSaved(word)) {
        this.repAddWord(word, ipa, matchFolder.id, 'grenier');
      }
    }
    this.saveGrenier();
    document.getElementById('wfGrenierModal')?.remove();
    this.showToast(`"${word}" ajouté au Grenier ✓`);
    // If MOF definition exists, use it directly — no need to generate
    if (!existingDef && genDef && this.settings.openrouterKey) {
      // Ne plus revenir à « simple » d'office : le choix doit tenir.
      const defType = this._wfDefType || this.settings.defType || 'simple';
      this._grGenerateDefForNewCard(cardId, word, context, defType);
    }
    this._wfUpdateSaveBtn();
    this._wfUpdateRepBtn();
  },

  _wfGrenierNewDeck() {
    document.getElementById('wfGrenierModal')?.remove();
    this.showToast('Créez un paquet dans Le Grenier, puis revenez!');
    this.navigate('grenier');
    setTimeout(() => this._grShowNewDeck(), 400);

  _wfCreateDeckAndSelect() {
    const name = document.getElementById('wfNewDeckNameInput')?.value.trim();
    if (!name) { document.getElementById('wfNewDeckNameInput')?.focus(); return; }
    const emoji = this._wfNewDeckEmoji || '📁';
    const color = this._wfNewDeckColor || this.GRENIER_COLORS[0];
    const deckId = this._gid();
    this._grenier.decks.push({ id: deckId, name, color, createdAt: Date.now() });
    // Mirror in Répertoire
    let folderId = null;
    const existingFolder = this._repertoire.folders.find(f => f.name === name);
    if (existingFolder) {
      folderId = existingFolder.id;
    } else {
      folderId = 'folder_' + Date.now();
      this._repertoire.folders.push({ id: folderId, name, emoji, createdAt: Date.now() });
    }
    this.saveRepertoire();
    this.saveGrenier();
    document.getElementById('wfGrenierModal')?.remove();

    const word = this._wfGrenierPendingWord || this._wfCurrentWord;
    const ipa = this._wfGrenierPendingIpa || this._wfCurrentIpa || '';
    const context = this._wfGrenierPendingContext || '';
    const existingDef = this._wfGrenierPendingDef || '';

    // Add to Répertoire
    if (folderId && !this.repIsWordSaved(word)) {
      this.repAddWord(word, ipa, folderId, 'grenier');
    }

    const cardId = this._gid();
    this._grenier.cards.push({
      id: cardId, deckId, word, ipa,
      interval: 1, ease: 2.5, reps: 0, nextDue: Date.now(),
      showListen: true, showRecord: true, showRhymes: true,
      color: null, definition: existingDef, createdAt: Date.now()
    });
    this.saveGrenier();
    this.showToast(`Paquet "${name}" créé et "${word}" ajouté ✓`);

    // Generate definition if no existing def and key available
    if (!existingDef && this.settings.openrouterKey) {
      const defType = this._wfDefType || 'simple';
      this._wfDefType = 'simple';
      this._grGenerateDefForNewCard(cardId, word, context, defType);
    }

    this._wfUpdateSaveBtn();
    this._wfUpdateRepBtn();
  },

  async _grGenerateDefForNewCard(cardId, word, context = '', type = 'simple') {
    const key = this.settings?.openrouterKey;
    if (!key) return;
    try {
      const isComplex = type === 'complex';
      const model = (isComplex ? this.settings?.defComplexModel : this.settings?.defSimpleModel)
        || this.settings?.openrouterModel || 'openai/gpt-4o-mini';
      const customPrompt = isComplex ? this.settings?.defComplexPrompt : this.settings?.defSimplePrompt;
      let prompt;
      if (customPrompt?.trim()) {
        prompt = customPrompt.replace(/\{word\}/g, word);
        if (context) prompt += `\n\nContexte fourni : « ${context} »\nIntègre cet exemple dans la définition.`;
      } else if (isComplex) {
        prompt = `Fais une analyse complète en français du mot « ${word} » :\n1. Définition principale\n2. Étymologie (brève)\n3. Registre d'usage\n4. Synonymes (2-3)\n5. Exemple en contexte${context ? ` (intègre cet exemple : « ${context} »)` : ''}\n6. Note phonétique ou particularité\nRéponds UNIQUEMENT avec la liste numérotée, sans titre ni introduction.`;
      } else if (context) {
        prompt = `Donne une courte définition en français (1-2 phrases max) du mot : « ${word} ».\nContexte : « ${context} » — intègre cet exemple dans la définition. Inclus aussi d'autres usages courants. Mentionne brièvement le registre (courant/conversationnel, technique, littéraire, etc.) et, si applicable, tout usage régional notable — sinon ne le mentionne pas.\nRéponds UNIQUEMENT avec la définition, sans titre ni mise en forme.`;
      } else {
        prompt = `Donne une courte définition en français (1-2 phrases max) du mot : « ${word} ». Inclus un exemple d'usage. Mentionne brièvement le registre (courant/conversationnel, technique, littéraire, etc.) et, si applicable, tout usage régional notable — sinon ne le mentionne pas. Réponds UNIQUEMENT avec la définition, sans titre ni mise en forme.`;
      }
      const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method:'POST',
        headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json','HTTP-Referer':window.location.href},
        body:JSON.stringify({ model, messages:[{role:'user',content:prompt}], max_tokens:600 })
      });
      const data = await resp.json();
      const def = data.choices?.[0]?.message?.content?.trim() || '';
      if (def) {
        const card = this._grenier.cards.find(c => c.id === cardId);
        if (card) { card.definition = def; this.saveGrenier(); }
        // ── Mirror definition to MOF immediately ────────────────
        if (this._wfCurrentWord && card && card.word?.toLowerCase() === this._wfCurrentWord.toLowerCase()) {
          this._wfCurrentDef = def;
          this._wfUpdateFlipDot();
          // If MOF def panel is currently open, update it live
          const wfContent = document.getElementById('wfDefContent');
          if (wfContent) { wfContent.innerHTML = def; App._idbHydrateImages(wfContent); }
          const wfTa = document.getElementById('wfDefTextarea');
          if (wfTa) wfTa.innerHTML = def;
          // If panel is not open, show a toast so user knows it's ready
          if (!this._wfDefPanelOpen) this.showToast('Définition prête — voir le verso ✓');
        }
      }
    } catch(e) { /* silent */ }
  },

  _grCardSettingColorChange(cardId, el, color) {

    el.classList.add('selected');
