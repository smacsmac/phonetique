  // ── RÉPERTOIRE — DATA ────────────────────────────────────────
  // Schema: { folders: [{id, name, emoji, createdAt}], words: [{id, word, ipa, folderId, addedAt, source}] }
  _repertoire: { folders: [], words: [] },

  loadRepertoire() {
    try {
      const r = localStorage.getItem('phonetique_repertoire');
      if (r) this._repertoire = JSON.parse(r);
    } catch(e) {}
    if (!this._repertoire.folders) this._repertoire.folders = [];
    if (!this._repertoire.words) this._repertoire.words = [];
    // Remove legacy 'default' / 'Mes mots' folder
    this._repertoire.folders = this._repertoire.folders.filter(f => f.id !== 'default');

    // Un mot dont le dossier a disparu était jusqu'ici versé dans le PREMIER
    // dossier venu. Avec plusieurs appareils, il suffit qu'un dossier soit
    // supprimé ailleurs pour que tout son contenu atterrisse silencieusement
    // dans un dossier sans rapport — deux dossiers qui n'en font plus qu'un.
    // On les rassemble désormais à part, où ils sont visibles et récupérables.
    const vivants = new Set(this._repertoire.folders.map(f => f.id));
    const orphelins = this._repertoire.words.filter(
      w => !w.folderId || w.folderId === 'default' || !vivants.has(w.folderId));
    if (orphelins.length) {
      let bac = this._repertoire.folders.find(f => f.name === 'À ranger');
      if (!bac) {
        bac = { id: 'folder_a_ranger', name: 'À ranger', emoji: '📥', createdAt: Date.now() };
        this._repertoire.folders.push(bac);
      }
      orphelins.forEach(w => { w.folderId = bac.id; });
      this.saveRepertoire();
      console.info(`[Répertoire] ${orphelins.length} mot(s) sans dossier rangés dans « À ranger »`);
    }
  },

  saveRepertoire() {
    if (!this._syncApplying) {
      this._syncStamp('folder', this._repertoire.folders);
      this._syncStamp('word',   this._repertoire.words);
    }
    localStorage.setItem('phonetique_repertoire', JSON.stringify(this._repertoire));
  },

  // ── LOOKUP HISTORY (persisted "Récents") ─────────────────────
  // Each entry: { word, ipa, lookedUpAt }  — capped at 30
  _lookupHistory: [],

  loadLookupHistory() {
    try {
      const s = localStorage.getItem('phonetique_lookup_history');
      if (s) this._lookupHistory = JSON.parse(s);
    } catch(e) { this._lookupHistory = []; }
  },

  saveLookupHistory() {
    localStorage.setItem('phonetique_lookup_history', JSON.stringify(this._lookupHistory));
  },

  // ══════════════════════════════════════════════════════════════════════
  // SYNCHRO — réseau local (phonetique-sync.mjs) ou fichier partagé
  //
  // Offline-first : l'appli fonctionne sans réseau, la synchro est une étape
  // séparée qui ne bloque jamais. La fusion se fait enregistrement par
  // enregistrement, jamais fichier par fichier.
  //
  // Trois horodatages par carte plutôt que deux : réviser sur le téléphone
  // et corriger une définition sur le PC touchent des champs différents, et
  // un seul horodatage ferait perdre l'un des deux.
  //   uContent — ce que la carte dit (mot, API, définition, genre…)
  //   uReview  — où elle en est (intervalle, facilité, prochaine échéance)
  //   uPlace   — dans quel paquet elle range
  // ══════════════════════════════════════════════════════════════════════

  _SYNC_GROUPS: {
    // « deleted » fait partie du contenu : sans ça, supprimer une carte ne
    // changerait aucun champ suivi, l'horodatage resterait vieux, et la
    // suppression perdrait contre une simple relecture faite ailleurs.
    card:   { uContent: ['word','ipa','definition','gender','tags','color','deleted'],
              uReview:  ['interval','ease','reps','lastReviewed','nextDue'],
              uPlace:   ['deckId'] },
    // « ord » est un rangement, pas un contenu : réordonner sur un appareil
    // ne doit pas écraser un renommage fait sur un autre.
    deck:   { uContent: ['name','color','_emoji'], uPlace: ['ord'] },
    folder: { uContent: ['name','emoji'],          uPlace: ['ord'] },
    word:   { uContent: ['word','ipa','source'], uPlace: ['folderId'] },
  },
  _SYNC_TOMB_MAXAGE: 90 * 86400000,   // purge des pierres tombales à 90 jours

  // Config propre à CHAQUE appareil — jamais synchronisée : chaque appareil
  // vise le serveur à sa façon (le téléphone en https, le PC en http).
  _syncCfg: null,
  _syncSnap: null,       // dernier état sauvegardé, pour repérer ce qui change
  _syncDeleted: null,    // { id: horodatage de suppression }
  _syncSettingsU: 0,
  _syncState: 'idle',    // idle | busy | ok | offline | error
  _syncMsg: '',
  _syncApplying: false,  // vrai pendant qu'on écrit l'état fusionné

  loadSyncConfig() {
    this._syncCfg = { url: '', alts: [], mode: 'lan', auto: true, lastSync: 0 };
    try {
      const raw = localStorage.getItem('phonetique_sync_config');
      if (raw) Object.assign(this._syncCfg, JSON.parse(raw));
    } catch(e) {}
    try {
      this._syncDeleted = JSON.parse(localStorage.getItem('phonetique_deleted') || '{}');
    } catch(e) { this._syncDeleted = {}; }
    this._syncSettingsU = Number(localStorage.getItem('phonetique_settings_u') || 0);
    // Si l'appli est servie par le serveur, il est son propre candidat évident.
    if (!this._syncCfg.url && /^https?:$/.test(location.protocol) && location.host) {
      this._syncCfg.url = location.origin;
    }
  },
  saveSyncConfig() {
    localStorage.setItem('phonetique_sync_config', JSON.stringify(this._syncCfg));
  },
  _syncSaveDeleted() {
    localStorage.setItem('phonetique_deleted', JSON.stringify(this._syncDeleted));
  },

  // Une suppression doit laisser une trace, sinon l'autre appareil renvoie
  // l'enregistrement à la synchro suivante et il ressuscite.
  _syncTombstone(...ids) {
    if (!this._syncDeleted) this._syncDeleted = {};
    const now = Date.now();
    for (const id of ids.flat()) if (id) this._syncDeleted[id] = now;
    this._syncSaveDeleted();
  },
  _syncIsDeleted(id) {
    return !!(this._syncDeleted && this._syncDeleted[id]);
  },
  // Paquet et dossier portent le même nom mais des id différents sur chaque
  // appareil : c'est le NOM qui les relie. On marque donc aussi le nom, sinon
  // le jumeau survivant recrée le disparu à la réconciliation suivante.
  // Paquets, dossiers, mots et cartes se recopient mutuellement. Si chaque
  // appareil invente un id au hasard pour le miroir, les deux versions
  // survivent à la fusion et le mot apparaît en double — sans fin. En dérivant
  // l'id du couple (nom du paquet, mot), les deux appareils fabriquent
  // exactement le même enregistrement, qui fusionne en un seul.
  _syncMirrorId(prefix, key) {
    const s = String(key).toLowerCase();
    let h1 = 5381, h2 = 52711;
    for (let i = 0; i < s.length; i++) h1 = ((h1 * 33) ^ s.charCodeAt(i)) >>> 0;
    for (let i = s.length - 1; i >= 0; i--) h2 = ((h2 * 31) ^ s.charCodeAt(i)) >>> 0;
    return prefix + h1.toString(36) + h2.toString(36);
  },
  _syncTombstoneNamed(name, ...ids) {
    if (name) this._syncTombstone('nom:' + String(name).toLowerCase());
    if (ids.length) this._syncTombstone(...ids);
  },
  // Un miroir bloqué doit pouvoir se débloquer : si la source est modifiée
  // après la suppression (le mot est réajouté), le miroir redevient légitime.
  // D'où la comparaison d'horodatage plutôt qu'un simple « déjà supprimé ».
  _syncMirrorBlocked(mid, src) {
    const t = this._syncDeleted?.[mid];
    if (!t) return false;
    const newest = Math.max(
      Number(src?.uContent || 0), Number(src?.uPlace || 0),
      Number(src?.createdAt || 0), Number(src?.addedAt || 0));
    return t >= newest;
  },

  // ── horodatage par comparaison ────────────────────────────────────────
  // Plutôt que d'estampiller à la main dans les ~60 endroits qui modifient
  // une carte ou un mot — où un oubli se paierait en données perdues — on
  // compare l'état sauvegardé au précédent et on n'estampille que ce qui a
  // réellement changé.
  _syncSig(rec, fields) {
    let out = '';
    for (const f of fields) out += '' + JSON.stringify(rec[f] ?? null);
    return out;
  },
  _syncStamp(kind, list) {
    if (!this._syncSnap) this._syncSnap = { card:{}, deck:{}, folder:{}, word:{} };
    const groups = this._SYNC_GROUPS[kind];
    const prevAll = this._syncSnap[kind] || {};
    const nextAll = {};
    const now = Date.now();
    for (const rec of (list || [])) {
      if (!rec || !rec.id) continue;
      const prev = prevAll[rec.id];
      const sigs = {};
      for (const stamp in groups) {
        const sig = this._syncSig(rec, groups[stamp]);
        sigs[stamp] = sig;
        if (prev && prev[stamp] !== sig) {
          rec[stamp] = now;                       // modifié à l'instant
        } else if (typeof rec[stamp] !== 'number') {
          // Première rencontre : on date de la création, jamais de maintenant.
          // Sinon un appareil qui vient d'installer l'appli écraserait des
          // données plus récentes venues d'ailleurs.
          rec[stamp] = rec.createdAt || rec.addedAt || now;
        }
      }
      nextAll[rec.id] = sigs;
    }
    this._syncSnap[kind] = nextAll;
  },
  // Appelé après le chargement initial : fige l'état de départ pour que la
  // première sauvegarde ne marque pas tout comme « modifié maintenant ».
  _syncSnapshot() {
    this._syncSnap = { card:{}, deck:{}, folder:{}, word:{} };
    this._syncStamp('deck',   this._grenier?.decks);
    this._syncStamp('card',   this._grenier?.cards);
    this._syncStamp('folder', this._repertoire?.folders);
    this._syncStamp('word',   this._repertoire?.words);
    this._syncCollectCardTombstones();
  },

  _syncCollectCardTombstones() {
    if (!this._syncDeleted) this._syncDeleted = {};
    let changed = false;
    for (const c of (this._grenier?.cards || [])) {
      if (c.deleted && !this._syncIsDeleted(c.id)) {
        // Une carte déjà supprimée avant l'arrivée de la synchro n'a pas de
        // date : on prend sa dernière modification connue, pas maintenant,
        // pour ne pas écraser une version vivante venue d'un autre appareil.
        const ts = c.deletedAt || c.uContent || c.createdAt || Date.now();
        this._syncDeleted[c.id] = ts;
        // Marquer aussi l'id miroir (paquet|mot) : sinon la réconciliation
        // recrée la carte depuis le mot resté au Répertoire, sous un id neuf
        // que la pierre tombale ne couvre pas.
        const deck = this._grenier.decks.find(d => d.id === c.deckId);
        if (deck && c.word) this._syncDeleted[this._syncMirrorId('mc_', deck.name + '|' + c.word)] = ts;
        changed = true;
      }
    }
    if (changed) this._syncSaveDeleted();
  },

  // ── fusion ────────────────────────────────────────────────────────────
  _syncMergeList(kind, localList, remoteList, tombs) {
    const groups = this._SYNC_GROUPS[kind];
    const byId = new Map();
    for (const r of (localList || [])) if (r && r.id) byId.set(r.id, r);
    for (const rem of (remoteList || [])) {
      if (!rem || !rem.id) continue;
      const loc = byId.get(rem.id);
      if (!loc) { byId.set(rem.id, rem); continue; }
      // groupe par groupe : le plus récent gagne, indépendamment des autres
      for (const stamp in groups) {
        const rt = Number(rem[stamp] || 0), lt = Number(loc[stamp] || 0);
        if (rt > lt) {
          for (const f of groups[stamp]) loc[f] = rem[f];
          loc[stamp] = rt;
        }
      }
    }
    // pierres tombales : on supprime si la suppression est postérieure à
    // toute modification connue de l'enregistrement
    const out = [];
    for (const r of byId.values()) {
      const t = tombs[r.id];
      if (t) {
        let newest = 0;
        for (const stamp in groups) newest = Math.max(newest, Number(r[stamp] || 0));
        if (t >= newest) continue;              // resté supprimé
        delete tombs[r.id];                     // ressuscité volontairement
      }
      out.push(r);
    }
    // Tri déterministe : deux appareils doivent aboutir au même ordre.
    // « ord » d'abord, pour que le rangement choisi à la main voyage avec la
    // synchro ; puis la date de création et l'id, qui départagent partout.
    out.sort((a, b) => {
      const ra = Number.isFinite(a.ord) ? a.ord : Infinity;
      const rb = Number.isFinite(b.ord) ? b.ord : Infinity;
      if (ra !== rb) return ra - rb;
      return (Number(b.createdAt || b.addedAt || 0) - Number(a.createdAt || a.addedAt || 0))
          || String(a.id).localeCompare(String(b.id));
    });
    return out;
  },

  _syncMergeMax(local, remote) {
    const out = { ...(local || {}) };
    for (const [k, v] of Object.entries(remote || {})) {
      if (typeof v === 'number') { if (!(k in out) || v > out[k]) out[k] = v; }
      else if (!(k in out)) out[k] = v;
    }
    return out;
  },

  _syncMerge(remote) {
    if (!remote || typeof remote !== 'object') return false;

    // 1. pierres tombales des deux côtés
    const tombs = { ...(this._syncDeleted || {}) };
    for (const [id, ts] of Object.entries(remote.deleted || {})) {
      if (!tombs[id] || ts > tombs[id]) tombs[id] = ts;
    }

    // 2. collections, enregistrement par enregistrement
    const rg = remote.grenier || {}, rr = remote.repertoire || {};
    this._grenier.decks    = this._syncMergeList('deck',   this._grenier.decks,      rg.decks,   tombs);
    this._grenier.cards    = this._syncMergeList('card',   this._grenier.cards,      rg.cards,   tombs);
    this._repertoire.folders = this._syncMergeList('folder', this._repertoire.folders, rr.folders, tombs);
    this._repertoire.words   = this._syncMergeList('word',   this._repertoire.words,   rr.words,   tombs);

    // 3. scores : garder le meilleur, comme le fait déjà l'import
    this.scores        = this._syncMergeMax(this.scores, remote.scores);
    this.passageScores = this._syncMergeMax(this.passageScores, remote.passageScores);
    if (remote.bilan) {
      this.bilanBestScores = this._syncMergeMax(this.bilanBestScores, remote.bilan.best);
      // « dernier bilan » est une photo d'un moment : on ne garde le distant
      // que si on n'en a pas localement, plutôt que de mélanger deux séances.
      if (!this.bilanScores || !Object.keys(this.bilanScores).length) {
        this.bilanScores = remote.bilan.latest || this.bilanScores;
        if (remote.bilan.passageIndex != null) this.bilanPassageIndex = remote.bilan.passageIndex;
        if (remote.bilan.aiPassage) this.bilanAiPassage = remote.bilan.aiPassage;
      }
    }
    // 4. passages IA : union, le local prime (ils sont longs à regénérer)
    this.aiPassages = { ...(remote.aiPassages || {}), ...(this.aiPassages || {}) };

    // 5. historique : union dédoublonnée, plus récent d'abord, plafonné à 30
    if (Array.isArray(remote.lookupHistory)) {
      const seen = new Set();
      this._lookupHistory = [...(this._lookupHistory || []), ...remote.lookupHistory]
        .filter(e => e && e.word)
        .sort((a, b) => Number(b.lookedUpAt || 0) - Number(a.lookedUpAt || 0))
        .filter(e => { const k = e.word.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
        .slice(0, 30);
    }

    // 6. réglages : objet unique, le plus récemment modifié gagne
    if (remote.settings && Number(remote.settingsU || 0) > Number(this._syncSettingsU || 0)) {
      Object.assign(this.settings, remote.settings);
      this._syncSettingsU = Number(remote.settingsU);
      localStorage.setItem('phonetique_settings_u', String(this._syncSettingsU));
    }

    // 7. purge des vieilles pierres tombales
    const cutoff = Date.now() - this._SYNC_TOMB_MAXAGE;
    for (const [id, ts] of Object.entries(tombs)) if (ts < cutoff) delete tombs[id];
    this._syncDeleted = tombs;
    return true;
  },

  _syncPayload() {
    return {
      _app: 'phonetique',
      _version: 3,
      _updatedAt: Date.now(),
      grenier:       this._grenier,
      repertoire:    this._repertoire,
      deleted:       this._syncDeleted || {},
      settings:      this.settings,
      settingsU:     this._syncSettingsU || 0,
      scores:        this.scores,
      passageScores: this.passageScores,
      aiPassages:    this.aiPassages,
      lookupHistory: this._lookupHistory,
      bilan: {
        latest:       this.bilanScores,
        best:         this.bilanBestScores,
        passageIndex: this.bilanPassageIndex,
        aiPassage:    this.bilanAiPassage,
      },
    };
  },

  // Écrit tout l'état fusionné, sans réestampiller : la fusion a déjà posé
  // les bons horodatages, et les réécrire ferait osciller les appareils.
  _syncPersist() {
    this._syncApplying = true;
    try {
      this.saveGrenier();
      this.saveRepertoire();
      this.saveScores();
      this.savePassageScores();
      this.saveLookupHistory();
      this.saveSettings();
      this.saveDiagScores();
      this.saveAiPassages();
      this._syncSaveDeleted();
    } finally {
      this._syncApplying = false;
    }
    this._syncSnapshot();
  },

  // ── réseau ────────────────────────────────────────────────────────────
  async _syncFetch(base, path, opts = {}, timeout = 2500) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      return await fetch(base.replace(/\/+$/, '') + path, { ...opts, signal: ctl.signal, cache: 'no-store' });
    } finally { clearTimeout(t); }
  },

  // Une IP qui change ne doit pas tout casser : on essaie les adresses
  // connues et on promeut celle qui répond.
  async _syncResolve() {
    const cfg = this._syncCfg;
    const tried = [];
    for (const base of [cfg.url, ...(cfg.alts || [])]) {
      if (!base || tried.includes(base)) continue;
      tried.push(base);
      // Une page https ne peut pas appeler du http : inutile d'essayer.
      if (location.protocol === 'https:' && base.startsWith('http:')) continue;
      try {
        const r = await this._syncFetch(base, '/health');
        if (!r.ok) continue;
        const h = await r.json();
        if (h && h.app && h.app !== 'phonetique') continue;   // pas le bon serveur
        if (base !== cfg.url) {
          cfg.url = base;
          this._syncMsg = 'adresse de secours retenue : ' + base;
        }
        // /health renvoie les adresses du même schéma que la requête
        if (Array.isArray(h.addresses)) {
          cfg.alts = [...new Set([...h.addresses, ...(cfg.alts || [])])].filter(u => u !== cfg.url);
        }
        this.saveSyncConfig();
        return base;
      } catch(e) { /* on essaie la suivante */ }
    }
    return null;
  },

  async _syncNow(manual = false) {
    if (this._syncState === 'busy') return;
    const cfg = this._syncCfg;
    if (!cfg || !cfg.url) {
      if (manual) this.showToast('Renseigne d\'abord l\'adresse du serveur');
      return;
    }
    this._syncState = 'busy'; this._syncMsg = '';
    this._syncRenderStatus();
    try {
      const base = await this._syncResolve();
      if (!base) throw new Error('offline');

      // 1. vider l'éditeur dans l'état avant de lire quoi que ce soit
      if (this._grenierCardRecording) { /* ne pas interrompre un enregistrement */ }

      // 2. état distant (404 = serveur neuf, ce n'est pas une erreur)
      let remote = null;
      const g = await this._syncFetch(base, '/donnees', {}, 8000);
      if (g.ok) remote = await g.json();
      else if (g.status !== 404) throw new Error('HTTP ' + g.status);

      // 3. fusion
      const avant = await this._syncSignature();
      if (remote) this._syncMerge(remote);

      // 4. renvoi de l'état fusionné
      const p = await this._syncFetch(base, '/donnees', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this._syncPayload()),
      }, 15000);
      if (!p.ok) {
        let why = 'HTTP ' + p.status;
        try { why = (await p.json()).error || why; } catch(e) {}
        throw new Error(why);
      }

      // 5. persister et rafraîchir
      this._syncPersist();
      this._syncReconcile();
      cfg.lastSync = Date.now();
      this.saveSyncConfig();
      this._syncState = 'ok';
      // Ne redessiner que si la fusion a réellement rapporté quelque chose.
      // Sinon la synchro automatique refait l'écran toutes les 45 secondes,
      // transition comprise — d'où un clignotement régulier sans raison.
      if (await this._syncSignature() !== avant) this._syncRefreshUI();
      if (manual) this.showToast('Synchronisé ✓');
    } catch (err) {
      const off = err.name === 'AbortError' || err.message === 'offline' ||
                  err.message === 'Failed to fetch' || !navigator.onLine;
      this._syncState = off ? 'offline' : 'error';
      if (!off) this._syncMsg = err.message;
      if (manual) this.showToast(off ? 'Serveur injoignable — les modifications attendent'
                                     : 'Échec de la synchro : ' + err.message);
    }
    this._syncRenderStatus();
  },

  // ── mode sauvegarde : on envoie, on ne rapatrie jamais ────────────────
  // Un seul appareil décide de la vérité. Le serveur n'est plus qu'un coffre.
  // Empreinte bon marché de l'état, pour reconnaître « rien n'a changé ».
  // On écarte _updatedAt, qui bouge à chaque appel et masquerait l'égalité.
  async _syncSignature() {
    const p = this._syncPayload();
    delete p._updatedAt;
    const json = JSON.stringify(p);
    let h = 5381;
    for (let i = 0; i < json.length; i++) h = ((h * 33) ^ json.charCodeAt(i)) >>> 0;
    let img = 0;
    try { img = (await this._idbKeys()).length; } catch(e) {}
    return `${json.length}:${h.toString(36)}:${img}`;
  },

  async _syncBackupNow(manual = false) {
    if (this._syncState === 'busy') return;
    const cfg = this._syncCfg;
    if (!cfg || !cfg.url) {
      if (manual) this.showToast('Renseigne d\'abord l\'adresse du serveur');
      return;
    }
    // Le serveur archive une copie horodatée à CHAQUE écriture et n'en garde
    // que 30. Sans ce garde-fou, la sauvegarde automatique en écrirait une
    // toutes les 45 secondes et ferait tourner tout l'historique en vingt
    // minutes — le filet de sécurité s'auto-détruirait. On n'envoie donc que
    // si quelque chose a réellement changé. Un envoi manuel passe toujours.
    const sig = await this._syncSignature();
    if (!manual && sig === this._syncLastSig) {
      this._syncState = 'ok';
      this._syncRenderStatus();
      return;
    }
    this._syncState = 'busy'; this._syncMsg = '';
    this._syncRenderStatus();
    try {
      const base = await this._syncResolve();
      if (!base) throw new Error('offline');
      const p = await this._syncFetch(base, '/donnees', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this._syncPayload()),
      }, 15000);
      if (!p.ok) {
        let why = 'HTTP ' + p.status;
        try { why = (await p.json()).error || why; } catch(e) {}
        throw new Error(why);
      }
      // Les images suivent : une carte sans son image n'est qu'à moitié
      // sauvegardée. Seules les manquantes partent, donc c'est vite fait.
      await this.syncImagesUp(false);
      this._syncLastSig = sig;
      cfg.lastSync = Date.now();
      this.saveSyncConfig();
      this._syncState = 'ok';
      if (manual) this.showToast('Sauvegarde envoyée ✓');
    } catch (err) {
      const off = err.name === 'AbortError' || err.message === 'offline' ||
                  err.message === 'Failed to fetch' || !navigator.onLine;
      this._syncState = off ? 'offline' : 'error';
      if (!off) this._syncMsg = err.message;
      if (manual) this.showToast(off ? 'Serveur injoignable — sauvegarde reportée'
                                     : 'Échec : ' + err.message);
    }
    this._syncRenderStatus();
  },

  // ── images : de la base du navigateur vers un vrai dossier du PC ──────
  // IndexedDB est liée à l'adresse d'ouverture et n'est sauvegardée nulle
  // part. Une image générée sur le téléphone n'existe donc qu'à un seul
  // endroit, et change d'adresse suffit à la rendre invisible.

  // Récupère une image depuis le serveur et la remet en base locale, pour ne
  // la retélécharger qu'une fois.
  async _syncImageFetch(key) {
    const base = this._syncCfg?.url;
    if (!base || !key) return null;
    if (this._syncImgMissing?.has(key)) return null;   // déjà cherchée en vain
    try {
      const r = await this._syncFetch(base, '/images/' + encodeURIComponent(key), {}, 8000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const blob = await r.blob();
      await this._idbPut(key, blob);
      return blob;
    } catch (e) {
      (this._syncImgMissing = this._syncImgMissing || new Set()).add(key);
      return null;
    }
  },

  // Combien d'images cet appareil détient-il, et combien manquent au serveur ?
  async _syncImageStatus() {
    let locales = [];
    try { locales = await this._idbKeys(); } catch(e) { return { locales: 0, aEnvoyer: 0, dossier: '' }; }
    const base = this._syncCfg?.url;
    if (!base) return { locales: locales.length, aEnvoyer: locales.length, dossier: '' };
    try {
      const r = await this._syncFetch(base, '/images', {}, 5000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const surServeur = new Set(j.cles || []);
      return {
        locales: locales.length,
        aEnvoyer: locales.filter(k => !surServeur.has(k)).length,
        dossier: j.dossier || '',
      };
    } catch (e) {
      return { locales: locales.length, aEnvoyer: locales.length, dossier: '' };
    }
  },

  // ── pont hors réseau pour les images ──────────────────────────────────
  // Les images d'une origine ne sont lisibles que depuis cette origine. Quand
  // l'appli a changé d'adresse — ou qu'elle vivait sur GitHub Pages — il faut
  // pouvoir les faire voyager par un fichier, sans dépendre du réseau local.
  // Un seul fichier plutôt que N téléchargements : sur téléphone, chaque
  // téléchargement demande une confirmation.
  async syncImagesExportFile() {
    let keys = [];
    try { keys = await this._idbKeys(); } catch(e) {}
    if (!keys.length) { this.showToast('Aucune image sur cet appareil'); return; }
    this.showToast(`Préparation de ${keys.length} image(s)…`);
    const images = {};
    for (const k of keys) {
      const blob = await this._idbGet(k);
      if (!blob) continue;
      images[k] = await new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(r.result);          // data:image/png;base64,…
        r.onerror = () => res(null);
        r.readAsDataURL(blob);
      });
    }
    const bundle = { _app: 'phonetique', _type: 'images',
                     _exportedAt: new Date().toISOString(), images };
    const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'phonetique_images_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    this.showToast(`${Object.keys(images).length} image(s) exportée(s) ✓`);
  },

  syncImagesImportFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async ev => {
        let data;
        try { data = JSON.parse(ev.target.result); }
        catch { this.showToast('Fichier illisible'); return; }
        if (data._type !== 'images' || !data.images) {
          this.showToast('Ce fichier ne contient pas d\'images Phonétique'); return;
        }
        let n = 0;
        for (const [k, dataUrl] of Object.entries(data.images)) {
          if (!dataUrl) continue;
          try {
            const blob = await (await fetch(dataUrl)).blob();
            await this._idbPut(k, blob);
            this._syncImgMissing?.delete(k);      // on peut la réessayer
            n++;
          } catch(err) { /* image abîmée : on continue */ }
        }
        this.showToast(`${n} image(s) importée(s) ✓`);
        this._syncRenderPanel();
      };
      reader.readAsText(file);
    };
    input.click();
  },

  async syncImagesUp(manual = false) {
    const base = this._syncCfg?.url;
    if (!base) { if (manual) this.showToast('Renseigne d\'abord l\'adresse du serveur'); return; }
    let locales = [];
    try { locales = await this._idbKeys(); } catch(e) {}
    if (!locales.length) { if (manual) this.showToast('Aucune image sur cet appareil'); return; }
    let surServeur = new Set();
    try {
      const r = await this._syncFetch(base, '/images', {}, 5000);
      if (r.ok) surServeur = new Set((await r.json()).cles || []);
    } catch (e) {
      if (manual) this.showToast('Serveur injoignable');
      return;
    }
    const aFaire = locales.filter(k => !surServeur.has(k));
    if (!aFaire.length) { if (manual) this.showToast('Toutes les images sont déjà sauvegardées ✓'); return; }

    let envoyees = 0, echecs = 0;
    for (const key of aFaire) {
      try {
        const blob = await this._idbGet(key);
        if (!blob) continue;
        const r = await this._syncFetch(base, '/images/' + encodeURIComponent(key), {
          method: 'PUT',
          headers: { 'Content-Type': blob.type || 'image/png' },
          body: blob,
        }, 30000);
        if (r.ok) envoyees++; else echecs++;
      } catch (e) { echecs++; }
      if (manual && (envoyees + echecs) % 5 === 0) {
        this._syncMsg = `images : ${envoyees + echecs}/${aFaire.length}`;
        this._syncRenderStatus();
      }
    }
    this._syncMsg = '';
    if (manual) {
      this.showToast(echecs ? `${envoyees} image(s) envoyée(s), ${echecs} échec(s)`
                            : `${envoyees} image(s) sauvegardée(s) ✓`);
      this._syncRenderPanel();
    }
    return { envoyees, echecs };
  },

  // Remplace TOUT l'état local. Rien à voir avec la fusion : c'est un retour
  // en arrière, et il écrase. D'où la copie de sécurité prise avant.
  _syncReplaceAll(data) {
    this._syncApplying = true;
    try {
      if (data.grenier) this._grenier = {
        decks: data.grenier.decks || [], cards: data.grenier.cards || [] };
      if (data.repertoire) this._repertoire = {
        folders: data.repertoire.folders || [], words: data.repertoire.words || [] };
      this._syncDeleted = data.deleted || {};
      if (data.settings) Object.assign(this.settings, data.settings);
      if (data.scores) this.scores = data.scores;
      if (data.passageScores) this.passageScores = data.passageScores;
      if (data.aiPassages) this.aiPassages = data.aiPassages;
      if (Array.isArray(data.lookupHistory)) this._lookupHistory = data.lookupHistory;
      if (data.bilan) {
        this.bilanScores = data.bilan.latest || {};
        this.bilanBestScores = data.bilan.best || {};
        if (data.bilan.passageIndex != null) this.bilanPassageIndex = data.bilan.passageIndex;
        this.bilanAiPassage = data.bilan.aiPassage || null;
      }
      this.saveGrenier(); this.saveRepertoire(); this.saveScores();
      this.savePassageScores(); this.saveAiPassages(); this.saveLookupHistory();
      this.saveSettings(); this.saveDiagScores(); this._syncSaveDeleted();
    } finally {
      this._syncApplying = false;
    }
    this._syncSnapshot();
    this._syncRefreshUI();
  },

  _syncConfirmRestore() {
    if (!confirm('Remplacer TOUTES les données de cet appareil par la sauvegarde ?\n\n'
      + 'Ce n\'est pas une fusion : ce qui est ici sera écrasé.\n'
      + 'Une copie de l\'état actuel va être téléchargée d\'abord, par sécurité.')) return false;
    this.exportAllData();   // filet : on ne remplace jamais sans garder l'ancien
    return true;
  },

  async syncRestoreFromServer() {
    if (!this._syncCfg?.url) { this.showToast('Renseigne d\'abord l\'adresse du serveur'); return; }
    if (!this._syncConfirmRestore()) return;
    try {
      const base = await this._syncResolve();
      if (!base) throw new Error('serveur injoignable');
      const r = await this._syncFetch(base, '/donnees', {}, 8000);
      if (r.status === 404) { this.showToast('Le serveur n\'a encore aucune sauvegarde'); return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      this._syncReplaceAll(await r.json());
      this.showToast('Restauré depuis le serveur ✓');
    } catch (err) {
      this.showToast('Échec de la restauration : ' + err.message);
    }
  },

  // Les copies horodatées du serveur vivent dans phonetique-copies/ :
  // c'est par là qu'on revient à un état antérieur précis.
  syncRestoreFromFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        let data;
        try { data = JSON.parse(ev.target.result); }
        catch { this.showToast('Fichier illisible'); return; }
        if (data._app && data._app !== 'phonetique') { this.showToast('Ce fichier vient d\'une autre appli'); return; }
        if (!data.grenier && !data.repertoire) { this.showToast('Ce fichier ne contient pas de données Phonétique'); return; }
        if (!this._syncConfirmRestore()) return;
        this._syncReplaceAll(data);
        this.showToast('Restauré depuis le fichier ✓');
      };
      reader.readAsText(file);
    };
    input.click();
  },

  // Un serveur injoignable est un état d'attente, pas une panne.
  _syncPendingCount() {
    const since = Number(this._syncCfg?.lastSync || 0);
    if (!since) return 0;
    let n = 0;
    const scan = (kind, list) => {
      const groups = this._SYNC_GROUPS[kind];
      for (const r of (list || [])) {
        for (const s in groups) if (Number(r[s] || 0) > since) { n++; break; }
      }
    };
    scan('deck', this._grenier?.decks);   scan('card', this._grenier?.cards);
    scan('folder', this._repertoire?.folders); scan('word', this._repertoire?.words);
    for (const ts of Object.values(this._syncDeleted || {})) if (ts > since) n++;
    return n;
  },

  _syncStatusText() {
    const cfg = this._syncCfg || {};
    if (this._syncState === 'busy') return 'synchro en cours…';
    if (this._syncState === 'error') return 'erreur · ' + (this._syncMsg || 'inconnue');
    const n = this._syncPendingCount();
    if (this._syncState === 'offline') {
      return n ? `hors réseau · ${n} modification${n > 1 ? 's' : ''} en attente` : 'hors réseau';
    }
    if (!cfg.lastSync) return 'jamais synchronisé';
    const t = new Date(cfg.lastSync).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
    return n ? `${n} modification${n > 1 ? 's' : ''} en attente · ${t}` : `à jour · ${t}`;
  },

  _syncRenderStatus() {
    const el = document.getElementById('syncStatus');
    if (el) el.textContent = this._syncStatusText();
    const dot = document.getElementById('syncDot');
    if (dot) {
      const c = { ok:'#22C55E', busy:'#F59E0B', offline:'#5A6080', error:'#EF4444', idle:'#5A6080' };
      dot.style.background = c[this._syncState] || c.idle;
    }
  },

  _syncRefreshUI() {
    // Ne jamais arracher l'écran sous les doigts pendant une révision.
    if (this._grenierStudySession) return;
    const cur = this.navHistory[this.navHistory.length - 1];
    if (!cur) return;
    try { this.navigate(cur.screen, cur.params, true); } catch(e) {}
  },

  // ── déclencheurs automatiques ─────────────────────────────────────────
  _syncStartAuto() {
    if (this._syncAutoWired) return;
    this._syncAutoWired = true;
    const kick = () => {
      const cfg = this._syncCfg;
      if (!cfg?.auto) return;
      if (document.visibilityState === 'hidden') return;
      if (cfg.mode === 'lan') this._syncNow(false);
      else if (cfg.mode === 'backup') this._syncBackupNow(false);
    };
    window.addEventListener('online', kick);
    window.addEventListener('focus', kick);
    document.addEventListener('visibilitychange', kick);
    setInterval(kick, 45000);
    setTimeout(kick, 1500);
  },

  // ── mode « fichier partagé » ──────────────────────────────────────────
  // Même moteur de fusion, mais sur un fichier que tu choisis (clé USB,
  // dossier partagé, Drive…). Contrairement à l'import, ceci FUSIONNE au
  // lieu d'écraser.
  syncFromFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        let data;
        try { data = JSON.parse(ev.target.result); }
        catch { this.showToast('Fichier illisible'); return; }
        if (data._app && data._app !== 'phonetique') { this.showToast('Ce fichier vient d\'une autre appli'); return; }
        this._syncMerge(data);
        this._syncPersist();
        this._syncReconcile();
        this._syncCfg.lastSync = Date.now();
        this.saveSyncConfig();
        this._syncState = 'ok';
        this._syncRefreshUI();
        this.showToast('Fusionné ✓ — réexporte pour partager le résultat');
      };
      reader.readAsText(file);
    };
    input.click();
  },

  // ── installation en vraie application ─────────────────────────────────
  // Le menu du navigateur affiche « Installer l'application » même quand il ne
  // fabriquera qu'un raccourci — d'où un résultat trompeur. En passant par
  // l'invite officielle, on obtient la vraie installation, seule à donner le
  // plein écran sans barre d'adresse.
  _installPrompt: null,

  _installWire() {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();          // on choisit NOUS le moment de proposer
      this._installPrompt = e;
      this._syncRenderPanel();
    });
    window.addEventListener('appinstalled', () => {
      this._installPrompt = null;
      this.showToast('Application installée ✓');
      this._syncRenderPanel();
    });
  },

  _isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: minimal-ui)').matches
        || window.navigator.standalone === true;
  },

  async installApp() {
    if (!this._installPrompt) return;
    this._installPrompt.prompt();
    try {
      const { outcome } = await this._installPrompt.userChoice;
      if (outcome === 'accepted') this._installPrompt = null;
    } catch(e) {}
    this._syncRenderPanel();
  },

  // ── panneau des Paramètres ────────────────────────────────────────────
  _syncPanelHTML() {
    const cfg = this._syncCfg || {};
    const mode = cfg.mode || 'lan';
    const lan = mode === 'lan';
    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    const alts = (cfg.alts || []).filter(Boolean);
    const servedFromServer = /^https?:$/.test(location.protocol) && !!location.host;
    // Pas de contexte sécurisé → pas de service worker → l'appli servie ne
    // s'ouvrira pas hors du réseau. C'est le cas de http://192.168.x.x.
    const fragile = servedFromServer && !window.isSecureContext;

    // Mode sauvegarde : on envoie, on ne rapatrie jamais. Aucune fusion, donc
    // aucun risque qu'un autre appareil vienne remuer les dossiers.
    const blocSauvegarde = `
      <div class="sync-url-row">
        <input class="sync-url-input" id="syncUrl" value="${esc(cfg.url)}"
               placeholder="https://smac:8791" spellcheck="false"
               onchange="App.setSyncUrl(this.value)">
        <button class="sync-test-btn" onclick="App.testSync()">tester</button>
      </div>
      <div class="sync-alts">
        Cet appareil <strong>envoie</strong> ses données au serveur, sans jamais
        rien reprendre. Rien ne peut donc être modifié dans ton dos. Le serveur
        garde les 30 dernières versions.
      </div>
      <label class="sync-auto">
        <input type="checkbox" ${cfg.auto ? 'checked' : ''} onchange="App.setSyncAuto(this.checked)">
        sauvegarde automatique
      </label>
      <button class="sync-now-btn" onclick="App._syncBackupNow(true)">envoyer une sauvegarde</button>
      <div class="sync-alts" id="syncImgInfo">images : vérification…</div>
      <button class="sync-now-btn" onclick="App.syncImagesUp(true)">envoyer les images</button>
      <button class="sync-now-btn" style="border-color:var(--text3);color:var(--text2);background:transparent"
              onclick="App.syncRestoreFromServer()">restaurer depuis le serveur…</button>
      <button class="sync-now-btn" style="border-color:var(--text3);color:var(--text2);background:transparent"
              onclick="App.syncRestoreFromFile()">restaurer depuis un fichier…</button>
    `;

    const bloc = mode === 'backup' ? blocSauvegarde : lan ? `
      <div class="sync-url-row">
        <input class="sync-url-input" id="syncUrl" value="${esc(cfg.url)}"
               placeholder="http://192.168.1.20:8790" spellcheck="false"
               onchange="App.setSyncUrl(this.value)">
        <button class="sync-test-btn" onclick="App.testSync()">tester</button>
      </div>
      <div class="sync-alts">
        ${alts.length ? 'adresses de secours connues : ' + alts.map(esc).join(' · ') : 'aucune adresse de secours connue pour l\'instant'}
        ${servedFromServer ? ' · cette page : ' + esc(location.origin) : ''}
      </div>
      <label class="sync-auto">
        <input type="checkbox" ${cfg.auto ? 'checked' : ''} onchange="App.setSyncAuto(this.checked)">
        synchro automatique
      </label>
      <button class="sync-now-btn" onclick="App._syncNow(true)">synchroniser maintenant</button>
    ` : `
      <div class="sync-alts">
        Fusionne un fichier de sauvegarde depuis une clé USB, un dossier partagé ou
        un nuage. Contrairement à l'import, ceci <strong>fusionne</strong> au lieu
        d'écraser : rien n'est perdu des deux côtés.
      </div>
      <button class="sync-now-btn" onclick="App.syncFromFile()">fusionner un fichier…</button>
      <button class="sync-now-btn" onclick="App.exportAllData()">exporter l'état fusionné</button>
    `;

    const avert = fragile ? `
      <div class="sync-warn">
        <div class="sync-warn-title">Appli chargée depuis le serveur</div>
        <div class="sync-warn-text">
          elle ne s'ouvrira pas hors de chez toi. Garde une copie sur l'appareil
          et ouvre celle-là :
        </div>
        <a href="${esc(location.origin)}/?download=1" download="phonetique.html">télécharger phonetique.html</a>
      </div>` : '';

    // Une barre d'adresse visible = raccourci, pas application installée.
    const install = this._isStandalone()
      ? `<div class="sync-alts" style="color:var(--text2)">✓ ouverte en application — pas de barre d'adresse</div>`
      : (this._installPrompt
          ? `<button class="sync-now-btn" onclick="App.installApp()">installer en vraie application</button>
             <div class="sync-alts">supprime d'abord l'ancien raccourci de l'écran d'accueil</div>`
          : (servedFromServer && window.isSecureContext
              ? `<div class="sync-alts">Déjà installée, ou le navigateur ne propose pas l'installation ici. Sur Android, <code>chrome://webapks</code> liste les vraies applications installées.</div>`
              : ''));

    return `<div class="sync-body">
      ${install}
      <div class="sync-modes">
        <button class="sync-mode-btn ${mode === 'backup' ? 'active' : ''}" onclick="App.setSyncMode('backup')">sauvegarde</button>
        <button class="sync-mode-btn ${lan ? 'active' : ''}" onclick="App.setSyncMode('lan')">réseau local</button>
        <button class="sync-mode-btn ${mode === 'file' ? 'active' : ''}" onclick="App.setSyncMode('file')">fichier partagé</button>
      </div>
      ${bloc}
      <div style="border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px">
        <div class="sync-alts">
          Les images sont liées à l'adresse d'où l'appli est ouverte. Pour les
          emmener d'une adresse à une autre, passe par un fichier :
        </div>
        <button class="sync-now-btn" style="border-color:var(--text3);color:var(--text2);background:transparent"
                onclick="App.syncImagesExportFile()">exporter les images vers un fichier</button>
        <button class="sync-now-btn" style="border-color:var(--text3);color:var(--text2);background:transparent"
                onclick="App.syncImagesImportFile()">importer des images depuis un fichier…</button>
      </div>
      <div class="sync-status" id="syncStatus">${this._syncStatusText()}</div>
      ${avert}
    </div>`;
  },

  _syncRenderPanel() {
    const body = document.querySelector('#sg-synchro .settings-group-body');
    if (body) body.innerHTML = this._syncPanelHTML();
    this._syncRenderStatus();
    this._syncRenderImageInfo();
  },

  // Asynchrone : le panneau se rend tout de suite, l'état des images arrive
  // ensuite plutôt que de faire attendre l'écran.
  async _syncRenderImageInfo() {
    const el = document.getElementById('syncImgInfo');
    if (!el) return;
    const s = await this._syncImageStatus();
    if (!document.getElementById('syncImgInfo')) return;   // panneau déjà remplacé
    if (!s.locales) { el.textContent = 'aucune image sur cet appareil'; return; }
    const où = s.dossier ? ` — sur le PC : ${s.dossier}` : '';
    el.textContent = s.aEnvoyer
      ? `${s.locales} image(s) ici, ${s.aEnvoyer} à envoyer${où}`
      : `${s.locales} image(s), toutes sauvegardées ✓${où}`;
  },

  setSyncMode(mode) {
    this._syncCfg.mode = mode;
    this.saveSyncConfig();
    this._syncRenderPanel();
  },
  setSyncUrl(url) {
    url = String(url || '').trim().replace(/\/+$/, '');
    // Une adresse sans schéma ne part jamais : on complète plutôt que d'échouer.
    if (url && !/^https?:\/\//i.test(url)) url = 'http://' + url;
    this._syncCfg.url = url;
    this._syncCfg.alts = [];          // repartir de zéro : nouvelle cible
    this.saveSyncConfig();
    this._syncRenderPanel();
  },
  setSyncAuto(on) {
    this._syncCfg.auto = !!on;
    this.saveSyncConfig();
    if (!on) return;
    if (this._syncCfg.mode === 'backup') this._syncBackupNow(false);
    else if (this._syncCfg.mode === 'lan') this._syncNow(false);
  },
  async testSync() {
    if (!this._syncCfg.url) { this.showToast('Renseigne d\'abord une adresse'); return; }
    this._syncState = 'busy'; this._syncRenderStatus();
    const base = await this._syncResolve();
    if (base) {
      this._syncState = 'ok';
      this.showToast('Serveur joignable : ' + base);
    } else {
      this._syncState = 'offline';
      this.showToast('Aucune adresse ne répond');
    }
    this._syncRenderPanel();
  },

  _wfRecordLookup(word, ipa) {
    // Remove existing entry for this word then prepend fresh
    this._lookupHistory = this._lookupHistory.filter(h => h.word.toLowerCase() !== word.toLowerCase());
    this._lookupHistory.unshift({ word, ipa: ipa || '', lookedUpAt: Date.now() });
    if (this._lookupHistory.length > 30) this._lookupHistory = this._lookupHistory.slice(0, 30);
    this.saveLookupHistory();
  },

  _lookupRemove(word) {
    this._lookupHistory = this._lookupHistory.filter(h => h.word.toLowerCase() !== word.toLowerCase());
    this.saveLookupHistory();
    this.renderRepertoire();
  },

  // ── RECENT CARD INTERACTIONS ─────────────────────────────────
  _recentSelectedWords: [],

  _recentTap(card) {
    const word = card.dataset.recentWord;
    if (!word) return;
    // If in selection mode, toggle selection
    if (this._recentSelectedWords.length > 0) {
      this._recentToggleSelect(card, word);
      return;
    }
    // Otherwise navigate to Mot en Focus
    this._wfFromBilan = false;
    this.navigate('word-focus', { word });
  },

  _recentToggleSelect(card, word) {
    const idx = this._recentSelectedWords.indexOf(word);
    if (idx >= 0) {
      this._recentSelectedWords.splice(idx, 1);
      card.classList.remove('rep-recent-selected');
    } else {
      this._recentSelectedWords.push(word);
      card.classList.add('rep-recent-selected');
    }
    this._recentUpdateBar();
  },

  _recentUpdateBar() {
    const bar = document.getElementById('recentActionBar');
    const label = document.getElementById('recentActionLabel');
    const saveBtn = document.getElementById('recentSaveBtn');
    const n = this._recentSelectedWords.length;
    if (!bar) return;
    if (n === 0) {
      bar.style.display = 'none';
    } else {
      bar.style.display = 'flex';
      if (label) label.textContent = n === 1 ? `"${this._recentSelectedWords[0]}"` : `${n} mots sélectionnés`;
      // Grey out save btn if all already in repertoire
      if (saveBtn) {
        const allSaved = this._recentSelectedWords.every(w => this.repIsWordSaved(w));
        saveBtn.style.opacity = allSaved ? '0.4' : '';
        saveBtn.disabled = allSaved;
      }
    }
  },

  _recentClearSelection() {
    this._recentSelectedWords = [];
    document.querySelectorAll('.rep-recent-card.rep-recent-selected').forEach(c => c.classList.remove('rep-recent-selected'));
    this._recentUpdateBar();
  },

  _recentSaveSelected() {
    const toSave = this._recentSelectedWords.filter(w => !this.repIsWordSaved(w));
    if (!toSave.length) return;
    // If multiple words, show folder picker for batch-add
    const entries = toSave.map(w => {
      const h = this._lookupHistory.find(h => h.word === w);
      return { word: w, ipa: h?.ipa || '' };
    });
    this._recentShowBatchSaveOverlay(entries);
  },

  _recentShowBatchSaveOverlay(entries) {
    const folders = this._repertoire.folders;
    const label = entries.length === 1 ? `"${entries[0].word}"` : `${entries.length} mots`;
    const overlay = document.createElement('div');
    overlay.className = 'rep-overlay';
    overlay.id = 'repOverlay';
    overlay.innerHTML = `
      <div class="rep-overlay-panel">
        <div class="rep-overlay-title">Ajouter au Répertoire</div>
        <div class="rep-overlay-subtitle" style="margin-bottom:8px">Ajouter ${label} dans :</div>
        ${folders.map(f => `
          <button class="rep-overlay-folder-btn" onclick="App._recentBatchSave(${JSON.stringify(entries).replace(/"/g,'&quot;')},'${f.id}')">
            <span>${f.emoji}</span> ${f.name}
          </button>`).join('')}
        <button class="rep-overlay-cancel" onclick="App._repCloseOverlay()">Annuler</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) App._repCloseOverlay(); });
  },

  _recentBatchSave(entries, folderId) {
    entries.forEach(e => { if (!this.repIsWordSaved(e.word)) this.repAddWord(e.word, e.ipa, folderId); });
    this._repCloseOverlay();
    this._recentClearSelection();
    const folderName = this._repertoire.folders.find(f => f.id === folderId)?.name || '';
    this.showToast(`${entries.length} mot(s) ajouté(s)${folderName ? ' dans ' + folderName : ''} ✓`);
    this.renderRepertoire();
  },

  _recentRemoveSelected() {
    this._recentSelectedWords.forEach(w => {
      this._lookupHistory = this._lookupHistory.filter(h => h.word.toLowerCase() !== w.toLowerCase());
    });
    this.saveLookupHistory();
    this._recentSelectedWords = [];
    this.renderRepertoire();
  },

  repIsWordSaved(word) {
    return this._repertoire.words.some(w => w.word.toLowerCase() === word.toLowerCase());
  },

  repAddWord(word, ipa, folderId = 'default', source = 'mot-en-focus') {
    // Remove existing entry if present (re-add fresh)
    // Le remplaçant reçoit un nouvel id : sans pierre tombale, l'ancien
    // reviendrait du serveur et le mot apparaîtrait en double.
    this._syncTombstone(this._repertoire.words
      .filter(w => w.word.toLowerCase() === word.toLowerCase()).map(w => w.id));
    this._repertoire.words = this._repertoire.words.filter(w => w.word.toLowerCase() !== word.toLowerCase());
    this._repertoire.words.unshift({
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      word, ipa: ipa || '',
      folderId,
      addedAt: Date.now(),
      source
    });
    this.saveRepertoire();
    // Sync: also add to linked Grenier deck if one matches this folder name (but not if already coming from Grenier)
    if (source !== 'grenier') this._repSyncWordToGrenier(word, ipa, folderId);
  },

  // Sync a word to the Grenier deck that shares the name of this repertoire folder
  _repSyncWordToGrenier(word, ipa, folderId) {
    if (!this._grenier) return;
    const folder = this._repertoire.folders.find(f => f.id === folderId);
    if (!folder) return;
    const deck = this._grenier.decks.find(d => d.name === folder.name);
    if (!deck) return;
    const alreadyIn = this._grenier.cards.some(c => c.deckId === deck.id && c.word?.toLowerCase() === word.toLowerCase() && !c.deleted);
    if (alreadyIn) return;
    this._grenier.cards.push({
      id: this._gid(), deckId: deck.id, word, ipa: ipa || '',
      interval: 1, ease: 2.5, reps: 0, nextDue: Date.now(),
      showListen: true, showRecord: true, showRhymes: true,
      color: null, definition: '', createdAt: Date.now()
    });
    this.saveGrenier();
  },

  // Sync: create a Grenier deck when a new Répertoire folder is created
  _repSyncFolderToGrenier(folderName, folderColor) {
    if (!this._grenier) return;
    const already = this._grenier.decks.find(d => d.name === folderName);
    if (already) return;
    const deckColor = folderColor || this.GRENIER_COLORS[Math.floor(Math.random() * this.GRENIER_COLORS.length)];
    this._grenier.decks.push({ id: this._gid(), name: folderName, color: deckColor, createdAt: Date.now() });
    this.saveGrenier();
  },

  repRemoveWord(wordId, skipNavigate = false) {
    const repWord = this._repertoire.words.find(w => w.id === wordId);
    this._syncTombstone(wordId);
    this._repertoire.words = this._repertoire.words.filter(w => w.id !== wordId);
    this.saveRepertoire();
    // Mirror deletion to Grenier: soft-delete the matching card
    if (repWord && this._grenier) {
      const folder = this._repertoire.folders.find(f => f.id === repWord.folderId);
      const deck = folder ? this._grenier.decks.find(d => d.name === folder.name) : null;
      const grCard = this._grenier.cards.find(c =>
        c.word?.toLowerCase() === repWord.word.toLowerCase() &&
        (!deck || c.deckId === deck.id) &&
        !c.deleted
      );
      if (grCard) { grCard.deleted = true; this.saveGrenier(); }
    }
    if (!skipNavigate) this.renderRepertoire();
  },

  _repDeleteSelected() {
    const n = this._repSelectedIds.length;
    if (!n) return;
    const msg = n === 1
      ? `Supprimer ce mot du Répertoire ?`
      : `Supprimer ces ${n} mots du Répertoire ?`;
    if (!confirm(msg)) return;
    this._repSelectedIds.forEach(id => {
      const repWord = this._repertoire.words.find(w => w.id === id);
      this._syncTombstone(id);
      this._repertoire.words = this._repertoire.words.filter(w => w.id !== id);
      // Mirror deletion to Grenier
      if (repWord && this._grenier) {
        const folder = this._repertoire.folders.find(f => f.id === repWord.folderId);
        const deck = folder ? this._grenier.decks.find(d => d.name === folder.name) : null;
        const grCard = this._grenier.cards.find(c =>
          c.word?.toLowerCase() === repWord.word.toLowerCase() &&
          (!deck || c.deckId === deck.id) &&
          !c.deleted
        );
        if (grCard) { grCard.deleted = true; }
      }
    });
    this._repSelectedIds = [];
    this.saveRepertoire();
    if (this._grenier) this.saveGrenier();
    this.renderRepertoire();
  },

  repMoveWord(wordId, newFolderId) {
    const w = this._repertoire.words.find(w => w.id === wordId);
    if (w) { w.folderId = newFolderId; this.saveRepertoire(); }
    this.renderRepertoire();
  },

  repCreateFolder(name, emoji) {
    const id = 'folder_' + Date.now();
    this._repertoire.folders.push({ id, name, emoji: emoji || '📁', createdAt: Date.now() });
    this.saveRepertoire();
    // Also create a matching Grenier deck
    this._repSyncFolderToGrenier(name);
    return id;
  },

  repDeleteFolder(folderId) {
    // Capture folder name BEFORE removing it
    const folder = this._repertoire.folders.find(f => f.id === folderId);
    const folderName = folder?.name;
    // Move words to first other folder, or leave them unassigned temporarily
    const others = this._repertoire.folders.filter(f => f.id !== folderId);
    const fallback = others[0];
    this._repertoire.words.forEach(w => {
      if (w.folderId === folderId) w.folderId = fallback ? fallback.id : null;
    });
    this._syncTombstoneNamed(folderName, folderId);
    this._repertoire.folders = this._repertoire.folders.filter(f => f.id !== folderId);
    this.saveRepertoire();
    // Mirror: delete matching Grenier deck and its cards
    if (folderName && this._grenier) {
      const deck = this._grenier.decks.find(d => d.name === folderName);
      if (deck) {
        this._syncTombstone(deck.id,
          this._grenier.cards.filter(c => c.deckId === deck.id).map(c => c.id));
        this._grenier.decks = this._grenier.decks.filter(d => d.id !== deck.id);
        this._grenier.cards = this._grenier.cards.filter(c => c.deckId !== deck.id);
        this.saveGrenier();
      }
    }
    this.renderRepertoire();
  },

  exportAllData() {
    const bundle = {
      _app: 'phonetique',
      _version: 3,
      _exportedAt: new Date().toISOString(),
      // Sans les pierres tombales, fusionner un export ferait revenir tout ce
      // que tu as supprimé depuis. Les horodatages par enregistrement, eux,
      // voyagent déjà dans grenier/repertoire.
      deleted:         this._syncDeleted || {},
      settingsU:       this._syncSettingsU || 0,
      repertoire:      this._repertoire,
      grenier:         this._grenier,
      settings:        this.settings,
      scores:          this.scores,
      lookupHistory:   this._lookupHistory,
      bilan: {
        latest:        this.bilanScores,
        best:          this.bilanBestScores,
        passageIndex:  this.bilanPassageIndex,
        aiPassage:     this.bilanAiPassage,
      },
      passageScores:   this.passageScores,
      aiPassages:      this.aiPassages,
    };
    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'phonetique_sauvegarde_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    this.showToast('Sauvegarde complète exportée ✓');
  },

  importAllData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);

          // ── Full bundle (v2) ──────────────────────────────────
          if (data._version === 2 || data.grenier || data.settings) {
            if (!confirm('Importer cette sauvegarde ? Les données existantes seront fusionnées (rien ne sera supprimé).')) return;

            // Répertoire — merge folders + words
            if (data.repertoire?.folders) {
              const existingIds = new Set(this._repertoire.folders.map(f => f.id));
              data.repertoire.folders
                .filter(f => f.id !== 'default' && !existingIds.has(f.id))
                .forEach(f => this._repertoire.folders.push(f));
            }
            if (data.repertoire?.words) {
              const existingWords = new Set(this._repertoire.words.map(w => w.word.toLowerCase()));
              data.repertoire.words
                .filter(w => w.word && !existingWords.has(w.word.toLowerCase()))
                .forEach(w => { this._repertoire.words.push(w); existingWords.add(w.word.toLowerCase()); });
            }
            this.saveRepertoire();

            // Grenier — merge decks + cards
            if (data.grenier?.decks) {
              const existingDeckIds = new Set(this._grenier.decks.map(d => d.id));
              data.grenier.decks
                .filter(d => !existingDeckIds.has(d.id))
                .forEach(d => this._grenier.decks.push(d));
            }
            if (data.grenier?.cards) {
              const existingCardIds = new Set(this._grenier.cards.map(c => c.id));
              data.grenier.cards
                .filter(c => !existingCardIds.has(c.id))
                .forEach(c => this._grenier.cards.push(c));
              // For cards that already exist, merge definition + rhymes if missing
              data.grenier.cards
                .filter(c => existingCardIds.has(c.id))
                .forEach(imported => {
                  const existing = this._grenier.cards.find(c => c.id === imported.id);
                  if (!existing) return;
                  if (!existing.definition && imported.definition) existing.definition = imported.definition;
                  if (!existing._rhymes && imported._rhymes) existing._rhymes = imported._rhymes;
                });
            }
            this.saveGrenier();

            // Settings — merge, keeping existing API keys if not in import
            if (data.settings) {
              this.settings = { ...data.settings, ...Object.fromEntries(
                Object.entries(this.settings).filter(([k, v]) =>
                  // Keep existing API keys / sensitive fields if the imported ones are empty
                  ['openrouterKey','azureKey','azureRegion'].includes(k) && v && !data.settings[k]
                )
              )};
              this.saveSettings();
              this.applyTheme();
            }

            // Scores — keep the higher score for each phoneme key
            if (data.scores) {
              for (const [k, v] of Object.entries(data.scores)) {
                if (this.scores[k] === undefined || v > this.scores[k]) this.scores[k] = v;
              }
              this.saveScores();
            }

            // Lookup history — merge, deduplicate, keep newest
            if (data.lookupHistory) {
              const existing = new Map(this._lookupHistory.map(h => [h.word.toLowerCase(), h]));
              data.lookupHistory.forEach(h => {
                const key = h.word?.toLowerCase();
                if (!key) return;
                if (!existing.has(key) || h.lookedUpAt > existing.get(key).lookedUpAt) existing.set(key, h);
              });
              this._lookupHistory = [...existing.values()].sort((a, b) => b.lookedUpAt - a.lookedUpAt).slice(0, 30);
              this.saveLookupHistory();
            }

            // Bilan scores
            if (data.bilan) {
              if (data.bilan.latest) Object.assign(this.bilanScores, data.bilan.latest);
              if (data.bilan.best) {
                for (const [k, v] of Object.entries(data.bilan.best)) {
                  if (this.bilanBestScores[k] === undefined || v > this.bilanBestScores[k]) this.bilanBestScores[k] = v;
                }
              }
              if (data.bilan.aiPassage && !this.bilanAiPassage) this.bilanAiPassage = data.bilan.aiPassage;
              this.saveDiagScores();
            }

            // Passage scores — keep higher
            if (data.passageScores) {
              for (const [k, v] of Object.entries(data.passageScores)) {
                if (this.passageScores[k] === undefined || v > this.passageScores[k]) this.passageScores[k] = v;
              }
              this.savePassageScores();
            }

            // AI passages — merge new ones
            if (data.aiPassages) {
              for (const [k, v] of Object.entries(data.aiPassages)) {
                if (!this.aiPassages[k]) this.aiPassages[k] = v;
              }
              this.saveAiPassages();
            }

            this._syncReconcile();
            this.showToast('Sauvegarde importée ✓');
            setTimeout(() => this.renderSettings(), 300);
            return;
          }

          // ── Legacy v1: Répertoire-only export ────────────────
          if (data.folders && data.words) {
            const existingFolderIds = new Set(this._repertoire.folders.map(f => f.id));
            data.folders.filter(f => f.id !== 'default' && !existingFolderIds.has(f.id))
              .forEach(f => this._repertoire.folders.push(f));
            const existingWordSet = new Set(this._repertoire.words.map(w => w.word.toLowerCase()));
            const firstFolderId = this._repertoire.folders[0]?.id;
            data.words
              .filter(w => !existingWordSet.has(w.word?.toLowerCase()))
              .map(w => ({ ...w, folderId: (w.folderId === 'default' || !w.folderId) ? (firstFolderId || w.folderId) : w.folderId }))
              .forEach(w => this._repertoire.words.unshift(w));
            this.saveRepertoire();
            this.syncRepertoireToGrenier(false);
            this.showToast('Répertoire importé ✓ (ancien format)');
            setTimeout(() => this.renderSettings(), 300);
            return;
          }

          this.showToast('Format de fichier non reconnu.');
        } catch(e) { console.error(e); this.showToast('Erreur lors de l\'importation.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  },

  repImport() { this.importAllData(); },

          <span style="font-size:11px;color:var(--text3)">${totalWords} mot${totalWords !== 1 ? 's' : ''}</span>
        </div>
        <div class="screen-title" style="color:#14B8A6;flex:0">Le Répertoire</div>
      </div>
      <div class="repertoire-container">

        <div>
          <div class="rep-section-title">Récents — Mot en Focus</div>
          <div id="recentActionBar" class="rep-recent-action-bar" style="display:none">

              Nouveau dossier…
            </button>
          </div>

    // Keep selection state valid after re-render (remove ids no longer in DOM)
    this._repSelectedIds = this._repSelectedIds.filter(id =>
      !!document.querySelector(`.rep-word-row[data-word-id="${id}"]`)
    );
  },

  _repFormatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);
    if (diff < 60) return 'à l\'instant';
    if (diff < 3600) return `il y a ${Math.floor(diff/60)} min`;
    if (diff < 86400) return `il y a ${Math.floor(diff/3600)} h`;
    if (diff < 86400 * 7) return `il y a ${Math.floor(diff/86400)} j`;
    return d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
  },

  _repToggleFolder(folderId) {
    if (this._repOpenFolders.has(folderId)) {
      this._repOpenFolders.delete(folderId);
    } else {
      this._repOpenFolders.add(folderId);
    }
    const body = document.querySelector(`#repFolder_${folderId} .rep-folder-body`);
    const chev = document.querySelector(`#repFolder_${folderId} .rep-folder-chev`);
    if (body) body.classList.toggle('open');
    if (chev) chev.classList.toggle('open');
  },

  _repDeleteFolderConfirm(folderId) {
    const folder = this._repertoire.folders.find(f => f.id === folderId);
    if (!folder) return;
    const count = this._repertoire.words.filter(w => w.folderId === folderId).length;
    const others = this._repertoire.folders.filter(f => f.id !== folderId);
    const fallbackName = others[0]?.name;
    const msg = count > 0
      ? `Supprimer le dossier "${folder.name}" ? Les ${count} mot(s) seront déplacés${fallbackName ? ` dans "${fallbackName}"` : ''}.`
      : `Supprimer le dossier "${folder.name}" ?`;
    if (confirm(msg)) this.repDeleteFolder(folderId);
  },

  // Remove a word from Répertoire by word text (used when deleting a Grenier card)
  _syncRemoveWordFromRepertoire(wordText) {
    if (!wordText) return;
    const lower = wordText.toLowerCase();
    const existed = this._repertoire.words.some(w => w.word.toLowerCase() === lower);
    if (!existed) return;
    this._syncTombstone(this._repertoire.words
      .filter(w => w.word.toLowerCase() === lower).map(w => w.id));
    this._repertoire.words = this._repertoire.words.filter(w => w.word.toLowerCase() !== lower);
    this.saveRepertoire();
  },

  // One-time dedup: within each deck, keep only the card with the best SRS data
  // (most reps, or if equal, longest interval). Cards in different decks are untouched.
  _grDeduplicateCards() {
    if (!this._grenier) return;
    const seen = new Map(); // key: deckId|word.toLowerCase() → card to keep
    const toDelete = new Set();
    for (const card of this._grenier.cards) {
      if (card.deleted) continue;
      const key = card.deckId + '|' + (card.word || '').toLowerCase();
      if (!seen.has(key)) { seen.set(key, card); continue; }
      // Duplicate within same deck — keep the one with more reps (or longer interval)
      const existing = seen.get(key);
      const keepExisting = (existing.reps > card.reps) ||
        (existing.reps === card.reps && existing.interval >= card.interval);
      if (keepExisting) {
        toDelete.add(card.id);
      } else {
        toDelete.add(existing.id);
        seen.set(key, card);
      }
    }
    if (!toDelete.size) return;
    toDelete.forEach(id => {
      const c = this._grenier.cards.find(c => c.id === id);
      if (c) c.deleted = true;
    });
    this.saveGrenier();
    // Also deduplicate Répertoire words within the same folder
    const repSeen = new Set();
    const repToRemove = new Set();
    for (const w of this._repertoire.words) {
      const key = (w.folderId || '') + '|' + (w.word || '').toLowerCase();
      if (repSeen.has(key)) { repToRemove.add(w.id); continue; }
      repSeen.add(key);
    }
    if (repToRemove.size) {
      this._syncTombstone([...repToRemove]);
      this._repertoire.words = this._repertoire.words.filter(w => !repToRemove.has(w.id));
      this.saveRepertoire();
    }
  },

  // One-time reconciliation on startup: merge Grenier ↔ Répertoire without deleting anything
  _syncReconcile() {
    if (!this._grenier) return;
    let changed = false;

    // Paquets et dossiers se recréent mutuellement par leur NOM. Après une
    // fusion qui rapporte la suppression d'un paquet fait sur un autre
    // appareil, ce miroir le recréerait aussitôt et le renverrait au serveur :
    // une suppression qui revient toute seule, en boucle. On propage donc la
    // suppression au jumeau survivant au lieu de ressusciter le disparu.
    const killed = name => {
      const t = this._syncDeleted?.['nom:' + String(name || '').toLowerCase()];
      return t ? t : 0;
    };
    for (const deck of [...this._grenier.decks]) {
      const t = killed(deck.name);
      if (t && t >= Number(deck.uContent || deck.createdAt || 0)) {
        this._syncTombstone(deck.id, this._grenier.cards.filter(c => c.deckId === deck.id).map(c => c.id));
        this._grenier.decks = this._grenier.decks.filter(d => d.id !== deck.id);
        this._grenier.cards = this._grenier.cards.filter(c => c.deckId !== deck.id);
        changed = true;
      }
    }
    for (const folder of [...this._repertoire.folders]) {
      const t = killed(folder.name);
      if (t && t >= Number(folder.uContent || folder.createdAt || 0)) {
        this._syncTombstone(folder.id);
        this._repertoire.folders = this._repertoire.folders.filter(f => f.id !== folder.id);
        changed = true;
      }
    }

    // 1. For every Grenier deck, ensure a matching Répertoire folder exists
    for (const deck of this._grenier.decks) {
      if (!this._repertoire.folders.find(f => f.name === deck.name)) {
        const mid = this._syncMirrorId('mf_', deck.name);
        if (this._syncMirrorBlocked(mid, deck)) continue;
        this._repertoire.folders.push({
          id: mid,
          name: deck.name,
          emoji: deck._emoji || '📁',
          createdAt: deck.createdAt || Date.now()
        });
        changed = true;
      }
    }

    // 2. For every Répertoire folder, ensure a matching Grenier deck exists
    for (const folder of this._repertoire.folders) {
      if (!this._grenier.decks.find(d => d.name === folder.name)) {
        const mid = this._syncMirrorId('md_', folder.name);
        if (this._syncMirrorBlocked(mid, folder)) continue;
        this._grenier.decks.push({
          id: mid, name: folder.name,
          color: this.GRENIER_COLORS[Math.floor(Math.random() * this.GRENIER_COLORS.length)],
          _emoji: folder.emoji || '📁', createdAt: folder.createdAt || Date.now()
        });
        changed = true;
      }
    }

    // 3. For every active Grenier card, ensure the word is in the matching Répertoire folder
    // Check by (word + folder) pair so a word can legitimately live in multiple folders
    for (const card of this._grenier.cards) {
      if (card.deleted) continue;
      const deck = this._grenier.decks.find(d => d.id === card.deckId);
      if (!deck) continue;
      const folder = this._repertoire.folders.find(f => f.name === deck.name);
      if (!folder) continue;
      // Only add if this exact (word, folder) pair is missing
      const alreadyIn = this._repertoire.words.some(
        w => w.word.toLowerCase() === card.word?.toLowerCase() && w.folderId === folder.id
      );
      if (!alreadyIn) {
        const mid = this._syncMirrorId('mw_', folder.name + '|' + card.word);
        if (this._syncMirrorBlocked(mid, card)) continue;
        this._repertoire.words.unshift({
          id: mid,
          word: card.word, ipa: card.ipa || '',
          folderId: folder.id,
          addedAt: card.createdAt || Date.now(),
          source: 'grenier'
        });
        changed = true;
      }
    }

    // 4. For every Répertoire word, ensure a Grenier card exists in the matching deck.
    // IMPORTANT: if the word exists in a *different* deck (i.e. was moved), don't duplicate it —
    // just move the Répertoire word to match the card's current deck instead.
    for (const rw of this._repertoire.words) {
      const folder = this._repertoire.folders.find(f => f.id === rw.folderId);
      if (!folder) continue;
      const deck = this._grenier.decks.find(d => d.name === folder.name);
      if (!deck) continue;

      // Check if this word exists in this specific deck
      const inThisDeck = this._grenier.cards.some(
        c => c.deckId === deck.id && c.word?.toLowerCase() === rw.word.toLowerCase() && !c.deleted
      );
      if (inThisDeck) continue;

      // Check if the word exists in a different deck (was moved) — if so, follow the card
      const inOtherDeck = this._grenier.cards.find(
        c => c.word?.toLowerCase() === rw.word.toLowerCase() && !c.deleted && c.deckId !== deck.id
      );
      if (inOtherDeck) {
        // Update Répertoire to match where the card actually lives now
        const actualDeck = this._grenier.decks.find(d => d.id === inOtherDeck.deckId);
        const actualFolder = actualDeck ? this._repertoire.folders.find(f => f.name === actualDeck.name) : null;
        if (actualFolder) { rw.folderId = actualFolder.id; changed = true; }
        continue; // don't create a duplicate card
      }

      // Word is genuinely missing from Grenier — create it
      const mid = this._syncMirrorId('mc_', deck.name + '|' + rw.word);
      if (this._syncMirrorBlocked(mid, rw)) continue;
      this._grenier.cards.push({
        id: mid, deckId: deck.id, word: rw.word, ipa: rw.ipa || '',
        interval: 1, ease: 2.5, reps: 0, nextDue: Date.now(),
        showListen: true, showRecord: true, showRhymes: true,
        color: null, definition: '', createdAt: rw.addedAt || Date.now()
      });
      changed = true;
    }

    if (changed) { this.saveRepertoire(); this.saveGrenier(); }
  },
