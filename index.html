.grenier-card-settings-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  max-width: 480px;
  margin: 0 auto;
  background: var(--gr-bg2);
  border: 1px solid var(--gr-border-bright);
  border-bottom: none;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 20px 20px 40px;
  z-index: 200;
  animation: slideUp 0.25s ease;
}
.grenier-card-settings-title {
  font-family: var(--font-display);
  font-size: 15px;
  color: var(--gr-orange);
  margin-bottom: 16px;
  text-align: center;
}
.grenier-settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--gr-border);
  font-size: 14px;
  color: var(--text);
}
.grenier-settings-row:last-child { border-bottom: none; }
.grenier-toggle {
  width: 40px; height: 22px;
  background: var(--gr-surface2);
  border-radius: 100px;
  position: relative;
  cursor: pointer;
  border: 1px solid var(--gr-border);
  transition: background 0.2s;
  flex-shrink: 0;
}
.grenier-toggle.on { background: var(--gr-orange); border-color: var(--gr-orange); }
.grenier-toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  background: #fff;
  border-radius: 50%;
  transition: left 0.2s;
}
.grenier-toggle.on::after { left: 20px; }

/* Session done screen */
.grenier-done-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
  flex: 1;

.grenier-done-icon { font-size: 64px; margin-bottom: 16px; }
.grenier-done-title {
  font-family: var(--font-display);
  font-size: 26px;
  color: var(--gr-orange);
  text-shadow: 0 0 30px var(--gr-orange-glow);
  margin-bottom: 8px;

.grenier-done-sub { font-size: 14px; color: var(--text2); margin-bottom: 28px; line-height: 1.5; }
.grenier-done-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 360px;
  margin-bottom: 28px;

.grenier-done-stat {
  background: var(--gr-surface);

  flex-direction: column;

.grenier-done-stat-val { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.grenier-done-stat-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; }

/* ── Labo tile orange override ──────────────────────────────── */
.labo-tile-grenier {

      return this._idbReady;

      const db = await this._idbOpen();
      return new Promise((res, rej) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').put(blob, key);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    },

      const db = await this._idbOpen();
      return new Promise((res, rej) => {
        const tx = db.transaction('images', 'readonly');
        const req = tx.objectStore('images').get(key);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => rej(req.error);
      });
    },

      const db = await this._idbOpen();
      return new Promise((res, rej) => {

        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);

      });
    },

    // Hydrate all <img data-idb-key="..."> in a container element with blob URLs
    async _idbHydrateImages(container) {
      if (!container) return;
      const imgs = container.querySelectorAll('img[data-idb-key]');
      for (const img of imgs) {
        // Only skip if the blob URL is from THIS session (tracked in _idbBlobUrls)
        const key = img.dataset.idbKey;
        if (img.src?.startsWith('blob:') && this._idbBlobUrls?.[key] === img.src) continue;
        try {
          let blob = await this._idbGet(key);
          // Absente de cette base ? Elle est peut-être sauvegardée sur le PC.
          // C'est ce qui rattrape un changement d'adresse (IndexedDB est liée
          // à l'origine) ou une carte reçue d'un autre appareil.
          if (!blob) blob = await this._syncImageFetch(key);
          if (blob) {
            const url = URL.createObjectURL(blob);
            (this._idbBlobUrls = this._idbBlobUrls || {})[key] = url;
            img.src = url;
          } else {
            img.replaceWith(Object.assign(document.createElement('span'), { className: 'def-img-placeholder', textContent: '⚠ image introuvable' }));
          }
        } catch(e) { console.warn('idb hydrate error', e); }
      }
    },

    // Shared paste handler for contenteditable definition editors
    async _defEditorPaste(e, editorEl) {
      const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const blob = item.getAsFile();
          if (!blob) continue;
          const key = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
          await this._idbPut(key, blob);
          const url = URL.createObjectURL(blob);
          const img = document.createElement('img');
          img.src = url;
          img.dataset.idbKey = key;
          img.style.maxWidth = '100%';
          img.style.maxHeight = '220px';
          img.style.borderRadius = '6px';
          img.style.margin = '4px auto';
          img.style.display = 'block';
          // Insert at cursor
          const sel = window.getSelection();
          if (sel?.rangeCount) {
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(img);
            range.setStartAfter(img);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
          } else {
            editorEl.appendChild(img);
          }
          return; // only handle first image
        }
      }
      // Not an image — let default text paste happen
    },

    // ── End IndexedDB helpers ─────────────────────────────────────────────────

    init() {
    if (!this._storageWorks()) return;   // bandeau bloquant, on ne va pas plus loin
    this.loadSettings();
    this.loadScores();
    this.loadDiagScores();
    this.loadPassageScores();
    this.loadRepertoire();
    this.loadLookupHistory();
    this.loadGrenier();
    this.loadSyncConfig();
    // Photographier l'état de départ AVANT toute sauvegarde, sinon la
    // première écriture marquerait toutes les données comme « modifiées
    // maintenant » et cet appareil écraserait les autres.
    this._syncSnapshot();
    this._grDeduplicateCards();
    this._syncReconcile();
    this.applyTheme();
    this._grApplyTheme();
    if (this.settings.launchScreen === 'labo') this.renderLabo();
    else if (this.settings.launchScreen === 'word-focus') { this._wfFromBilan = false; this.currentScreen = 'word-focus'; this.renderWordFocus(); }
    else if (this.settings.launchScreen === 'grenier') { this.currentScreen = 'grenier'; this.renderGrenier(); }
    else this.renderHome();
    this.setupSpeechSynthVoices();
    this._setupLongPress();
    this._syncStartAuto();
    this._installWire();
    // Une session mains libres ne doit pas continuer à parler dans le vide.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && this._hfSession && !this._hfSession.pause) {
        this._hfSession.pause = true;
        clearTimeout(this._hfTimer);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    });
  },

  // Un .html ouvert depuis les Téléchargements d'Android devient une page
  // content:// — le stockage y échoue, mais silencieusement. L'appli aurait
  // l'air de marcher et tout serait perdu à la fermeture de l'onglet. On
  // vérifie donc pour de vrai : écrire, relire, effacer.
  _storageWorks() {
    let ok = false;
    try {
      const k = '__phonetique_test__';
      localStorage.setItem(k, 'x');
      ok = localStorage.getItem(k) === 'x';
      localStorage.removeItem(k);
    } catch(e) { ok = false; }
    if (ok) return true;
    document.body.innerHTML = `
      <div style="padding:24px;font-family:system-ui,sans-serif;color:#E8EAF8;background:#05060F;min-height:100vh">
        <div style="max-width:520px;margin:40px auto;border:2px solid #EF4444;border-radius:16px;padding:20px;background:rgba(239,68,68,0.08)">
          <h2 style="margin:0 0 12px;color:#EF4444">Cette page ne peut rien enregistrer</h2>
          <p style="line-height:1.6;color:#9BA3C4">
            Le navigateur refuse le stockage local, donc <strong>tout ce que tu ferais ici
            serait perdu</strong> en fermant l'onglet. L'appli s'arrête volontairement
            plutôt que de faire semblant de fonctionner.
          </p>
          <p style="line-height:1.6;color:#9BA3C4">
            C'est presque toujours un fichier ouvert depuis les Téléchargements sur Android
            (adresse <code>content://</code>). Ouvre plutôt l'appli depuis l'adresse du
            serveur, ou installe-la sur l'écran d'accueil.
          </p>
          <p style="font-family:monospace;font-size:12px;color:#5A6080;word-break:break-all">${location.href}</p>
        </div>
      </div>`;
    return false;
  },

  _setupLongPress() {
    let lpTimer = null;
    let lpTarget = null;
    const DURATION = 500;

    const cancel = () => {
      clearTimeout(lpTimer);
      lpTimer = null;
      if (lpTarget) {
        lpTarget.classList.remove('lp-active');
        lpTarget.classList.remove('lp-active-row');
        lpTarget.classList.remove('lp-active-recent');
        lpTarget = null;
      }
    };

    const main = document.getElementById('main');

    // ── contextmenu fires on Android long-press (and desktop right-click) ──
    // Use it as the primary long-press trigger for word rows
    main.addEventListener('contextmenu', e => {
      const row = e.target.closest('.rep-word-row');
      if (row) {
        e.preventDefault();
        cancel();
        if (App._repSelectedIds.length >= 1 && !row.classList.contains('rep-selected')) {
          App._repToggleSelect(row);
          return;
        }
        App._repToggleSelect(row);
        return;
      }
      const rcard = e.target.closest('.rep-recent-card');
      if (rcard) {
        e.preventDefault();
        cancel();
        const word = rcard.dataset.recentWord;
        App._recentToggleSelect(rcard, word);
        return;
      }
      // Folder header long-press (contextmenu / right-click)
      const fh = e.target.closest('.rep-folder-header[data-folder-id]');
      if (fh && !e.target.closest('button')) {
        e.preventDefault();
        cancel();
        App._repShowRenameFolderOverlay(fh.dataset.folderId);
        return;
      }
    });

    // ── pointerdown: handles bilan word-focus long-press + desktop/Chromebook rep rows ──
    main.addEventListener('pointerdown', e => {
      // Bilan annotation word (data-wf)
      const wfEl = e.target.closest('[data-wf]');
      if (wfEl) {
        lpTarget = wfEl;
        wfEl.classList.add('lp-active');
        lpTimer = setTimeout(() => {
          wfEl.classList.remove('lp-active');
          const word = wfEl.dataset.wf;
          if (word) {
            wfEl.addEventListener('click', ev => ev.stopImmediatePropagation(), { once: true, capture: true });
            App._wfFromBilan = App.currentScreen === 'bilan';
            App.navigate('word-focus', { word });
          }
          lpTimer = null; lpTarget = null;
        }, DURATION);
        return;
      }

      // Répertoire word row — pointer timer (Chromebook / desktop)
      const row = e.target.closest('.rep-word-row');
      if (row) {
        // In pick mode (≥1 selected): single tap selects immediately, no timer needed
        if (App._repSelectedIds.length >= 1) {
          if (!row.classList.contains('rep-selected')) {
            App._repToggleSelect(row);
          } else {
            App._repToggleSelect(row); // deselect
          }
          return;
        }
        // Normal mode: ignore play btn and word text (those are single-tap)
        if (e.target.closest('.rep-play-btn') || e.target.closest('.rep-word-text')) return;
        lpTarget = row;
        row.classList.add('lp-active-row');
        lpTimer = setTimeout(() => {
          row.classList.remove('lp-active-row');
          lpTimer = null; lpTarget = null;
          App._repToggleSelect(row);
        }, DURATION);
        return;
      }

      // Recent card — pointer timer for long-press select (Chromebook / desktop)
      const rcard = e.target.closest('.rep-recent-card');
      if (rcard) {
        // If already in recent-select mode, single tap selects
        if (App._recentSelectedWords && App._recentSelectedWords.length > 0) {
          const word = rcard.dataset.recentWord;
          App._recentToggleSelect(rcard, word);
          return;
        }
        lpTarget = rcard;
        rcard.classList.add('lp-active-recent');
        lpTimer = setTimeout(() => {
          rcard.classList.remove('lp-active-recent');
          lpTimer = null; lpTarget = null;
          const word = rcard.dataset.recentWord;
          App._recentToggleSelect(rcard, word);
        }, DURATION);
        return;
      }

      // Folder header — long-press to rename
      const fh = e.target.closest('.rep-folder-header[data-folder-id]');
      if (fh && !e.target.closest('button')) {
        lpTarget = fh;
        fh.classList.add('lp-active-row');
        lpTimer = setTimeout(() => {
          fh.classList.remove('lp-active-row');
          lpTimer = null; lpTarget = null;
          fh.addEventListener('click', ev => ev.stopImmediatePropagation(), { once: true, capture: true });
          App._repShowRenameFolderOverlay(fh.dataset.folderId);
        }, DURATION);
        return;
      }
    }, { passive: true });

    main.addEventListener('pointerup', cancel);
    main.addEventListener('pointermove', e => {
      // Only cancel if moved more than a few px (avoids cancelling on tiny finger wobble)
      if (lpTarget && e.movementX !== undefined && (Math.abs(e.movementX) > 6 || Math.abs(e.movementY) > 6)) cancel();
      else if (lpTarget && e.movementX === undefined) cancel();
    });
    main.addEventListener('pointercancel', cancel);
  },

  showToast(msgText) {
    const old = document.getElementById('toastMsg');

    const msg = document.createElement('div');

    msg.textContent = msgText;
    msg.style.borderColor = 'rgba(96,165,250,0.4)';
    document.body.appendChild(msg);

  // ── SETTINGS ────────────────────────────────────────────────
  loadSettings() {
    try {
      const s = localStorage.getItem('phonetique_settings');
      if (s) this.settings = { ...this.settings, ...JSON.parse(s) };
    } catch (e) {}
  },
  saveSettings() {
    // Les réglages forment un seul bloc : le dernier appareil qui les modifie
    // gagne. Ne pas réestampiller pendant qu'on applique une fusion, sinon
    // l'appareil se déclarerait indéfiniment plus récent que le serveur.
    if (!this._syncApplying) {
      this._syncSettingsU = Date.now();
      localStorage.setItem('phonetique_settings_u', String(this._syncSettingsU));
    }
    localStorage.setItem('phonetique_settings', JSON.stringify(this.settings));
  },
  loadScores() {
    try {
      const s = localStorage.getItem('phonetique_scores');
      if (s) this.scores = JSON.parse(s);
    } catch (e) {}
  },
  saveScores() {
    localStorage.setItem('phonetique_scores', JSON.stringify(this.scores));
  },
  loadDiagScores() {
    try {
      const b = localStorage.getItem('phonetique_bilan');
      if (b) {
        const d = JSON.parse(b);
        this.bilanScores = d.latest || {};
        this.bilanBestScores = d.best || {};
        this.bilanPassageIndex = d.passageIndex ?? 0;
        this.bilanAiPassage = d.aiPassage || null;
        // Migrate legacy: old save had a single custom passage text
        if (!this.bilanAiPassage && d.passage) {
          this.bilanAiPassage = d.passage;
          this.bilanPassageIndex = 5;
        }
      }
    } catch(e) {}
  },
  saveDiagScores() {
    localStorage.setItem('phonetique_bilan', JSON.stringify({
      latest: this.bilanScores,
      best: this.bilanBestScores,
      passageIndex: this.bilanPassageIndex,
      aiPassage: this.bilanAiPassage,
    }));
  },
  getActiveBilanPassage() {
    if (this.bilanPassageIndex === 5) return this.bilanAiPassage || null;
    return BILAN_PASSAGES[this.bilanPassageIndex]?.text || BILAN_PASSAGES[0].text;
  },
  selectBilanPassage(idx) {
    this.bilanPassageIndex = idx;
    this.saveDiagScores();
    // Clear previous recording results when switching passages
    this._lastBilanScore = null;
    this._lastBilanPa = null;
    this._lastBilanWords = null;
    this._lastBilanAnnotationOpen = false;
    this._bilanWords = null;
    this.renderBilan();
  },
  loadPassageScores() {
    try {
      const s = localStorage.getItem('phonetique_passage_scores');
      if (s) this.passageScores = JSON.parse(s);
    } catch(e) {}
    try {
      const a = localStorage.getItem('phonetique_ai_passages');
      if (a) this.aiPassages = JSON.parse(a);
    } catch(e) {}
  },
  savePassageScores() {
    localStorage.setItem('phonetique_passage_scores', JSON.stringify(this.passageScores));
  },
  saveAiPassages() {
    localStorage.setItem('phonetique_ai_passages', JSON.stringify(this.aiPassages));
  },
  getPassageScore(phonemeId, idx) {
    return this.passageScores[phonemeId + '_' + idx] ?? null;
  },
  recordPassageScore(phonemeId, idx, score) {
    const key = phonemeId + '_' + idx;
    if (this.passageScores[key] === undefined || score > this.passageScores[key]) {
      this.passageScores[key] = score;
      this.savePassageScores();
    }
  },
  applyTheme() {
    document.documentElement.setAttribute('data-theme', this.settings.darkMode ? 'dark' : 'light');
  },

  goBack() {
    if (this.navHistory.length > 1) {
      this.navHistory.pop();
      const prev = this.navHistory[this.navHistory.length - 1];
      this.navigate(prev.screen, prev.params, true);
    } else {
      this.navHistory = [];
      this.navigate('home', {}, true);
    }
  },

  navigate(screen, params = {}, skipHistory = false) {
    if (!skipHistory) this.navHistory.push({ screen, params });
    if (this.navHistory.length > 20) this.navHistory.shift();
    this.currentScreen = screen;
    const main = document.getElementById('main');
    main.classList.remove('main-flex');
    main.classList.add('screen-exit');
    setTimeout(() => {
      main.classList.remove('screen-exit');
      main.classList.add('screen-enter');
      switch (screen) {
        case 'home': this.renderHome(); break;
        case 'category': this.renderCategory(params.categoryId); break;
        case 'phoneme': this.renderPhoneme(params.phonemeId); break;
        case 'mode-practice': this.renderPractice(params.phonemeId); break;
        case 'mode-read': this.renderRead(params.phonemeId, params.passageIndex || 0); break;
        case 'mode-compare': this.renderCompare(params.phonemeId); break;
        case 'mode-test': this.renderTest(params.phonemeId); break;
        case 'scores': this.renderScores(); break;
        case 'phrase-libre': this.renderPhraseLibre(); break;
        case 'bilan':
          if (this._lastBilanScore != null) {
            // Restore previous results rather than showing blank screen
            this.renderBilan();
            this.showBilanResults(this._lastBilanScore, this._lastBilanPa, this._lastBilanWords);
            if (this._lastBilanAnnotationOpen) this.toggleBilanAnnotation();
          } else {
            this.renderBilan();
          }
          break;
        case 'labo': this.renderLabo(); break;
        case 'labo-scores': this.renderLaboScores(); break;
        case 'settings': this.renderSettings(); break;
        case 'word-focus':
          if (params?.__deepSearch) {
            this.renderWordFocus('', '');
            // Re-enter deep mode after render, restoring the previous query
            setTimeout(() => this._wfRestoreDeepMode(params.query || ''), 50);
          } else {
            this.renderWordFocus(params?.word || '', params?.compareWord || '');
          }
          break;
        case 'repertoire': this.renderRepertoire(); break;
        case 'grenier': this.renderGrenier(); break;
        case 'phoneme-focus': this.renderPhonemeFocus(); break;
        case 'hands-free': this.renderHandsFree(); break;
        case 'grenier-card-create': this.renderGrenierCardCreate(params || {}); break;
        case 'grenier-study':
          // If a session is already active for this deck, just re-render current card
          if (this._grenierStudySession && this._grenierStudySession.deckId === params?.deckId) {
            this._grRenderStudyCard();
          } else {
            this.renderGrenierStudy(params?.deckId || null);
          }
          break;
      }
      setTimeout(() => main.classList.remove('screen-enter'), 400);
    }, 150);
  },

  async wfLoadWord() {
    document.getElementById('wfGrenierSuggest')?.remove();
    const input = document.getElementById('wfInput');
    const word = (input?.value || '').trim().replace(/\s+/g, ' ').toLowerCase();
    if (!word) return;
    // Reflect normalised value back into the input
    if (input) input.value = word;
    this._wfCurrentWord = word;
    this._wfCurrentIpa = '';
    this._wfCurrentGender = '';
    // Always force-close the definition panel (back face) before loading a new word.
    // If the card is currently showing the back face, restore the front face so that
    // all the front-face elements (#wfWordDisplay, #wfIpa, etc.) exist in the DOM.
    this._wfRestoreFront();
    // Context is never cleared by Analyser — only by Effacer or typing a new word.
    // Reset UI
    const card = document.getElementById('wfWordCard');
    const wordDisplay = document.getElementById('wfWordDisplay');
    const ipaEl = document.getElementById('wfIpa');
    const listenBtn = document.getElementById('wfListenBtn');
    const recordBtn = document.getElementById('wfRecordBtn');
    if (card) card.style.display = '';
    if (wordDisplay) wordDisplay.textContent = word;
    if (ipaEl) { ipaEl.textContent = 'Chargement IPA…'; ipaEl.className = 'wf-ipa wf-ipa-loading'; }
    if (listenBtn) listenBtn.disabled = false;
    if (recordBtn) recordBtn.disabled = false;
    // Show save button and update its state
    const saveBtn = document.getElementById('wfSaveBtn');
    if (saveBtn) { saveBtn.style.display = ''; App._wfUpdateSaveBtn(); }
    // Show compare button
    const cmpBtn = document.getElementById('wfCompareBtn');
    if (cmpBtn) cmpBtn.style.display = '';
    // Show rhymes button and clear previous rhymes
    const rhymesBtn = document.getElementById('wfRhymesBtn');
    if (rhymesBtn) { rhymesBtn.style.display = ''; rhymesBtn.classList.remove('loading'); }
    const rhymesSlot = document.getElementById('wfRhymesSlot');
    if (rhymesSlot) rhymesSlot.innerHTML = '';
    // Show/update rep nav button — always visible when a word is loaded
    const repNavBtn = document.getElementById('wfRepNavBtn');
    if (repNavBtn) repNavBtn.style.display = '';
    App._wfUpdateRepBtn();
    // Show action row (Rimes / Comparer / Flip)
    const actionRow = document.getElementById('wfActionRow');
    if (actionRow) actionRow.style.display = '';
    // Reset definition state for new word (panel lives inside card via flip)
    this._wfCurrentDef = '';
    this._wfDefPanelOpen = false;
    // Pre-populate definition from grenier card if one exists for this word
    const grCard = (this._grenier?.cards || []).find(c => !c.deleted && c.word?.toLowerCase() === word.toLowerCase());
    if (grCard?.definition) this._wfCurrentDef = grCard.definition;
    this._wfUpdateFlipDot();
    // Record this word in lookup history (IPA added after fetch)
    this._wfRecordLookup(word, '');
    // Reset score/playback
    this.retryRecording();
    const relistenBtn = document.getElementById('wfRelistenBtn');
    if (relistenBtn) { relistenBtn.disabled = true; relistenBtn.style.color = ''; relistenBtn.style.borderColor = ''; }
    // Fetch IPA
    await this._wfFetchIpa(word);
  },

  // ── Shared IPA helper: fetch wikitext for a single word and extract IPA + gender ──
  async _fetchWiktionaryContent(searchWord) {
    const url = `https://fr.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(searchWord)}&prop=revisions&rvprop=content&format=json&origin=*`;
    const resp = await fetch(url);
    if (!resp.ok) return '';
    const data = await resp.json();
    const rev = Object.values(data?.query?.pages || {})[0]?.revisions?.[0] || {};
    return rev['*'] || rev?.slots?.main?.['*'] || '';
  },

  // Validate that a string looks like IPA (not a region label like 'Suisse (canton du Valais)')
  _isValidIpa(s) {
    if (!s || !s.trim()) return false;
    const t = s.trim();
    if (t.includes('(') || t.includes(')')) return false; // region labels
    const regionWords = ['suisse','france','belgique','québec','canada','paris','normandie','bretagne','wallon','acadie'];
    const lower = t.toLowerCase();
    if (regionWords.some(r => lower === r || lower.startsWith(r + ' '))) return false;
    return true;
  },

  // Extract IPA from wikitext content
  _extractIpaFromContent(content) {
    const ipaPatterns = [
      /\{\{pron\|([^|}\]]+)\|fr/i,
      /\{\{pron\|([^|}\]]+)\}/i,
      /\{\{API\|\/([^/}]+)\//i,
      /\{\{phon\|([^|}\]]+)\|fr/i,
      /\{\{phon\|([^|}\]]+)\}/i,
      /\{\{AFI\|\/([^/}]+)\//i,
      /\|pron=([^|\n}]+)/i,
      /prononciation[^:]*:\s*\/([^/\n]+)\//i,
    ];
    // Try all matches (not just first), skip invalid ones
    for (const pat of ipaPatterns) {
      const matches = [...content.matchAll(new RegExp(pat.source, pat.flags + 'g'))];
      for (const m of matches) {
        const candidate = m[1]?.trim();
        if (this._isValidIpa(candidate)) return candidate;
      }
    }
    return '';
  },

  // Fetch IPA for a word, handling apostrophes (s'effriter → effriter) and multi-word
  async _fetchIpaForWord(word) {
    // Try exact word first
    let content = await this._fetchWiktionaryContent(word);
    let ipa = content ? this._extractIpaFromContent(content) : '';
    let gender = content ? this._parseGenderFromWikitext(content) : '';

    // If no IPA and word has apostrophe, try the part after the apostrophe
    if (!ipa && word.includes("'")) {
      const afterApos = word.split("'").slice(1).join("'");
      if (afterApos) {
        content = await this._fetchWiktionaryContent(afterApos);
        ipa = content ? this._extractIpaFromContent(content) : '';
        if (!gender && content) gender = this._parseGenderFromWikitext(content);
      }
    }

    // If still no IPA and word has a hyphen, try without hyphen parts
    if (!ipa && word.includes('-')) {
      const mainPart = word.split('-')[0];
      if (mainPart.length > 2) {
        content = await this._fetchWiktionaryContent(mainPart);
        ipa = content ? this._extractIpaFromContent(content) : '';
      }
    }

    return { ipa: ipa ? `/${ipa}/` : '', gender };
  },

  async _wfFetchIpa(word) {
    const ipaEl = document.getElementById('wfIpa');
    try {
      const { ipa, gender } = await this._fetchIpaForWord(word);
      if (ipa) {
        this._wfCurrentIpa = ipa;
        this._wfCurrentGender = gender;
        this._wfUpdateWordDisplay();
        if (ipaEl) { ipaEl.textContent = ipa; ipaEl.className = 'wf-ipa'; }
        const lh = this._lookupHistory.find(h => h.word === word);
        if (lh) { lh.ipa = ipa; this.saveLookupHistory(); }
        return;
      }
      // ── Fallback: EN Wiktionary REST API ──
      const enUrl = `https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word.toLowerCase())}`;
      const enResp = await fetch(enUrl);
      if (enResp.ok) {
        const enData = await enResp.json();
        const frSection = enData?.fr || [];
        for (const entry of frSection) {
          if (entry.pronunciations) {
            for (const p of entry.pronunciations) {
              const raw = typeof p === 'string' ? p : (p.ipa || '');
              const match = raw.match(/\/([^/]+)\//);
              if (match) {
                this._wfCurrentIpa = `/${match[1]}/`;
                if (ipaEl) { ipaEl.textContent = this._wfCurrentIpa; ipaEl.className = 'wf-ipa'; }
                const lh = this._lookupHistory.find(h => h.word === word);
                if (lh) { lh.ipa = this._wfCurrentIpa; this.saveLookupHistory(); }
                return;
              }
            }
          }
        }
      }
    } catch(e) { /* silent */ }
    if (ipaEl) { ipaEl.textContent = 'IPA non disponible'; ipaEl.className = 'wf-ipa wf-ipa-loading'; }
  },

    const existing = this._wfHistory.findIndex(h => h.word.toLowerCase() === this._wfCurrentWord.toLowerCase());
    const entry = { word: this._wfCurrentWord, ipa: this._wfCurrentIpa, score, color };
    if (existing >= 0) this._wfHistory[existing] = entry;
    else this._wfHistory.unshift(entry);

    if (this._wfHistory.length > 20) this._wfHistory = this._wfHistory.slice(0, 20);

    const relistenBtn = document.getElementById('wfRelistenBtn');

  _wfSwapWords() {
    const currentWord = this._wfCurrentWord;
    const currentIpa = this._wfCurrentIpa;
    const compareWord = this._wfCompareCurrentWord;
    const compareIpa = this._wfCompareCurrentIpa;
    if (!currentWord || !compareWord) return;

    // Update main input and word card with compare word
    const input = document.getElementById('wfInput');
    const wordDisplay = document.getElementById('wfWordDisplay');
    const ipaEl = document.getElementById('wfIpa');
    const listenBtn = document.getElementById('wfListenBtn');
    const recordBtn = document.getElementById('wfRecordBtn');
    const clearBtn = document.getElementById('wfClearBtn');
    if (input) input.value = compareWord;
    if (clearBtn) clearBtn.style.display = 'flex';
    if (wordDisplay) wordDisplay.textContent = compareWord;
    if (ipaEl) {
      if (compareIpa) { ipaEl.textContent = compareIpa; ipaEl.className = 'wf-ipa'; }
      else { ipaEl.textContent = 'Chargement IPA…'; ipaEl.className = 'wf-ipa wf-ipa-loading'; }
    }
    if (listenBtn) listenBtn.disabled = false;
    if (recordBtn) recordBtn.disabled = false;

    this._wfCurrentWord = compareWord;

    this._wfCompareCurrentWord = currentWord;

  // Sur téléphone, toucher le bouton fait perdre le focus au champ avant le
  // clic. On retient donc la position du curseur au fil de la frappe, et le
  // bouton empêche en plus le changement de focus (onpointerdown).
  _wfRememberCaret(el) {
    if (!el) return;
    this._wfCtxCaret = { s: el.selectionStart, e: el.selectionEnd };
  },

  _wfInsertWordInContext() {
    const src = document.getElementById('wfInput');
    const dst = document.getElementById('wfContextInput');
    if (!src || !dst) return;
    // Le Grenier enregistre le mot en minuscules : la phrase de contexte doit
    // suivre, sinon un « Levure » saisi au champ du haut se retrouve capitalisé
    // au milieu d'une phrase.
    let mot = (src.value || '').trim().toLowerCase();
    if (!mot) { this.showToast('Entrez d\'abord un mot'); return; }

    const v = dst.value;
    const actif = document.activeElement === dst;
    let s = actif ? dst.selectionStart : this._wfCtxCaret?.s;
    let e = actif ? dst.selectionEnd   : this._wfCtxCaret?.e;
    if (typeof s !== 'number' || typeof e !== 'number' || s > v.length || e > v.length) {
      s = e = v.length;                       // pas de curseur connu : à la fin
    }

    // Espacement : ne pas coller au mot voisin, ni doubler une espace.
    const avant = v.slice(0, s), apres = v.slice(e);
    // …sauf en début de phrase, où la majuscule est celle qu'on attend.
    if (!avant.trim() || /[.!?…]\s*$/.test(avant)) {
      mot = mot.charAt(0).toUpperCase() + mot.slice(1);
    }
    const gauche = (avant && !/\s$/.test(avant)) ? ' ' : '';
    const droite = (apres && !/^\s/.test(apres)) ? ' ' : '';
    const ins = gauche + mot + droite;
    dst.value = avant + ins + apres;

    const pos = s + gauche.length + mot.length;   // curseur juste après le mot
    this._wfCtxCaret = { s: pos, e: pos };
    dst.focus();
    try { dst.setSelectionRange(pos, pos); } catch(err) {}
  },

  _wfCloseContext() {
    const row = document.getElementById('wfContextRow');
    const btn = document.getElementById('wfContextBtn');
    if (row) { row.style.display = 'none'; row.innerHTML = ''; }
    document.querySelector('.wf-input-row')?.classList.remove('wf-with-ctx');

  _wfToggleDefEdit() {
    const area = document.getElementById('wfDefEditArea');
    if (!area) return;
    const isHidden = area.style.display === 'none';
    area.style.display = isHidden ? '' : 'none';
    if (isHidden) {
      const ta = document.getElementById('wfDefTextarea');
      if (ta) {

        App._idbHydrateImages(ta);
        setTimeout(() => { ta.focus(); const r = document.createRange(); r.selectNodeContents(ta); r.collapse(false); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }, 60);
      }

  _wfSaveDef() {
    const ta = document.getElementById('wfDefTextarea');
    if (!ta) return;
    this._wfCurrentDef = ta.innerHTML.trim();
    const defContent = document.getElementById('wfDefContent');
    if (defContent) { defContent.innerHTML = this._wfCurrentDef || '<span style="opacity:0.4;font-style:italic;font-size:13px">Vide.</span>'; App._idbHydrateImages(defContent); }
    const area = document.getElementById('wfDefEditArea');
    if (area) area.style.display = 'none';
    this._wfUpdateFlipDot();
    this.showToast('Définition sauvegardée ✓');
    // Sync to grenier card if one exists
    const word = this._wfCurrentWord;
    if (word) {
      const grCard = (this._grenier?.cards || []).find(c => !c.deleted && c.word?.toLowerCase() === word.toLowerCase());
      if (grCard) { grCard.definition = this._wfCurrentDef; this.saveGrenier(); }
    }
  },

  async _wfGenerateDef(type = 'simple') {
    if (!this.settings.openrouterKey) return;
    const word = this._wfCurrentWord;
    if (!word) return;
    const btnId = type === 'complex' ? 'wfDefGenComplex' : 'wfDefGenSimple';
    const btn = document.getElementById(btnId);
    const origHtml = btn?.innerHTML;
    if (btn) { btn.disabled = true; btn.classList.add('btn-processing'); }
    try {
      const isComplex = type === 'complex';
      const model = (isComplex ? this.settings.defComplexModel : this.settings.defSimpleModel)
        || this.settings.openrouterModel || 'openai/gpt-4o-mini';
      const customPrompt = isComplex ? this.settings.defComplexPrompt : this.settings.defSimplePrompt;
      const context = this._wfGetContext();
      let prompt;
      if (customPrompt?.trim()) {
        prompt = customPrompt.replace(/\{word\}/g, word);
        if (context) prompt += `\n\nContexte : « ${context} »`;
      } else if (isComplex) {
        prompt = `Fais une analyse complète en français du mot « ${word} » :\n1. Définition principale\n2. Étymologie (brève)\n3. Registre d'usage\n4. Synonymes (2-3)\n5. Exemple en contexte${context ? ` (intègre : « ${context} »)` : ''}\n6. Note phonétique ou particularité\nRéponds UNIQUEMENT avec la liste numérotée, sans titre ni introduction.`;
      } else if (context) {
        prompt = `Donne une courte définition en français (1-2 phrases) du mot « ${word} ».\nContexte : « ${context} » — intègre cet exemple. Inclus d'autres usages courants. Mentionne brièvement le registre (courant/conversationnel, technique, littéraire, etc.) et, si applicable, tout usage régional notable — sinon ne le mentionne pas.\nRéponds UNIQUEMENT avec la définition.`;
      } else {
        prompt = `Donne une courte définition en français (1-2 phrases) du mot « ${word} ». Inclus un exemple d'usage. Mentionne brièvement le registre (courant/conversationnel, technique, littéraire, etc.) et, si applicable, tout usage régional notable — sinon ne le mentionne pas. Réponds UNIQUEMENT avec la définition.`;
      }
      const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${this.settings.openrouterKey}`, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.href },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], max_tokens: 600 })
      });
      const data = await resp.json();
      const def = data.choices?.[0]?.message?.content?.trim() || '';
      if (def) {
        this._wfCurrentDef = def;
        // Si la carte a été créée avant l'arrivée de la définition, elle est
        // restée vide : on la complète maintenant.
        this._wfPushDefToGrenier(this._wfCurrentWord, def);
        const content = document.getElementById('wfDefContent');
        if (content) { content.innerHTML = def; App._idbHydrateImages(content); }
        this._wfCurrentDef = def;
        const ta = document.getElementById('wfDefTextarea');
        if (ta) ta.innerHTML = def;
        this._wfUpdateFlipDot();
        this.showToast(`Définition ${isComplex ? 'complexe' : 'simple'} générée ✓`);
        // Sync to grenier card if one exists for this word
        const grCard = (this._grenier?.cards || []).find(c => !c.deleted && c.word?.toLowerCase() === word.toLowerCase());
        if (grCard) { grCard.definition = def; this.saveGrenier(); }
      }
    } catch(e) { this.showToast('Erreur lors de la génération'); }
    if (btn) { btn.disabled = false; btn.classList.remove('btn-processing'); if (origHtml) btn.innerHTML = origHtml; }
  },

    const row = document.getElementById('wfGrenierDefTypeRow');
    if (row) row.style.display = on ? 'flex' : 'none';

  _wfSetDefType(type) {
