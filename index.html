  async _grGenerateSentence(cardId, word, type = 'simple') {
    const key = this.settings?.openrouterKey;
    if (!key) { this.showToast('Clé OpenRouter requise'); return; }
    const btnId = type === 'complex' ? 'grSentGenComplexBtn' : 'grSentGenSimpleBtn';
    const btn = document.getElementById(btnId);
    const origHtml = btn?.innerHTML;
    if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = '…'; }
    const resultEl = document.getElementById('grSentResult');
    if (resultEl) { resultEl.style.display = ''; resultEl.textContent = 'Génération…'; }
    try {
      const isComplex = type === 'complex';
      const model = (isComplex ? this.settings?.defComplexModel : this.settings?.defSimpleModel)
        || this.settings?.openrouterModel || 'openai/gpt-4o-mini';
      const context = document.getElementById('grCtxInput')?.value?.trim() || '';
      let prompt;
      if (isComplex) {
        prompt = `Écris une phrase en français qui utilise le mot « ${word} » de façon intéressante et nuancée.${context ? ` Contexte à intégrer : « ${context} ».` : ''} La phrase doit être mémorable et illustrer bien le sens du mot. Réponds UNIQUEMENT avec la phrase, sans guillemets ni explication.`;
      } else {
        prompt = `Écris une phrase simple en français qui utilise le mot « ${word} ».${context ? ` Contexte : « ${context} ».` : ''} Réponds UNIQUEMENT avec la phrase, sans guillemets ni explication.`;
      }
      const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method:'POST',
        headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json','HTTP-Referer':window.location.href},
        body:JSON.stringify({ model, messages:[{role:'user',content:prompt}], max_tokens:200 })
      });
      const data = await resp.json();
      const sentence = data.choices?.[0]?.message?.content?.trim() || '';
      if (sentence && resultEl) {
        resultEl.innerHTML = `<span style="font-style:italic;color:var(--text2)">${sentence}</span>
          <div style="display:flex;gap:6px;margin-top:8px">
            <button class="grenier-def-edit-btn" onclick="App._grAppendSentenceToDef('${cardId}',this.previousElementSibling?.previousSibling?.textContent||'${sentence.replace(/'/g,"\\'")}' )" style="font-size:11px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:10px;height:10px"><polyline points="20 6 9 17 4 12"/></svg>
              Ajouter à la définition
            </button>
          </div>`;
        // Store sentence for button use
        resultEl.dataset.sentence = sentence;
      }
    } catch(e) { if (resultEl) resultEl.textContent = 'Erreur lors de la génération'; }
    if (btn) { btn.disabled = false; btn.style.opacity = ''; if (origHtml) btn.innerHTML = origHtml; }
  },

  // ══════════════════════════════════════════════════════════════
  //  IMAGE GENERATION — MOF & Grenier
  // ══════════════════════════════════════════════════════════════

  // ── Shared: call OpenRouter image generation via chat completions ──
  async _generateImageViaOpenRouter(word, quality, context = '') {
    const key = this.settings?.openrouterKey;
    if (!key) { this.showToast('Clé OpenRouter requise'); return null; }
    const model = quality === 'smart'
      ? (this.settings.imgSmartModel  || 'google/gemini-3.1-flash-image-preview')
      : (this.settings.imgSimpleModel || 'sourceful/riverflow-v2-fast');

    // Gemini-family models output both text+image; all others output image only
    const isGemini = model.toLowerCase().includes('gemini');
    const modalities = isGemini ? ['image', 'text'] : ['image'];

    const prompt = `Illustration of the concept "${word}" for a French vocabulary flashcard. Clean, simple drawing on a plain white background. No text, no labels, no captions, no words of any kind in the image — purely visual.${context ? ` The word is used in this context: "${context}".` : ''}`;

    const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${key}`,
        'Content-Type': 'application/json',
        'HTTP-Referer': window.location.href,
      },
      body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], modalities })
    });

    if (!resp.ok) {
      const errText = await resp.text();
      console.error('Image gen error:', errText);
      throw new Error(`${resp.status} ${resp.statusText}`);
    }

    const data = await resp.json();
    const msg = data.choices?.[0]?.message;
    if (!msg) throw new Error('Pas de réponse du modèle');

    // Log full response for debugging
    console.log('Image API full response:', JSON.stringify(data, null, 2));

    // Extract image — handle all known OpenRouter response shapes
    let dataUrl = null;
    if (Array.isArray(msg.images) && msg.images.length) {
      const img = msg.images[0];
      dataUrl = (typeof img === 'string') ? img : (img?.url ?? img?.data ?? null);
    }
    if (!dataUrl && Array.isArray(msg.content)) {
      for (const part of msg.content) {
        if (part.type === 'image_url') {
          const iu = part.image_url;
          dataUrl = (typeof iu === 'string') ? iu : (iu?.url ?? null);
          break;
        }
        if (part.type === 'image') {
          dataUrl = part.data ?? part.url ?? null;
          break;
        }
      }
    }
    // Last resort: walk entire message object looking for any data: string
    if (!dataUrl) {
      const str = JSON.stringify(msg);
      const m = str.match(/"(data:image\/[^"]+)"/);
      if (m) dataUrl = m[1];
    }
    if (!dataUrl) throw new Error('Aucune image dans la réponse — voir console pour détails');

    // Ensure dataUrl is a string
    if (typeof dataUrl !== 'string') dataUrl = JSON.stringify(dataUrl);

    // Convert to Blob and store in IndexedDB
    let blob;
    if (dataUrl.startsWith('data:')) {
      const [header, b64] = dataUrl.split(',');
      const mime = (header.match(/:(.*?);/) || [])[1] || 'image/png';
      blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: mime });
    } else {
      blob = await fetch(dataUrl).then(r => r.blob());
    }

    const idbKey = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    await this._idbPut(idbKey, blob);
    return { idbKey, blob };
  },

  // Build the <img> HTML tag to insert into a definition
  _buildImgHtml(idbKey, blobUrl, word) {
    return `<img data-idb-key="${idbKey}" src="${blobUrl}" alt="${word}" style="max-width:100%;max-height:200px;border-radius:8px;margin:6px auto 2px;display:block">`;
  },

  // ── MOF: toggle image panel visibility ───────────────────────
  _wfToggleImgPanel() {
    const panel = document.getElementById('wfImgPanel');
    const btn   = document.getElementById('wfDefImgBtn');
    if (!panel) return;
    const isHidden = panel.style.display === 'none';
    panel.style.display = isHidden ? '' : 'none';
    if (btn) {
      btn.style.background = isHidden ? 'rgba(52,211,153,0.18)' : 'rgba(52,211,153,0.08)';
      btn.style.borderColor = isHidden ? '#34D399' : 'rgba(52,211,153,0.35)';
    }
  },

  // ── MOF: generate image and insert into def ───────────────────
  async _wfGenerateImage(quality) {
    const word = this._wfCurrentWord;
    if (!word) return;
    const simpleBtn = document.getElementById('wfImgSimpleBtn');
    const smartBtn  = document.getElementById('wfImgSmartBtn');
    const activeBtn = quality === 'smart' ? smartBtn : simpleBtn;
    const origHtml  = activeBtn?.innerHTML;
    if (simpleBtn) { simpleBtn.disabled = true; simpleBtn.style.opacity = '0.5'; }
    if (smartBtn)  { smartBtn.disabled  = true; smartBtn.style.opacity  = '0.5'; }
    if (activeBtn) { activeBtn.classList.add('btn-processing'); activeBtn.style.opacity = '1'; }
    try {
      const context = this._wfGetContext();
      const { idbKey, blob } = await this._generateImageViaOpenRouter(word, quality, context);
      const blobUrl = URL.createObjectURL(blob);
      const imgHtml = this._buildImgHtml(idbKey, blobUrl, word);
      const appendMode = !document.getElementById('wfImgReplaceCheck')?.checked;
      const newDef = appendMode
        ? (this._wfCurrentDef ? this._wfCurrentDef + imgHtml : imgHtml)
        : imgHtml;
      this._wfCurrentDef = newDef;
      // Update MOF display
      const content = document.getElementById('wfDefContent');
      if (content) { content.innerHTML = newDef; App._idbHydrateImages(content); }
      const ta = document.getElementById('wfDefTextarea');
      if (ta) { ta.innerHTML = newDef; App._idbHydrateImages(ta); }
      this._wfUpdateFlipDot();
      // Mirror to Grenier card if same word
      const grCard = (this._grenier?.cards || []).find(c => !c.deleted && c.word?.toLowerCase() === word.toLowerCase());
      if (grCard) { grCard.definition = newDef; this.saveGrenier(); }
      // Hide panel after generation
      const panel = document.getElementById('wfImgPanel');
      if (panel) panel.style.display = 'none';
      const imgBtn = document.getElementById('wfDefImgBtn');
      if (imgBtn) { imgBtn.style.background = 'rgba(52,211,153,0.08)'; imgBtn.style.borderColor = 'rgba(52,211,153,0.35)'; }
      this.showToast('Image générée ✓');
    } catch(e) {
      console.error(e);
      this.showToast('Erreur lors de la génération d\'image');
    }
    if (simpleBtn) { simpleBtn.disabled = false; simpleBtn.style.opacity = ''; }
    if (smartBtn)  { smartBtn.disabled  = false; smartBtn.style.opacity  = ''; }
    if (activeBtn && origHtml) { activeBtn.classList.remove('btn-processing'); activeBtn.innerHTML = origHtml; }
  },

  // ── Grenier: toggle image panel visibility ────────────────────
  _grToggleImgPanel(cardId) {
    const panel = document.getElementById('grImgPanel');
    const btn   = document.getElementById('grDefImgBtn');
    if (!panel) return;
    const isHidden = panel.style.display === 'none';
    panel.style.display = isHidden ? '' : 'none';
    if (btn) {
      btn.style.background = isHidden ? 'rgba(52,211,153,0.18)' : 'rgba(52,211,153,0.08)';
      btn.style.borderColor = isHidden ? '#34D399' : 'rgba(52,211,153,0.35)';
    }
  },

  // ── Grenier: generate image and insert into card def ──────────
  async _grGenerateImage(cardId, word, quality) {
    const simpleBtn = document.getElementById('grImgSimpleBtn');
    const smartBtn  = document.getElementById('grImgSmartBtn');
    const activeBtn = quality === 'smart' ? smartBtn : simpleBtn;
    const origHtml  = activeBtn?.innerHTML;
    if (simpleBtn) { simpleBtn.disabled = true; simpleBtn.style.opacity = '0.5'; }
    if (smartBtn)  { smartBtn.disabled  = true; smartBtn.style.opacity  = '0.5'; }
    if (activeBtn) { activeBtn.classList.add('btn-processing'); activeBtn.style.opacity = '1'; }
    try {
      const context = document.getElementById('grCtxInput')?.value?.trim() || '';
      const { idbKey, blob } = await this._generateImageViaOpenRouter(word, quality, context);
      const blobUrl = URL.createObjectURL(blob);
      const imgHtml = this._buildImgHtml(idbKey, blobUrl, word);
      const appendMode = !document.getElementById('grImgReplaceCheck')?.checked;
      const card = this._grenier.cards.find(c => c.id === cardId);
      const newDef = appendMode
        ? (card?.definition ? card.definition + imgHtml : imgHtml)
        : imgHtml;
      if (card) { card.definition = newDef; this.saveGrenier(); }
      // Update Grenier display
      const display = document.getElementById('grDefDisplay');
      if (display) { display.innerHTML = newDef; App._idbHydrateImages(display); }
      const ta = document.getElementById('grDefTextarea');
      if (ta) { ta.innerHTML = newDef; App._idbHydrateImages(ta); }
      // Mirror to MOF if same word
      if (this._wfCurrentWord && card && card.word?.toLowerCase() === this._wfCurrentWord.toLowerCase()) {
        this._wfCurrentDef = newDef;
        this._wfUpdateFlipDot();
        const wfContent = document.getElementById('wfDefContent');
        if (wfContent) { wfContent.innerHTML = newDef; App._idbHydrateImages(wfContent); }
        const wfTa = document.getElementById('wfDefTextarea');
        if (wfTa) { wfTa.innerHTML = newDef; App._idbHydrateImages(wfTa); }
      }
      // Hide panel after generation
      const panel = document.getElementById('grImgPanel');
      if (panel) panel.style.display = 'none';
      const imgBtn = document.getElementById('grDefImgBtn');
      if (imgBtn) { imgBtn.style.background = 'rgba(52,211,153,0.08)'; imgBtn.style.borderColor = 'rgba(52,211,153,0.35)'; }
      this.showToast('Image générée ✓');
    } catch(e) {
      console.error(e);
      this.showToast('Erreur lors de la génération d\'image');
    }
    if (simpleBtn) { simpleBtn.disabled = false; simpleBtn.style.opacity = ''; }
    if (smartBtn)  { smartBtn.disabled  = false; smartBtn.style.opacity  = ''; }
    if (activeBtn && origHtml) { activeBtn.classList.remove('btn-processing'); activeBtn.innerHTML = origHtml; }
  },

  _grAppendSentenceToDef(cardId) {
    const resultEl = document.getElementById('grSentResult');
    const sentence = resultEl?.dataset.sentence;
    if (!sentence) return;
    const card = this._grenier.cards.find(c => c.id === cardId);
    if (!card) return;
    const newDef = card.definition ? card.definition + '\n\n' + sentence : sentence;
    card.definition = newDef;
    this.saveGrenier();
    // Update display
    const display = document.getElementById('grDefDisplay');
    if (display) { display.innerHTML = newDef; App._idbHydrateImages(display); }
    const ta = document.getElementById('grDefTextarea');
    if (ta) ta.innerHTML = newDef;
    // Mirror to MOF
    if (this._wfCurrentWord && card.word?.toLowerCase() === this._wfCurrentWord.toLowerCase()) {
      this._wfCurrentDef = newDef;
      this._wfUpdateFlipDot();
      const wfContent = document.getElementById('wfDefContent');
      if (wfContent) wfContent.innerHTML = newDef.replace(/\n/g, '<br>');
    }
    if (resultEl) resultEl.style.display = 'none';
    this.showToast('Phrase ajoutée à la définition ✓');
  },

};

// Démarrer l'application
    App.init();

    // Le service worker est ce qui distingue une vraie application installée
    // d'un simple raccourci : sans lui, le navigateur refuse d'installer et
    // l'appli ne s'ouvre pas hors réseau.
    //
    // Il n'existe que dans un contexte sécurisé — https, ou localhost. Sur
    // http://192.168.x.x il est tout simplement absent, ce qui est normal et
    // sans conséquence : l'appli fonctionne, elle ne s'installe pas.
    if ('serviceWorker' in navigator && window.isSecureContext
        && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          // Attendu quand l'appli est ouverte ailleurs que depuis son serveur
          // (copie locale, GitHub Pages) : il n'y a pas de /sw.js à cette
          // adresse. Rien à signaler à l'utilisateur.
          console.info('[PWA] service worker non enregistré :', err.message);
        });
      });
    }
  </script>
